# Development fixture for kind (locally built images, pull policy Never).
# Services switched off here on purpose: validator, legacy, propagation, coinbase,
# blockPersister, utxoPersister, bootstrap. With the validator off, the transaction
# path is NOT exercised even though blockAssembly, blockValidator and
# subtreeValidator run - transactions have no source, and money is neither created
# (coinbase) nor persisted. This fixture proves cluster shape, discovery and
# ingress wiring; for the money path use the production-shaped teranode-cr-mainnet.yaml.
apiVersion: teranode.bsvblockchain.org/v1alpha1
kind: Cluster
metadata:
  name: teranode-cluster
spec:
  image: ghcr.io/bsv-blockchain/teranode:v0.14.4
  alertSystem:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  asset:
    enabled: true
    spec:
      # No grpcIngress here: the asset service serves HTTP and WebSocket only
      # and starts no gRPC server. Omitting the field is not a statement about
      # the other services — several of them do run gRPC listeners and simply
      # keep them cluster-internal.
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      httpIngress:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        className: traefik-internal
        host: teranode.local
      httpsIngress:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        className: traefik-internal
        host: teranode.local
  blockAssembly:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  # The blob Pruner has no entry in this topology, and the operator examples carry no
  # pruner service: delete-at-height queues that Blockchain grows for the blockstore
  # and subtreestore are never drained, so shared storage grows with the chain rather
  # than being bounded by the retention settings their names suggest. The Docker
  # examples are where pruning actually runs today (see deploy/docker/mainnet).
  blockPersister:
    enabled: false
    spec: {}
  blockValidator:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  blockchain:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  bootstrap:
    enabled: false
    spec: {}
  coinbase:
    enabled: false
    spec: {}
  configMapName: teranode-operator-config
  # Secret holding sensitive settings (blockchain_store, utxostore, grpc_admin_api_key).
  # REQUIRED: include grpc_admin_api_key for Blockchain startup and all service clients.
  # Create it before applying this CR — see the installation docs.
  envFrom:
    - secretRef:
        name: teranode-operator-secrets
  legacy:
    enabled: false
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  peer:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
      grpcIngress:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: peer-grpc
        className: traefik-internal
        host: teranode.local
      wsIngress:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: p2p-ws
        className: traefik-internal
        host: teranode.local
      wssIngress:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: p2p-wss
        className: traefik-internal
        host: teranode.local
  propagation:
    enabled: false
    spec:
      grpcIngress:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: prop-grpc
        className: traefik-internal
        host: teranode.local
      serviceAnnotations:
        traefik.ingress.kubernetes.io/service.serversscheme: h2c
  rpc:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  sharedStorage:
    storageVolume: nfs-pv
    storageResources:
      requests:
        storage: 10Gi
  subtreeValidator:
    enabled: true
    spec:
      deploymentOverrides:
        imagePullPolicy: Never
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  utxoPersister:
    enabled: false
    spec: {}
  validator:
    enabled: false
    spec: {}

# The Secret referenced by spec.envFrom above is intentionally not committed here.
# The cluster will NOT come up until it exists: Blockchain refuses startup without
# grpc_admin_api_key. Create it first - the canonical copy lives in
# docs/howto/miners/kubernetes/minersHowToInstallation.md ("Create the Teranode
# Secret"); shape of the manifest, with placeholders:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: teranode-operator-secrets
#     namespace: teranode-operator
#   type: Opaque
#   stringData:
#     blockchain_store: "postgres://POSTGRES_EXAMPLE_URI_CHANGE_ME"
#     utxostore: "aerospike://AEROSPIKE_EXAMPLE_URI_CHANGE_ME"
#     grpc_admin_api_key: ""  # REQUIRED: openssl rand -hex 32, paste before applying
