apiVersion: v1
kind: ConfigMap
metadata:
  name: teranode-operator-config
data:
  # overwrite defaults from the main config: https://github.com/bsv-blockchain/teranode/blob/master/settings.conf
  SETTINGS_CONTEXT: "operator"
  network: "teratestnet"
  clientName: "teranode-operator"
  listen_mode: "listen_only"
  KAFKA_HOSTS: "kafka-shared:9092"
  KAFKA_REPLICATION_FACTOR: "1"
  KAFKA_PARTITIONS_HIGH: "1"
  aerospike_host: "aerospike"
  # blockchain_store, utxostore and grpc_admin_api_key are secrets and are
  # NOT stored here. They are provided via the Secret "teranode-operator-secrets",
  # which is referenced from the Cluster CR (spec.envFrom[].secretRef).
  # This Secret is intentionally not committed to the repo — create it yourself.
  # See docs/howto/miners/kubernetes/minersHowToInstallation.md ("Create the Teranode Secret").
  #
  # grpc_admin_api_key is also a shared secret and is NOT stored here: put it in the
  # "teranode-operator-secrets" Secret alongside blockchain_store/utxostore. It gates
  # every Blockchain RPC except HealthGRPC, and the protected gRPC admin RPCs
  # (setban/clearbanned, connect/disconnect peer, alert-driven bans, reset
  # reputation), which cross service boundaries. Blockchain refuses startup
  # without a valid shared key, including in development.
  # Use a strong random value (32+ chars) and supply it to all services and CLI clients.
  # recommended settings to tweak based on your deployment
  # Ingest guardrail pair - set together, never one without the other: the queue
  # cap gives block assembly a memory ceiling and the Kafka pause makes the
  # validator stop consuming before that ceiling starts refusing. A cap alone
  # turns overload into refusals; a pause alone protects no memory. The number
  # is a placeholder: bytes-per-item scales with input counts, so size it against
  # the block-assembly pods' headroom - see the sizing notes under
  # blockassembly_maxQueueItems in settings.conf. Where the validator is not
  # deployed (the development fixture) the pause key lies dormant, harmlessly.
  blockassembly_maxQueueItems: "2097152"
  validator_kafkaBackpressureEnabled: "true"
  # KAFKA_PARTITIONS_HIGH: "512"
  # txMetaCacheMaxMB: "32768"
