services:
  teraslab:
    container_name: teraslab
    # Override the version with TERASLAB_IMAGE if you want a different/local build.
    image: ${TERASLAB_IMAGE:-ghcr.io/icellan/teraslab:0.9.1}
    restart: unless-stopped
    # Give the server time to flush its checkpoint on shutdown.
    stop_grace_period: 60s
    environment:
      # Bearer token gating the admin dashboard (/admin/*, /ws/top) that the web
      # UI's live data needs — required because node.toml sets
      # enable_admin_endpoints = true. Supplied (and generated on first run) by
      # scripts/teraslab.sh and persisted under the gitignored data dir; never
      # hard-code a token here. `:?` fails fast with a clear message if you run
      # compose directly without it — use scripts/teraslab.sh.
      - TERASLAB_ADMIN_TOKEN=${TERASLAB_ADMIN_TOKEN:?set TERASLAB_ADMIN_TOKEN or start via scripts/teraslab.sh}
    ports:
      - "127.0.0.1:3300:3300" # wire protocol (utxostore = teraslab://localhost:3300)
      - "127.0.0.1:9100:9100" # HTTP health/observability + web UI (/health/live, /ui)
    volumes:
      - ./node.toml:/etc/teraslab/node.toml:ro
      # Working dir: slab device + redo/tombstone WAL — kept on local/internal
      # disk for the hot path (also the source the in-memory index rebuilds from).
      - ${TERASLAB_WORKDIR}:/data
      # Cold blobstore (tx bodies > 8 KiB) — large but cold, kept on the roomy
      # DATADIR volume. The server default is ./teraslab-blobstore (WORKDIR is /);
      # also bind the image's declared VOLUME /blobstore to the same dir so no
      # unused anonymous volume is created and the path is robust either way.
      - ${TERASLAB_BLOBDIR}:/teraslab-blobstore
      - ${TERASLAB_BLOBDIR}:/blobstore
