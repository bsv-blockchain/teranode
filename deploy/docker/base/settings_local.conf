# use this file to overwrite any default settings
# you can also use the environment variables in docker-compose.yml

# To participate on the Teranode network, you need to set the public address of your asset-cache deployment
# asset_httpPublicAddress.docker.m = https://teranode-1.example.com${asset_apiPrefix}

# This should be the IP or domain exposed to the public internet with P2P_PORT
# p2p_advertise_addresses.docker.m = teranode-1.example.com

listen_mode.docker.m = listen_only
# you can change listen_mode to full after opening your asset_httpPublicAddress
# listen_mode.docker.m = full

# Shared secret for the protected gRPC RPCs: the admin ones (setban/clearbanned,
# connect/disconnect peer, alert-driven bans, reset reputation) AND the P2P
# data-plane reporters that block and subtree validation call. Required because
# these services run in separate containers, so the calls cross the auth
# interceptor.
#
# Unset (the default) = those RPCs return Unauthenticated. For the reporters that
# means no peer ever becomes a proven sync candidate and catchup stays in the
# budget-gated probe tier: the node keeps running but never settles on a good sync
# peer. Set the SAME 32+ random chars for every service in the deployment.
# REQUIRED for a working multi-container node - uncomment and set a real value:
# grpc_admin_api_key.docker.m = <32+ char random secret, e.g. openssl rand -hex 32>
