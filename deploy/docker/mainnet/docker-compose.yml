x-teranode-settings:
  &teranode-settings
  environment:
    network: "mainnet"
    # blockpersister is off in this stack, so the pruner must trigger on mined blocks;
    # with the default OnBlockPersisted it waits for a notification that never arrives
    pruner_block_trigger: "OnBlockMined"
    # Persist the peer registry (reputation and ban scores) so a restart does not
    # forget every peer opinion. /app/data is the ${DATA_PATH}-backed volume mounted
    # into every service; only the blockchain service reads this key, and the fixed
    # envelope key lives entirely inside that directory.
    blockchain_peerRegistryStore: "file:///app/data/peer-registry"
    # logLevel: "DEBUG"
    # enable this when using your laptop or a server without a public ip
    # legacy_config_Upnp: "true"
    # someOtherSetting: "value"

networks:
  teranode-network:
    name: my-teranode-network
    # if your docker setup supports IPv6, you can enable it here
    # enable_ipv6: true

services:
  # Teranode micro-services
  blockchain:
    extends:
      file: ../base/docker-teranode.yml
      service: blockchain
    <<: *teranode-settings

  asset:
    extends:
      file: ../base/docker-teranode.yml
      service: asset
    <<: *teranode-settings

  asset-cache:
    extends:
      file: ../base/docker-services.yml
      service: asset-cache

  rpc:
    extends:
      file: ../base/docker-teranode.yml
      service: rpc
    <<: *teranode-settings

  legacy:
    extends:
      file: ../base/docker-teranode.yml
      service: legacy
    <<: *teranode-settings

  subtreevalidation:
    extends:
      file: ../base/docker-teranode.yml
      service: subtreevalidation
    <<: *teranode-settings

  blockvalidation:
    extends:
      file: ../base/docker-teranode.yml
      service: blockvalidation
    <<: *teranode-settings

  blockassembly:
    extends:
      file: ../base/docker-teranode.yml
      service: blockassembly
    <<: *teranode-settings

  pruner:
    extends:
      file: ../base/docker-teranode.yml
      service: pruner
    <<: *teranode-settings

  # Read the [Teranode Network](../README.md) documentation before enabling the peer service
  #  peer:
  #    extends:
  #      file: ../base/docker-teranode.yml
  #      service: peer
  #    <<: *teranode-settings

  # uses lots of disk space
  #  blockpersister:
  #    extends:
  #      file: ../base/docker-teranode.yml
  #      service: blockpersister
  #    <<: *teranode-settings

  # shared services
  postgres:
    extends:
      file: ../base/docker-services.yml
      service: postgres

  kafka-shared:
    extends:
      file: ../base/docker-services.yml
      service: kafka-shared

  kafka-console-shared:
    extends:
      file: ../base/docker-services.yml
      service: kafka-console-shared

  aerospike:
    extends:
      file: ../base/docker-services.yml
      service: aerospike-ee

  aerospike-exporter:
    extends:
      file: ../base/docker-services.yml
      service: aerospike-exporter

  prometheus:
    extends:
      file: ../base/docker-services.yml
      service: prometheus

  # This is Prometheus's own alert sink, NOT the Teranode alertSystem micro-service:
  # that service (rule-driven alerts and the coin-freeze brake) is not deployed in
  # this topology at all - the kubernetes examples are where it runs. Do not read
  # this entry as "alerting is covered" for Teranode-specific alarms.
  # Required: base/prometheus.yml points its `alerting` section at this host, so
  # without it Prometheus logs unresolvable-alertmanager errors on every reload.
  alertmanager:
    extends:
      file: ../base/docker-services.yml
      service: alertmanager

  grafana:
    extends:
      file: ../base/docker-services.yml
      service: grafana
