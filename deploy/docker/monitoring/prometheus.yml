global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Alert rules are mounted into /etc/prometheus by the compose file for this
# stack; the canonical copy lives in deploy/docker/base/blockassembly.rules.yml.
rule_files:
  - 'blockassembly.rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'teranode'
    static_configs:
      - targets: ['host.docker.internal:9091']

  - job_name: 'aerospike'
    static_configs:
      # this is the target for the docker based Aerospike exporter
      - targets: ['aerospike-exporter:10145']
      # if you have a dedicated aerospike cluster, you can add the aerospike cluster nodes here
      # see https://aerospike.com/docs/monitorstack/install/linux on how to install
      # - targets: ['172.x.x.x:9145', '10.x.x.x:9145']
