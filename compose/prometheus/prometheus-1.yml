global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Alert rules are mounted into /etc/prometheus by the compose file for this
# stack; the canonical copy lives in deploy/docker/base/blockassembly.rules.yml.
rule_files:
  - 'blockassembly.rules.yml'

scrape_configs:
  # - job_name: "prometheus"
  #   static_configs:
  #     - targets: ["localhost:9090"]

  - job_name: "teranode1"
    static_configs:
      - targets: ["teranode1:9091"]
  - job_name: "aerospike-exporter-1"
    static_configs:
      - targets: ["aerospike-exporter-1:9145"]
