  - name: bsv-ban-useragents.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVBanUserAgents"
    reason: >-
      Upstream tests bitcoind's configurable client-user-agent ban list
      (-banclientua / -allowclientua). Teranode implements the inverse,
      non-configurable rule in services/legacy/peer_server.go OnVersion: admit
      only agents containing "Bitcoin SV" or "BSV", ban the rest. The outcome
      assertions port; the configuration assertions cannot.
    upstream_assertions:
      - "a peer whose user agent matches the ban rule is banned, and its address appears in listbanned"
      - "a Bitcoin-Cash-flavoured user agent is banned under default settings"
      - "a peer whose user agent does not match the ban rule stays connected"
      - "with no ban patterns configured, a non-BCH client stays connected"
      - "ban patterns match by substring, not exact equality (ThisIsClientB_ matches ClientB)"
      - "user-agent matching is case-insensitive (ThisIsAnAbcClient is banned)"
      - "-allowclientua overrides a -banclientua match"
      - "specifying -banclientua replaces the built-in default ban set"
    waived_assertions:
      - "ban patterns match by substring, not exact equality: Teranode has no ban pattern list. Its allowlist does match by substring (strings.Contains), which the port exercises implicitly, but there is no ban-list semantics to assert."
      - "user-agent matching is case-insensitive: Teranode matches with strings.Contains and is therefore case-sensitive, so a lowercase \"bitcoin sv\" agent is banned where bitcoind would admit it. A deliberate behavioural difference, not a gap in the port; asserting the upstream behaviour would fail."
      - "-allowclientua overrides a -banclientua match: no Teranode counterpart; the rule is compiled in and has no allow-override setting."
