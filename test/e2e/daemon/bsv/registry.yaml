# BSV functional-test porting registry.
#
# Source of truth for the bitcoin-sv -> Teranode e2e porting exercise.
# HAND-MAINTAINED after initial generation. Update the entry in the same commit
# as the port. registry_test.go enforces consistency; see PORTING.md for the
# workflow and the meaning of each field.
#
# upstream: bitcoin-sv test/functional (commit recorded in PORTING.md)

# Gaps are the things standing between the current triage and a larger portable
# set. They are tracked here rather than in prose so the count of tests each one
# holds up stays honest, and so a gap cannot be quietly forgotten. Validated by
# TestRegistryGaps; see PORTING.md "Gap register".
gaps:
  - id: no-ban-score-for-invalid-transactions
    title: "A peer can send unlimited invalid transactions for free: no ban score, no disconnect"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-invalid-transactions.py, half of whose scenarios are
      built on the expectation that an invalid transaction is charged for.

      bitcoin-sv charges 100 ban-score points for a transaction that fails script
      verification, against a default -banscore of 100, so the FIRST bad
      transaction disconnects and bans the sender. Upstream leans on this
      deliberately: one scenario sets -banscore=10000000 to observe the
      not-yet-banned state, another sets -banscore=1 to observe the ban, and a
      third raises it to 101 specifically so that a single bad parent's 100 points
      do not ban the peer before the rest of the scenario can run. The comment
      there spells the arithmetic out.

      Teranode charges nothing. MEASURED: ten distinct script-invalid transactions
      from one peer, with legacy_config_BanThreshold overridden to 1 so that any
      score at all would ban. All ten drew their own reject, the peer stayed
      connected, and listbanned stayed empty.

      READ FROM CODE, which is the stronger evidence and explains why no threshold
      matters: the whole legacy service contains exactly two addBanScore call
      sites - an oversized getdata (peer_server.go:1438) and a malformed message
      (addBanScore(100, 0, cmd)). Neither is transaction validation. The
      transaction-failure path in SyncManager.handleTxMsg logs at
      netsync/manager.go:1284, pushes a reject at :1288, and returns. Nothing
      charges the peer, so the ban threshold is unreachable from this path however
      it is configured.

      This is the transaction twin of unsupported-inv-type-ignored-not-disconnected
      (raised as issue 4781), and the two are worth reading together: in both cases
      the mechanism to charge a peer exists and is used elsewhere one function away,
      and in both cases the cheap-to-send message is the unpoliced one. Here the
      asymmetry is sharper, because a script-invalid transaction costs the node a
      full GoBDK script verification - real CPU - while an unsupported inv vector
      costs only a goroutine.

      Bounded honestly. Validation cost is what an attacker buys, and Teranode's
      economics do not depend on ban scoring: rejected transactions never reach
      block assembly, and rejectedTxns remembers a refused hash so the same one is
      not re-requested. So this is a work-amplification and hygiene problem rather
      than a route to consensus damage. NOT ESTABLISHED: how expensive the most
      expensive cheaply-constructed invalid transaction is to verify, which is what
      would size the exposure. The ten transactions here were trivial ones.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4793, with the
      measurement also recorded on issue 4699 to settle its partial verdict. The
      fix is small and the
      pattern is already in the tree: charge a ban score where the transaction
      failure is handled, as the getdata handler does, and let the existing
      BanThreshold machinery do the rest. bitcoin-sv's 100-points-for-a-script-
      failure is the obvious number to copy, since it makes one bad transaction
      sufficient and that is the behaviour every upstream test is written against.

      Two things to decide rather than inherit. Whether every validation failure
      should score the same - a fee that is too low is a policy disagreement and
      arguably not misbehaviour, while a script that cannot verify is - and
      bitcoin-sv does distinguish these. And whether the orphan path should charge
      too, which interacts with orphan-rejection-not-reported-to-peer: a peer that
      parks invalid orphans currently pays nothing and is told nothing.

      Worth settling alongside issue 4781 rather than separately, since the question
      is the same one: what a legacy peer is charged for, and by which handlers.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-invalid-transactions.py
  - id: orphan-rejection-not-reported-to-peer
    title: "An orphan that fails validation once its parent arrives is refused silently, and three bugs sit in that one function"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-invalid-transactions.py, whose second scenario sends
      low-fee children before their parents and then asserts that every child draws
      a reject once its fee can finally be assessed.

      Teranode assesses them, refuses them, and tells the peer nothing. MEASURED:
      three low-fee orphans held with no reject while their parents were unknown -
      correct, and what upstream expects - then both parents accepted, then three
      internal failures logged as TX_INVALID (31) -> TX_POLICY (39) "transaction fee
      is too low" -> insufficient-fee, and ZERO rejects on the wire. The orphans
      never reached block assembly, so the node's decision was right; only the
      reporting is missing.

      The direct path and the orphan path diverge on this, a few lines apart.
      handleTxMsg logs at netsync/manager.go:1284 and then pushes a reject at :1288.
      processOrphanTransactions logs at :1346 and then `continue`s. No reject, no
      rejectedTxns entry, no ban score.

      Reading that function turned up two more defects in it, both worth fixing at
      the same time and neither costing coverage here:

      1. THE LOG NAMES THE WRONG TRANSACTION. Line 1346 is
      sm.logger.Errorf("Failed to process orphan transaction %v: %v", txHash, err),
      but txHash is the function's parameter - the PARENT whose acceptance triggered
      the walk - not the orphan that failed. MEASURED, and it is how this was
      noticed: three failures printed the same outer hash with three different inner
      [Validate][...] hashes. An operator reading the log cannot tell which
      transaction was refused, and it looks like one transaction failing three
      times. The value wanted is orphanTx.tx.TxIDChainHash().

      2. THE CONFLICTING-ORPHAN BRANCH DELETES THE WRONG KEY. At :1341 the
      double-spend case does sm.orphanTxs.Delete(*txHash) - again the parent, not
      the orphan - under a comment reading "remove the tx from the orphan pool, it
      is a double spend". READ FROM CODE, not measured: the conflicting orphan
      therefore stays in the pool and the parent's entry is removed instead. Same
      variable mix-up as the log line, which suggests one careless pass rather than
      two independent slips.

      Also, and stated as a nuisance rather than a leak because the bound is real:
      an orphan that fails permanently is left in the pool by the `continue`, so it
      is re-validated on every later parent acceptance that names it as a child
      until it ages out. orphanTxs is an expiringmap built with
      Legacy.OrphanEvictionDuration and WithMaxSize(Legacy.MaxOrphanTxs), so it is
      bounded in both time and size and cannot grow without limit - this is not
      another instance of the unbounded-orphan-pool class of defect. Deleting the
      orphan on a terminal failure would still be the right thing.

      Operationally the reporting gap costs a peer operator the ability to learn
      that a transaction they sent was refused at all - not merely why, which is the
      separate complaint in opaque-tx-reject-reason. A transaction sent as an orphan
      simply disappears.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4789. Three separable fixes in one
      function, in the order they matter.

      Push a reject when an orphan fails terminally, mirroring what handleTxMsg
      already does, and record it in rejectedTxns so the node does not re-request
      it. The peer that sent the orphan is known, so nothing needs plumbing through.
      Note the reason string will be as uninformative as every other one until
      opaque-tx-reject-reason is settled; that is an argument for fixing them
      together, not for delaying this.

      Correct the log to name orphanTx rather than txHash. One-line change, and it
      is the difference between a usable log and a misleading one.

      Correct the Delete at :1341 to remove the orphan rather than the parent, and
      delete the orphan on other terminal failures too rather than leaving it to
      age out.

      Care needed on one distinction: ErrTxMissingParent and ErrTxLocked are handled
      above and must keep skipping silently, because an orphan waiting on a SECOND
      parent has not failed and must not draw a reject. Upstream relies on exactly
      that - its fourth scenario asserts the orphans stay quiet while one parent is
      permanently missing - and the port asserts it too, so a fix that rejects too
      eagerly will fail that subtest rather than pass silently.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-invalid-transactions.py
  - id: sigops-limit-absent-pre-genesis
    title: "The pre-Genesis block sigops consensus limit is not implemented, and is unreachable behind checkpoints on every network that has them"
    kind: product-decision
    status: open
    impact: >-
      Found while porting bsv-sigopslimit-consensus-test.py, and recorded with its
      severity deliberately talked DOWN, because the reachability analysis is most
      of the finding.

      bitcoin-sv caps signature operations per block before Genesis and drops the
      cap after. GetMaxBlockSigOpsConsensusBeforeGenesis (src/config.cpp:825) is
      (1 + (blockSize-1)/ONE_MEGABYTE) * MAX_BLOCK_SIGOPS_PER_MB_BEFORE_GENESIS,
      so 20000 for any block up to a megabyte, counted by
      GetSigOpCountWithoutP2SH over every input scriptSig and output scriptPubKey,
      and enforced at validation.cpp:5805 only while !IsProtocolActive(era,
      Genesis) - the comment there reads "Sigops are not counted after Genesis
      anymore". Over the limit is REJECT_INVALID (16) "bad-blk-sigops" with DoS
      100.

      READ FROM CODE: Teranode counts signature operations per block nowhere, on
      either side of the fork. No MAX_BLOCK_SIGOPS constant, no per-block
      accumulator, nothing in model.Block.Valid. The only sigops setting is
      maxtxsigopscountspolicy, which is per TRANSACTION, is handed to BDK as
      SetMaxSigOpsPostGenesisPolicy - so POST-Genesis policy, not the pre-Genesis
      consensus rule - and is 4294967295 in settings.conf. Teranode's own
      documentation for that field says "BTC/BCH impose sigops limits per block and
      transaction; BSV removed this restriction". The two strings a block-level
      limit would need, bad-txns-too-many-sigops and high-sigops, appear in
      services/rpc/Server.go only inside a commented-out block.

      MEASURED, on regtest with the Genesis activation height moved to 6: a block
      at height 5 whose legacy sigop count is exactly 20001 - one over
      bitcoin-sv's allowance for a block of its size - is accepted and becomes the
      tip. The count was asserted, not assumed, the way upstream asserts it. A
      sibling block at exactly 20000 is also accepted, which both nodes agree on.
      Above the activation height the same 20001-sigop block is accepted, which is
      also agreement.

      WHY THIS IS NOT FILED AS A DEFECT, and the part worth checking before anyone
      changes that: the rule only ever applies below the Genesis activation height,
      and on every network where that range is non-trivial it sits entirely below
      the last checkpoint. Read from go-chaincfg v1.6.0: mainnet activates Genesis
      at 620538 and carries 34 checkpoints up to height 945000; testnet activates
      at 1344302 and carries 19 up to 1730000. So a fabricated pre-Genesis fork
      cannot be adopted on either - it fails the checkpoint hash-match, which
      #1387 recently tightened on the direct validate path. TeraTestNet and
      TeraScalingTestNet activate Genesis at height 1, so they have no pre-Genesis
      range to speak of. That leaves STN (activates at 100, no checkpoints) and
      regtest (10000, no checkpoints) - the second being why this port can measure
      the divergence at all.

      So the honest summary is: a consensus rule bitcoin-sv enforces and Teranode
      does not, unreachable on every network where it would matter, reachable only
      where it does not.

      NOT ESTABLISHED, and it is the question that decides whether this matters:
      whether Teranode intends to be able to validate the pre-Genesis chain
      WITHOUT trusting checkpoints. If it does, this is one missing rule among
      what is probably a family of them - upstream's genesis_upgrade_tests package
      covers about eleven more pre-Genesis limits (max ops per script, max script
      number length, max stack size, the multisig public key limit, P2SH
      acceptance, the CSV/CLTV sunset, transaction size limits), and none of them
      was checked here. If it does not, then relying on checkpoints for the
      historical range is coherent, and the useful action is to write that down
      rather than to implement anything.
    plan: >-
      UNLOGGED - awaiting review, and this one may well be a documentation change
      rather than a defect. Raised as a product-decision rather than a defect
      deliberately: the current design is coherent if checkpoints are accepted as
      the mechanism for the pre-Genesis range, and implementing a historical
      consensus rule is not a small change to make on a test's say-so.

      What the review should settle is the single question above - whether
      independent validation of the pre-Genesis chain is a goal. Everything else
      follows from it.

      If it is, the scope is not this one rule: audit the pre-Genesis side of
      genesis_upgrade_tests as a set, since the eleven-odd other limits there were
      not checked and the presumption from this one is that they are absent too.
      That is a piece of work worth sizing before starting, not a fix.

      If it is not, then the change is to say so where someone will find it -
      alongside the checkpoint list, or in the settings documentation for
      maxtxsigopscountspolicy, which currently explains that BSV removed the
      per-block limit without noting that the pre-Genesis one is unimplemented
      rather than inapplicable.

      Worth doing either way, and cheap: the port asserts the current behaviour in
      tripwires, so whichever way this is decided, the day a limit appears the
      test fails and says which gap to revisit.

      One correction to the port, made after it landed: the over-limit tripwire was
      originally a bare require.NoError, which reported "the gap has been fixed" for
      ANY ProcessBlock error. It fired once in a full-suite run and did not
      reproduce in two subsequent runs, so the cause was a transient failure under
      suite load rather than a sigops rejection - but the message asserted the
      opposite and cost time to rule out. The assertion now inspects the error and
      only claims the tripwire fired when the refusal actually mentions sigops.
      Recorded because the lesson generalises to every tripwire in this package: a
      tripwire that cannot tell its own trigger from an unrelated failure is worse
      than no tripwire, because it lies with authority.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-sigopslimit-consensus-test.py
  - id: reconsiderblock-ignores-ancestors
    title: "reconsiderblock refuses a block whose ancestor is still invalid, where bitcoin-sv clears both"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-command-line-invalid-block.py, and it is the scenario
      that script actually runs: invalidate two adjacent blocks, then reconsider the
      HIGHER of the two and expect the chain to come all the way back.

      bitcoin-sv can do that because Core's ResetBlockFailureFlags clears the failure
      flag on the named block's ancestors as well as its descendants, so naming any
      block in the invalidated span is enough. Teranode refuses:

        Block failed revalidation: [RevalidateBlock][<hash> (height: 4 ...)] failed
        block re-validation -> BLOCK_INVALID (11): [ValidateBlock][<hash>] parent
        block is invalid

      MEASURED both ways on the same chain shape, five blocks with heights 3 and 4
      invalidated. Reconsidering height 3, the lower, restores the chain to height 5
      in full - so the descendant walk works and clears the separately-invalidated
      block above it. Reconsidering height 4, the higher, fails with the error above
      and leaves the tip where it was. The failed call changes nothing, which is at
      least clean.

      So the capability is there and only the ancestor direction is missing. The
      operational cost is that an operator must know, and name, the LOWEST block they
      invalidated. Naming any other gets an error that describes the immediate cause -
      "parent block is invalid" - without saying which block to name instead, and an
      operator who invalidated several blocks over time during an incident has to
      reconstruct that order themselves.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4777. Report as a
      defect; it is a divergence from bitcoin-sv's documented behaviour for an RPC
      that exists to undo operator mistakes, which is exactly when a second,
      confusing error is least welcome.

      Cross-referenced from the issue: #4717 is adjacent and contradicted on this
      point. It claims RevalidateBlock leaves auto-inherited DESCENDANTS invalid,
      but reconsidering the lower of two separately-invalidated blocks restored the
      full chain, so the descendant direction works and the ancestor direction is
      the gap. That issue asks to be verified against master; this is a partial
      verdict on it.

      Two possible fixes and they are not equivalent. Either walk ancestors clearing
      the invalid flag, matching Core's ResetBlockFailureFlags, or keep the current
      restriction and make the error say what to do - naming the lowest invalid
      ancestor in the message would turn a dead end into an instruction. The first
      matches bitcoin-sv and is what a ported test would assert; the second is
      cheaper and may be preferable if the narrower behaviour is deliberate.

      Worth checking while in there, since it is the same code path and was not
      established: whether reconsiderblock on a block with NO invalidated ancestors
      but several invalidated descendants clears all of them, or only the first.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-command-line-invalid-block.py
  - id: reconsiderblock-error-contract
    title: "reconsiderblock returns the wrong RPC error code for an unknown block, and leaks the storage layer"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-command-line-invalid-block.py, which asserts
      assert_raises_rpc_error(-5, 'Block not found', reconsiderblock, <unknown hash>).

      MEASURED, Teranode returns code -25 with this message:

        Block failed revalidation: SERVICE_ERROR (59): [RevalidateBlock][1000...0000]
        failed to get block -> BLOCK_NOT_FOUND (10): error in GetBlock -> UNKNOWN (0):
        sql: no rows in result set

      Two separate problems. The code is wrong for the condition: -5 is
      RPC_INVALID_ADDRESS_OR_KEY, which is what bitcoind returns for an unknown
      block, while -25 is RPC_VERIFY_ERROR, meaning the block was rejected on its
      merits. A caller branching on the code cannot tell "no such block" from "that
      block is bad", and those call for different responses.

      And the message says far too much: four levels of internal error chain, the
      internal service and method names, and "sql: no rows in result set", which
      tells an unauthenticated-at-the-RPC-boundary caller that the backend is SQL
      and that the lookup reached it. The RPC surface is credentialed, so this is a
      disclosure to an operator rather than to the world - but it is still internal
      detail crossing a documented API boundary, and the same wrapping is likely to
      appear on other handlers.

      Worth noting as a contrast rather than a separate finding: this is the opposite
      failure to opaque-block-reject-reason and opaque-tx-reject-reason, where peers
      are told nothing useful. Peers get a fixed string with no cause; RPC callers get
      the whole internal chain. Both come from the same absent boundary - nobody is
      deciding what each audience should be told - so they are worth reviewing
      together even though the fixes point in opposite directions.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4778. Report as a
      defect, and settle it alongside the two opaque-reject gaps, since the
      underlying question is one question: what does each audience get told when
      something fails.

      For this handler specifically: map BLOCK_NOT_FOUND to -5 with the message
      "Block not found", matching bitcoind, and keep the internal chain in the log
      where it already goes - services/rpc/Server.go:1015 logs it in full, so nothing
      is lost by trimming what crosses the wire.

      Worth auditing at the same time whether other RPC handlers wrap internal errors
      into their responses the same way. The pattern here is a generic "wrap and
      return" rather than anything specific to reconsiderblock, so it probably is not
      the only one.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-command-line-invalid-block.py
  - id: tx-validation-timeouts-inert
    title: "The script-validation timeout settings are declared and documented but never loaded or read"
    kind: defect
    status: open
    impact: >-
      Found while establishing why bsv-pvq-timeouts.py cannot be ported. The two
      settings that script drives - maxstdtxvalidationduration and
      maxnonstdtxvalidationduration - exist in Teranode by name, with defaults of 3ms
      and 1000ms and long descriptions in settings/policy_settings.go explaining what
      they protect against. They do nothing.

      VERIFIED IN CODE, not inferred from the documentation. Every reference to
      MaxStdTxValidationDuration outside its own declaration is in
      policy_settings_test.go, which exercises the getter and setter against each
      other. The line in settings/settings.go that would populate it from
      configuration is COMMENTED OUT (settings.go:120-121), so the field is not even
      loaded - it would read as zero regardless of what an operator set. Nothing in
      the validator, in GoBDK's Go-side wrapper, or anywhere else consults it.

      Teranode's own documentation for these fields says so, twice and in almost
      those words: "Setting exists but timeout enforcement NOT actively implemented in
      current Teranode (placeholder for future)", and "Primary DoS protection is
      currently economic (fees scale with complexity)". So this is known rather than
      hidden. What makes it worth a gap anyway is that the settings are exposed on the
      configuration surface with plausible defaults and a description promising DoS
      protection, which is the same shape as legacy-whitelist-inert: a defence an
      operator can configure, verify is set, and reasonably believe is working.

      NOT ESTABLISHED, and it decides whether this matters at all: whether GoBDK
      imposes its own bound on script execution time or operation count. If it does,
      the economic argument in the documentation plus that internal bound may be
      adequate and these settings are merely misleading. If it does not, then script
      validation time is unbounded in a network whose restored opcodes - OP_MUL,
      OP_SUBSTR and the rest - exist specifically to allow expensive computation. That
      question was not answered here because it needs a reading of the C++ engine
      rather than the Go tree.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4792. Answer the GoBDK question first, because it decides
      whether this is a documentation defect or a missing defence.

      If GoBDK already bounds script execution, the fix is to stop advertising
      settings that do nothing: remove them, or mark them explicitly as unimplemented
      in the description rather than only in the middle of a long one. An operator
      grepping for DoS controls should not find a knob that silently has no effect.

      If it does not, then implementing the timeout is the real work, and the two
      settings are already specified for it - which is presumably why they were
      written down in the first place. Note the demotion behaviour bitcoin-sv pairs
      them with (move a slow transaction to a lower-priority queue rather than
      rejecting it) is a scheduling design, not part of the timeout itself, and
      Teranode need not copy it to get the protection.

      Worth doing either way, and cheap: uncomment or delete settings.go:120-121. A
      field that is declared, defaulted and documented but never loaded is a trap for
      the next person who reads the settings file.
    blocks: [bsv-pvq-timeouts.py]
    blocks_hooks: []
    found_while_porting: bsv-pvq-timeouts.py
  - id: no-pending-response-limit
    title: "A peer can queue unbounded response data by asking and never reading, measured at 349x for getheaders and 8857x for getdata"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-p2p-max-pending-responses.py, which exists because
      bitcoin-sv added a limit for exactly this. It supersedes an inconclusive
      measurement recorded against bsv-peer-flood.py, and the difference between the
      two attempts is the point.

      peer.queueHandler holds output for a peer in an unbounded list.List. When the
      peer stops reading, the socket write blocks, sendDoneQueue stops firing, and
      every further message is appended to that list with nothing to bound it.
      Teranode has no maxpendingresponses setting - the only pendingResponses in the
      tree is stallHandler tracking replies the node is waiting FOR, which is the
      other direction.

      The earlier attempt flooded pings and found no growth, and concluded nothing was
      demonstrable. That was a measurement problem: a ping response is a pong, so the
      amplification is about 1x and 30 MB of pings buys 30 MB of pongs. getheaders is
      the right lever, and it is the one upstream reaches for.

      MEASURED, on a 400-block chain: 200 getheaders requests sent from a connection
      that never read, then reading resumed and the socket drained. 6.19 MB came back
      containing ~200 headers messages - so every response was produced and held. Each
      request is 93 bytes on the wire and buys about 32.5 KB of queued response, which
      is 349x. The peer was never disconnected and the node stayed healthy.

      EXTRAPOLATED, not executed: a getheaders response is capped at 2000 headers,
      about 162 KB, so on any chain longer than 2000 blocks - which is every real one -
      the factor is about 1742x. A peer sending 1 MB of requests and reading nothing
      would have the node hold on the order of 1.7 GB for it. Nothing was driven to
      exhaustion here; 6.19 MB is what was actually observed, and the rest is
      arithmetic from the measured per-request figure and the documented cap.

      GETDATA IS WORSE, and this was the question left open above. A getdata naming
      one block is 61 bytes on the wire and buys the whole block. MEASURED: 20 such
      requests for the same ~900 KB block, from a connection that never read, queued
      10.30 MB - 1,220 bytes of request against 10,805,414 bytes of response, or
      8,857x. The peer was not disconnected and the node stayed healthy. Unlike
      getheaders there is no cap on the response: the factor scales with block size,
      so on a network with large blocks it has no ceiling worth quoting.

      bitcoin-sv bounds this separately from the pending-response count, with
      -factormaxsendqueuesbytes limiting total bytes queued across peers and answering
      REJECT_TOOBUSY once it is exceeded - see bsv-factorMaxSendQueuesBytes.py, which
      is blocked for want of it. So upstream has TWO defences here, a count and a byte
      budget, and Teranode has neither.

      Live heap growth during the flood read as NEGATIVE, which is not evidence of
      absence: the baseline was taken straight after mining 400 blocks, so collection
      of that garbage dominated the 6 MB under test. The drained-socket count is the
      reliable evidence here, not the heap figure.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4780. bitcoin-sv treats
      it as a defect and shipped a limit with a settable maximum per request type.

      Distinguished from #4700 in the issue, and the two should not be merged: that
      one covers a peer that READS, repeating identical getheaders to burn bandwidth
      and CPU, with the CPU half mitigated by the SQL responseCache. This is a peer
      that never reads, so responses accumulate in the output queue - memory retained
      on the node, which no response cache helps with - and it also covers getdata,
      which #4700 does not. The measurements do serve as partial verification for
      #4700's checklist.

      The fix has an established shape: count responses queued but not yet written per
      peer, and disconnect when the count exceeds a configured maximum.
      bitcoin-sv splits it per request type (-maxpendingresponses_getheaders,
      -maxpendingresponses_gethdrsen) because response sizes differ wildly by type,
      which is worth copying rather than using one global number. Bounding total
      queued BYTES rather than message count would be closer to the actual resource
      and is the obvious alternative.

      A byte budget matters more than a message count here, and the getdata numbers
      are why: bounding pending RESPONSES by count would still let a peer queue
      arbitrary megabytes with a handful of block requests. bitcoin-sv carries both,
      and if only one is implemented it should be the byte budget.

      Still unmeasured: whether the same holds for other large responses - getblocks
      and the extended-message paths - and whether the queue is per-peer or shared,
      which decides whether one peer can degrade service for the rest. Neither was
      established.
    blocks: [bsv-p2p-max-pending-responses.py, bsv-factorMaxSendQueuesBytes.py]
    blocks_hooks: []
    found_while_porting: bsv-p2p-max-pending-responses.py
  - id: legacy-wire-message-subset
    title: "The legacy wire implements a subset of the BSV protocol, missing four message families"
    kind: product-decision
    status: open
    impact: >-
      Established while porting bsv-merkle-pruned-block.py and
      bsv-getdata-datareftx.py, both of which turned out to need messages that do not
      exist. Recorded as reference rather than as a complaint: it bounds what this
      exercise can ever cover, and it is the kind of fact that is expensive to
      rediscover one script at a time.

      go-wire's command set, read from message.go, is: addr, authch, authresp, block,
      cfcheckpt, cfheaders, cfilter, createstrm, extmsg, exttx, feefilter, filteradd,
      filterclear, filterload, getaddr, getblocks, getcfcheckpt, getcfheaders,
      getcfilters, getdata, getheaders, headers, inv, mempool, merkleblock, notfound,
      ping, pong, protoconf, reject, sendcmpct, sendheaders, streamack, tx, verack,
      version.

      Four families bitcoin-sv speaks are absent:

        - gethdrsen / hdrsen, enriched headers carrying a coinbase merkle proof
        - datareftx, the miner-ID dataref transaction reply
        - blocktxn / getblocktxn / cmpctblock, compact blocks - note sendcmpct IS
          present, so a peer can negotiate compact blocks that cannot then be used
        - dsdetected, the double-spend notification, and revokemid

      SIZED HONESTLY, because the raw count misleads. Thirteen upstream scripts use
      one of these messages, but only TWO are bucket-A entries this exercise would
      otherwise have ported - bsv-merkle-pruned-block.py and
      bsv-getdata-datareftx.py, both now blocked. The other eleven were already
      classified B or C on their own merits. So the cost to coverage is two scripts,
      not thirteen.

      Most of the absences look deliberate rather than accidental. Compact blocks are
      a bandwidth optimisation for small-block networks and Teranode addresses the
      same problem with subtrees; miner ID and dsdetected are features rather than
      protocol plumbing. The one that reads oddly is sendcmpct being present while
      the three messages it negotiates are not: a peer that sends sendcmpct and is
      answered will believe compact blocks are available.
    plan: >-
      UNLOGGED - awaiting review, and mostly this needs a decision recorded rather
      than work done. Three separable questions.

      Whether the legacy wire is meant to be a full BSV peer or a sync client that
      speaks enough to fetch blocks. Everything else follows from that, and it is the
      same question legacy-block-announcement and headers-announcement-disconnects
      raise from the announcement side - worth answering once for all three.

      Whether sendcmpct should be withdrawn. Advertising a negotiation whose follow-up
      messages are unimplemented is the sort of thing that produces a confusing peer
      report rather than a clean unsupported. Not measured what a real peer does after
      negotiating and then getting nothing - worth checking before deciding it is
      harmless.

      Whether gethdrsen is worth having on its own merits. It is the only one of the
      four that is pure protocol rather than a feature, it gives a peer a coinbase
      merkle proof without downloading the block, and Teranode's subtree model should
      make producing one cheap.
    blocks: [bsv-merkle-pruned-block.py, bsv-getdata-datareftx.py]
    blocks_hooks: []
    found_while_porting: bsv-merkle-pruned-block.py
  - id: no-cpfp-ancestor-fee-accounting
    title: "There is no accepted-but-unmineable state, so child-pays-for-parent cannot work"
    kind: product-decision
    status: open
    impact: >-
      Found while porting bsv-cpfp.py, and it is why that script is blocked rather
      than partly ported.

      bitcoind keeps two fee thresholds. -mindebugrejectionfee decides what enters
      the mempool; -minminingtxfee decides what enters the mining candidate. A
      transaction between the two is accepted, held, and left out of blocks until a
      descendant arrives paying enough to cover the whole unpaid ancestry - at which
      point the ancestors become mineable too. That is child-pays-for-parent, and the
      upstream script walks through it transaction by transaction.

      Teranode has the same setting name and applies it at a different point.
      minminingtxfee is a policy check inside ValidateTransaction; its own settings
      documentation says "Fee checks are POLICY only ... BDK enforces the floor during
      ValidateTransaction in policy mode". So the threshold decides ACCEPTANCE, not
      mineability, and there is no state in between.

      MEASURED: a zero-fee transaction is refused outright with "TX_POLICY (39):
      transaction fee is too low". A one-satoshi-fee transaction is accepted and
      appears in the mining candidate immediately - getminingcandidate num_tx goes
      from 0 to 1 with no intermediate state in which it is held but not mined. There
      is nothing for a child to rescue, because an underpaying parent never got in.

      Consequences worth weighing, none of which this exercise can settle.

      For senders: a transaction that underpays cannot be fixed by a child. On
      bitcoind it waits in the mempool and a CPFP child rescues it; here it is
      refused, so the sender must construct and send a replacement. Wallets that
      implement fee bumping by CPFP - the standard approach, since BSV has no RBF -
      have nothing to bump.

      For miners: no ability to hold marginal transactions speculatively in the hope
      of a paying descendant. Whether that is worth having at BSV fee levels is a
      commercial judgement, not a technical one.

      In its favour: one threshold is simpler, gives the sender an immediate and
      unambiguous answer rather than silent limbo, and removes a queue an attacker
      could fill with transactions that never become mineable. This is filed as a
      product-decision rather than a defect because the current design is coherent
      and may well be deliberate.
    plan: >-
      UNLOGGED - awaiting review, and this one genuinely is a decision rather than a
      fix. The question is whether Teranode intends to support CPFP at all.

      If yes, it needs the second threshold: accept above a relay floor, mine above a
      higher mining floor, and account for unpaid ancestry when a descendant arrives.
      That is a real feature in block assembly, not a configuration change, and it
      brings the queue-filling exposure that goes with holding unmineable
      transactions.

      If no - which is defensible - then the useful action is documentation rather
      than code. minminingtxfee shares a name with a bitcoind setting that does
      something materially different, and an operator migrating from bitcoind would
      reasonably expect the bitcoind behaviour. Saying plainly that Teranode refuses
      rather than defers, and that CPFP is therefore not available, would prevent that
      surprise.

      Since resolved: bsv-cpfp-1000-children.py was read and depends on the same
      absent state - its zero-fee parent is refused at validation, so the secondary
      mempool it then asserts about never contains anything. It is blocked on this
      gap. bsv-conflict.py ported cleanly, so the double-spend eviction territory is
      unaffected.
    blocks: [bsv-cpfp.py, bsv-cpfp-1000-children.py]
    blocks_hooks: []
    found_while_porting: bsv-cpfp.py
  - id: headers-announcement-disconnects
    title: "A peer that announces a block by header is disconnected, which is how BSV peers announce blocks"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-accept-header-with-ancestor.py, whose first step is to
      announce a header and expect a getdata. Teranode disconnects instead.

      SyncManager.handleHeadersMsg (services/legacy/netsync/manager.go:2054) rejects
      any headers message that arrives while headersFirstMode is not set:

        if !sm.headersFirstMode.Load() {
                reason := fmt.Sprintf("Got %d unrequested headers from %s", ...)
                peer.DisconnectWithWarning(reason)
                return
        }

      headersFirstMode is an initial-sync state, so on a node that has caught up any
      headers message at all is treated as misbehaviour. The rule is inherited from
      btcd, where headers are only ever expected as the answer to a getheaders the
      node itself sent.

      That is not how BSV peers announce blocks. Since BIP130 a peer that has sent
      sendheaders announces new blocks by pushing a headers message, and bitcoin-sv
      answers one with a getdata for the block - which is precisely what the upstream
      script asserts. A peer following the norm is disconnected by Teranode.

      MEASURED: a peer announcing one valid header on a caught-up node is dropped
      within seconds and the node's peer list empties. The disconnect is specific to
      the announcement direction, not to headers generally - the same peer sending
      getheaders is answered with headers and keeps its connection, which the port
      asserts as a control.

      This compounds with legacy-block-announcement rather than duplicating it. That
      gap is the node not volunteering its own blocks to legacy peers; this is the
      node refusing to be told about theirs, and punishing the attempt. Together they
      leave legacy peering unable to participate in block announcement in either
      direction: Teranode learns of new blocks only by asking, and tells no one.

      NOT ESTABLISHED: what happens on a real network in practice. A peer that is
      disconnected will reconnect, and Teranode may still discover the block by
      polling with getheaders on its own schedule, so the operational cost may be
      churn and latency rather than missed blocks. Establishing that needs a
      two-node test against a real bitcoin-sv peer, which this exercise cannot set
      up - see peer-id-empty-under-test-context for why multi-node pairing is
      unavailable here.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4785, and worth reading
      together with
      legacy-block-announcement since they are two halves of one picture and a fix
      for either alone leaves the other.

      The fix is to distinguish an announcement from an unsolicited flood rather than
      treating all headers outside initial sync as misbehaviour. bitcoin-sv's rule is
      the model: accept a headers message, and if it extends a known chain, request
      the blocks. Bounding it is reasonable - a cap on how many unrequested headers a
      peer may send before it is charged for them - but the current behaviour has no
      middle setting between initial sync and disconnect.

      Two things to settle first. Whether Teranode's legacy service is intended to
      participate in block announcement at all, or is meant purely as a
      pull-based sync client with libp2p doing real peering - that decision covers
      both gaps and should be made once. And what a real bitcoin-sv peer does after
      being disconnected this way, which decides whether this is a latency problem
      or a connectivity one.
    blocks: [bsv-log-time-diff.py, minchainwork.py, bsv-toobusyrejectmessage.py, bsv-check-ttor-violation.py]
    blocks_hooks: []
    found_while_porting: bsv-accept-header-with-ancestor.py
