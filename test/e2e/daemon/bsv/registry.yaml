  - name: bsv-genesis-chronicle-pushonly-nonstd.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVGenesisChroniclePushOnlyNonStd"
    upstream_assertions:
      - "with -acceptnonstdtxn=1, before Genesis a transaction whose unlocking script is not push-only is accepted"
      - "with -acceptnonstdtxn=1, from Genesis the same transaction is refused, SIGPUSHONLY having become mandatory"
      - "the Genesis refusal reason is 'mandatory-script-verify-flag-failed (Only non-push operators allowed in signatures)'"
      - "from Chronicle the transaction is accepted again when its version is 2"
      - "from Chronicle a version 1 transaction is still refused, with the same mandatory-script-verify reason"
      - "with -acceptnonstdtxn=0, before Genesis the transaction is refused at IsStandardTx policy level, with reason 'scriptsig-not-pushonly'"
      - "with -acceptnonstdtxn=0, from Genesis it is refused with the mandatory-script-verify reason rather than the policy one"
      - "with -acceptnonstdtxn=0, from Chronicle a version 2 transaction is accepted and a version 1 one is still refused"
      - "framework-implied: each verdict is taken against the height of the NEXT block, not the tip - upstream's comments read 'tip is on height 101 (nHeight=102, pre-genesis)'"
    waived_assertions:
      - "the -acceptnonstdtxn=0 pass, all four of its verdicts: Teranode has no standardness switch, so the pass cannot be set up. Measured, it behaves as upstream's -acceptnonstdtxn=1 node does - it accepts a non-push-only unlocking script before Genesis rather than refusing it as non-standard - so the reproduced pass is the second one. The distinction upstream draws between a policy refusal and a mandatory-verification refusal is not observable here for the same reason, and also because the two would be indistinguishable through the propagation client: see opaque-tx-reject-reason."
      - "the refusal reasons, 'scriptsig-not-pushonly' and 'mandatory-script-verify-flag-failed (Only non-push operators allowed in signatures)': the propagation client flattens every script failure to 'TX_INVALID (31): GoBDK fail to ValidateTransaction' and the wire reject carries the fixed string 'rejected'. See the opaque-tx-reject-reason gap. The port asserts that each transaction is refused, and distinguishes the eras by WHICH transactions are refused rather than by why - the version-2 acceptance at Chronicle is what pins the rule, since a node refusing for some unrelated reason would refuse that one too."
    reason: >-
      Ported, and Teranode is correct on all four verdicts it can be asked for,
      including the version gate. Recorded as ported-partial only because upstream's
      second node configuration and its reason strings are out of reach, not because
      any behaviour diverges.

      Worth having as a test rather than a note: Chronicle is ahead of the network,
      not behind it - go-chaincfg marks every ChronicleActivationHeight "temporary
      and subject to change" - so this covers a consensus rule that has not been
      exercised in production. MEASURED with Genesis at 6 and Chronicle at 9: a
      non-push-only unlocking script is accepted when validated at height 4, refused
      at 6, accepted at 9 with version 2, and refused at 9 with version 1.

      The version-1-still-refused case is the one that makes the set meaningful. A
      node that had implemented Chronicle as a plain repeal of SIGPUSHONLY rather
      than a version-gated relaxation would pass the version-2 assertion and fail
      only this one.

      Deliberate overlap with bsv-genesis-pushonly.py: that port approaches the
      Genesis boundary through block validation and carries the readmission tripwire
      for validated-tx-not-rechecked-across-activation, while this one approaches it
      through transaction submission and continues to Chronicle, which nothing else
      reaches. The two agree about the boundary, which is itself worth something.

      Harness note: this port added wirepeer.WithChronicleActivationHeight, the
      companion to WithGenesisActivationHeight, safe for the same reason - the daemon
      copies the chain params before applying overrides.
