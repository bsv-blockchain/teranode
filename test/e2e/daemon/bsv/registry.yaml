  - id: opaque-block-reject-reason
    title: "Teranode's wire reject gives the same reason for every invalid block"
    kind: defect
    status: open
    impact: >-
      Found while porting invalidblockrequest.py. When block validation fails,
      netsync/manager.go answers the peer with
      PushRejectMsg(CmdBlock, RejectInvalid, "block rejected", hash) — the reject
      code (16) matches bitcoin-sv, but the reason is that one fixed string
      whatever went wrong, while the specific cause is available at the call site
      in the error being handled. A peer therefore cannot tell a duplicated
      transaction from an over-paying coinbase from a bad merkle root. bitcoin-sv
      sends bad-txns-duplicate, bad-txns-inputs-duplicate, bad-cb-amount and so on,
      and the functional tests assert on exactly those strings, so this is the
      single reason the three reject assertions in invalidblockrequest.py cannot be
      reproduced over the wire. Operationally it costs a peer operator the ability
      to diagnose why their block was refused without access to our logs.
      Interesting counter-example: the duplicate-input case does surface upstream's
      string verbatim, because GoBDK — the same script engine bitcoin-sv runs —
      produces it. The reason strings exist inside Teranode; they are lost at the
      wire boundary.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4772.
      Report as a product defect. The fix is localised: derive the reject reason
      from the error already in hand at the PushRejectMsg call site rather than
      hardcoding it. Care is needed not to leak internal error text to peers —
      bitcoin-sv's strings are a short closed vocabulary, and matching it is the
      point — so a mapping from Teranode error to upstream reason string is
      preferable to passing err.Error() through. Until fixed, ports assert
      rejection reasons on the ProcessBlock error instead of over the wire.
    blocks: []
    blocks_hooks: []
    found_while_porting: invalidblockrequest.py
  - id: setban-address-format
    title: "setban never registers a ban with the legacy service, so operators cannot ban legacy peers"
    kind: defect
    status: open
    impact: >-
      Found while porting disconnect_ban.py. handleSetBan validates its argument
      as a bare IP or CIDR (services/rpc/handlers.go isIPOrSubnet), but the legacy
      leg compares it against sp.Addr(), which is "IP:port"
      (services/legacy/Server.go banPeer) — so the comparison never matches and
      the call returns "tried to ban legacy peer but peer not found". The ban is
      not merely ineffective, it is never recorded with the legacy service at all:
      with the legacy service alone setban fails outright, and with the P2P
      service running the ban lands only in that service's list, which is why
      listbanned shows it while the legacy peer stays connected. Two ban paths
      exist and only one is broken — the node still bans legacy peers on
      misbehaviour (server.BanPeer in peer_server.go, called with the peer object,
      no address matching involved, and exercised by the bsv-ban-useragents.py
      port). What does not work is banning on request. Operationally an operator
      cannot evict or block a legacy peer, which is the main thing setban exists
      for. Unbanning a subnet separately logs "can't split ban peer 10.0.0.0/24:
      missing port in address".
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4773.
      Report as a product defect. The fix is small and localised, because
      enforcement already keys on the bare host: peer_server.go splits the host off
      and looks up state.banned by IP, both on admission and in OnBlock. So the
      ban list already speaks the same language setban does, and only banPeer's
      comparison disagrees — compare hosts rather than host:port, and CIDR-match
      subnets, then have handleUnbanPeerMsg accept CIDR too. Not verified: whether
      a peer is refused on reconnection after an automatic ban. That is read from
      the lookup being keyed by host, not tested. Until fixed, ports run against a
      daemon with both peer services (NewLegacyDaemonWithP2P) and waive the
      disconnect assertion.
    blocks: [disconnect_ban.py]
    blocks_hooks: []
  - id: block-before-parent-dropped-and-not-reconsidered
    title: "A block delivered before its parent is reported accepted, silently not retained, and never reconsidered when the parent arrives"
    kind: defect
    status: open
    impact: >-
      Found while porting p2p-fullblocktest.py, whose b12/b13/b14 sequence exists
      to test exactly this: upstream withholds b12, delivers b13, asserts b13 is
      accepted but does not become the tip, then delivers b12 and asserts the tip
      becomes b13. Teranode does the first half and not the second.

      MEASURED, on a chain where b12 and b13 are a two-block branch off a common
      ancestor and b13 is one block higher than the current tip. ProcessBlock for
      b13, whose parent b12 has never been delivered, returns NIL - no error - and
      the tip correctly does not move. So far this matches upstream. b12 is then
      delivered and is itself accepted: it appears in getchaintips at its own
      height with status valid-headers. The tip does NOT advance to b13, and b13
      does not appear in getchaintips at all - not as valid-headers, not as
      valid-fork, not as invalid. It is simply absent, so it was not retained
      anywhere the node will revisit.

      MEASURED, and it is what makes this a defect rather than a design choice:
      re-delivering the IDENTICAL b13 immediately afterwards succeeds and the tip
      advances to it within milliseconds. Nothing about the block changed. The
      only difference is that its parent was known at the moment of delivery. So
      the block was valid and connectable all along, and the first delivery threw
      it away.

      Two separable problems. The first is the false success: ProcessBlock returns
      no error for a block it discards, so a caller cannot tell "accepted" from
      "silently dropped" and has no signal that a re-send is required. The second
      is the absent retention: a block whose parent is not yet known is neither
      queued nor recorded, so the parent's later arrival triggers no
      reconsideration. bitcoin-sv holds such a block and connects it when the
      parent lands, which is what upstream's assertion encodes.

      NOT ESTABLISHED, and it decides the severity rather than the correctness.
      Whether the legacy wire path can deliver blocks out of order in normal
      operation. netsync requests blocks in order and the catchup machinery is
      built around that, so the reachable route may be limited to direct
      ProcessBlock callers rather than to a remote peer. If a peer CAN cause it -
      by announcing two blocks whose getdata responses race, for instance - then a
      node can silently miss a block and only recover when some later mechanism
      re-offers it. That was not driven here and should not be assumed either way.

      Also not established: whether any higher-level retry eventually re-offers
      the dropped block in a running node. The test observes a single delivery and
      a 30-second window, not a live peer session.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4794. Establish reachability from the wire before
      sizing this, since that is what separates a caller-contract wart from a
      block-loss bug: drive two blocks over wirepeer in reverse order and see
      whether the same drop occurs, rather than reasoning from netsync's ordering
      guarantees. That test is cheap and belongs in this package regardless of the
      outcome.

      Independently of reachability, the false success is worth fixing on its own
      and is the smaller change: ProcessBlock should tell the caller that a block
      could not be connected because its parent is unknown, rather than returning
      nil for a block it drops. A typed error the caller can branch on would let
      the legacy service decide whether to request the parent, hold the block, or
      discard it deliberately.

      The retention half is the larger question and is really a design decision:
      whether Teranode should hold an unconnectable block at all. It already holds
      unconnectable TRANSACTIONS in a bounded orphan pool with an eviction
      duration and a size cap, so the pattern and its safety argument exist in the
      tree - see the orphan pool discussed in
      orphan-rejection-not-reported-to-peer. A bounded equivalent for blocks would
      make the upstream assertion pass and would close the block-loss route if one
      exists. Doing nothing is defensible only if reachability from a peer is
      shown to be impossible.

      Until decided, the port asserts Teranode's actual behaviour as a tripwire -
      that b12's arrival does NOT connect b13, and that a re-delivery does - so
      the day this is fixed the test fails and says so.
    blocks: []
    blocks_hooks: []
    found_while_porting: p2p-fullblocktest.py
  - id: merkle-proof-rpcs-unimplemented
    title: "None of the four merkle-proof RPCs answer, so no port can obtain or verify a transaction inclusion proof"
    kind: product-decision
    status: open
    impact: >-
      Found while porting merkle_blocks.py, then confirmed against merkle_proof.py.
      Both scripts are built entirely on merkle-proof RPCs - every assertion in
      either one calls at least one of them - so neither can be ported at all
      rather than ported partially.

      MEASURED, each against a running daemon rather than inferred from the
      dispatch table, because the two halves fail differently and the codes
      matter. bitcoin-sv's Core-inherited pair answers -1 "Command unimplemented":
      gettxoutproof and verifytxoutproof are both wired to handleUnimplemented
      (services/rpc/Server.go:197 and :216). Note that parameter validation runs
      FIRST, so a malformed call returns -32602 and only a well-formed call
      reaches the unimplemented handler - worth knowing for anyone probing this.
      BSV's own pair does not exist at all: getmerkleproof and verifymerkleproof
      are absent from Server.go and return -32601 "Method not found".

      So all four are unavailable, by two different routes, and the BSV-specific
      pair is the one Teranode would more plausibly be expected to have.

      WHY THIS IS RECORDED AS A PRODUCT DECISION rather than a defect. Implementing
      them widens Teranode's public RPC surface, which this exercise deliberately
      does not do - the same reasoning that holds submitblock-rpc and
      net-rpcs-unimplemented. It is worth noting that Teranode's data model should
      make a proof CHEAP to produce rather than expensive: a subtree is already a
      merkle structure over transactions, and the gap register's
      legacy-wire-message-subset entry makes the same observation about gethdrsen,
      which wants a coinbase merkle proof. So the obstacle here is an API decision,
      not a missing capability.

      NOT ESTABLISHED: whether the asset server already exposes an equivalent
      proof over HTTP. If it does, these ports might be restructured against that
      surface instead of waiting for the RPCs, and the cost of this gap drops to
      nearly nothing. That was not checked, and checking it is the cheapest next
      step here.
    plan: >-
      UNLOGGED - awaiting review, and the first question is not whether to
      implement the RPCs. Check whether the asset server already serves a
      transaction inclusion proof. Teranode's subtrees are merkle structures over
      exactly the transactions a proof needs, so an equivalent may already be
      reachable over HTTP, in which case merkle_blocks.py and merkle_proof.py can
      be restructured against it and this gap costs no coverage.

      If it does not exist anywhere, then this belongs with submitblock-rpc and
      net-rpcs-unimplemented as one decision about how wide Teranode's public RPC
      surface should be, taken deliberately and not as a side effect of wanting two
      tests to pass. Of the four, getmerkleproof and verifymerkleproof are the pair
      worth arguing for: they are BSV's own, and an SPV client asking a node to
      prove a transaction is in a block is the use case the subtree model already
      serves internally.
    blocks: [merkle_blocks.py, merkle_proof.py]
    blocks_hooks: []
    found_while_porting: merkle_blocks.py
