      that bitcoind writes to an invalidtxs directory under its data dir, configured
      by -invalidtxsink; there is no equivalent sink, directory or record in Teranode,
      so there are no files to count, name-match or parse. The test also requires ZMQ
      (check_zmq_test_requirements), which is a second independent dependency.

      The underlying idea - a durable, structured record of why a transaction was
      rejected - is interesting next to opaque-tx-reject-reason, which is about the
      same information being unavailable over the wire. Recorded here as an
      observation, not proposed as work.
