  - id: unknown-command-disconnects-off-regtest
    title: "Teranode disconnects any peer sending a message command go-wire cannot decode, including nine a real bitcoin-sv node can send"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-empty-msg-cmd.py. Ignoring unrecognised message
      commands is a deliberate extensibility rule in the reference
      implementation, stated in the code: "Ignore unknown commands for
      extensibility" (net/net_processing.cpp). It is what lets the network add a
      message type without partitioning itself.

      Teranode does not follow it. go-wire's makeEmptyMessage returns an error for
      any command it has no case for, which peer.inHandler treats as a malformed
      message: a "malformed" reject followed by DisconnectWithWarning. The one
      escape is isAllowedReadError, a btcd-inherited regression-test affordance
      that tolerates the error only when ChainCfgParams.Net is RegTestNet AND the
      peer is 127.0.0.1. Every wirepeer test satisfies both, which is the only
      reason TestBSVEmptyMsgCmd observes upstream's outcome at all. On mainnet or
      testnet the same frame costs the peer its connection.

      This is not hypothetical. Comparing bitcoin-sv's NetMsgType table against
      go-wire v1.2.10's makeEmptyMessage, nine commands a bitcoin-sv node can put
      on the wire have no case: blocktxn, cmpctblock, datareftx, dsdetected,
      getblocktxn, gethdrsen, hdrsen, revokemid, sendhdrsen.

      dsdetected is the sharpest of them, because it needs no negotiation and no
      request. On receiving a valid double-spend-detected message a bitcoin-sv
      node relays it to every peer it has (net/net_processing.cpp, ForEachNode) -
      so a Teranode legacy peer on a live network is disconnected by an ordinary,
      correct peer doing the thing that message exists for, and is disconnected
      again on reconnect the next time one propagates.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4770.
      Not fixed here; a porting change should not also change node behaviour. Two
      separable pieces. The rule itself: an unrecognised command should be
      discarded and the peer left alone on every network, not only under the
      regtest affordance - that is the interop-correct behaviour and the smaller
      change. Then, separately, decide which of the nine Teranode should actually
      understand rather than merely tolerate; dsdetected and the hdrsen family are
      the ones with live traffic behind them. It stands on its own merits rather
      than on this exercise's: the coverage cost here is nil, the cost on a real
      network is dropped peers.
    blocks: []
    found_while_porting: bsv-empty-msg-cmd.py
    blocks_hooks: []
  - id: validated-tx-not-rechecked-across-activation
    title: "A transaction validated below an activation height is never re-verified above it, so two nodes can disagree on the same block"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-genesis-pushonly.py, then diagnosed and measured. The
      port's waived assertion - that a non-push-only transaction is absent from the
      mempool after its block is invalidated - looked like mempool bookkeeping
      Teranode has no counterpart for. It is not. The underlying behaviour is a
      consensus one.

      Teranode stores a transaction's validation verdict in the UTXO store keyed by
      txid alone. Subtree validation script-verifies only the transactions whose
      metadata is ABSENT: ValidateSubtreeInternal
      (services/subtreevalidation/SubtreeValidation.go) batch-decorates every hash
      in the subtree, and routes only the unset ones through
      processMissingTransactions -> blessMissingTransaction -> validator. A
      transaction already in the store is accepted on the strength of stored
      metadata that records no script flags, and therefore no activation height.

      Measured on one node, Genesis moved to height 6, two transactions of identical
      shape whose unlocking script is OP_1 OP_1 OP_ADD, each in its own candidate
      block at height 7. The transaction the node had never seen is rejected: TX_INVALID
      (31), GoBDK "Only non-push operators allowed in signatures". The transaction the
      node validated at height 4 is ACCEPTED and becomes the tip. Same node, same
      rule, same height, opposite verdicts - the only difference is whether the node
      had seen the transaction before the fork.

      That is a chain split at an activation boundary, not a bookkeeping divergence:
      a node that saw the transaction pre-activation accepts the block, a node that
      did not rejects it. Reaching it needs no invalidateblock - an ordinary reorg
      does, because a reorg onto a longer competing chain moves the tip FORWARD past
      the activation height while dropping the block that held the transaction.
      Block assembly then readmits it: loadUnminedTransactions
      (services/blockassembly/BlockAssembler.go) filters only on Skip,
      already-mined-on-best-chain, and optional input-conflict checks
      (validateUnminedTxInputs, which looks at input existence and double spends,
      never at scripts), and subtreeProcessor.Reorg re-adds moveBackBlocks'
      transactions for re-mining. Nothing on the mining path re-checks either:
      submitMiningSolution runs model.Block.Valid, which is header, PoW, coinbase
      and merkle structure only, then calls blockchainClient.AddBlock directly.
      Measured: the readmitted transaction was mined into a block at height 7.

      bitcoin-sv defends against exactly this and names it. GetScriptCacheKey(tx,
      flags) puts the flags in the script-cache key, and because per-INPUT flags
      still are not covered, FinalizeEraCrossing (src/validation.cpp) clears the
      mempool and the script execution cache whenever a height transition crosses
      the Genesis or Chronicle line - called from both ConnectTip and DisconnectTip,
      so in either direction. The comment at src/validation.cpp:2699 states the
      reason outright. Teranode has no equivalent invalidation.

      Chronicle makes this live rather than historical: go-chaincfg carries a
      mainnet ChronicleActivationHeight marked "temporary and subject to change", so
      the boundary is ahead of the network, not behind it.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4769.
      Escalate as a product defect outside this exercise - it is consensus
      behaviour, and a porting change must not alter node behaviour. The fix has the
      shape bitcoin-sv already settled on: make a stored validation verdict carry
      the script flags, or the activation era, it was produced under, and re-verify
      when the era of the height being validated differs. Note that Teranode has no
      single cache to flush - the verdict lives in the UTXO store as durable
      metadata, so FinalizeEraCrossing's clear-everything approach does not
      transplant directly, and the era needs to be part of what is stored or part of
      what is checked.

      Two things left to establish, carried into the issue, neither of which changes
      the finding above. Whether the same reasoning reaches other height-dependent
      consensus rules that are checked once at validation time and then trusted
      (nLockTime finality, coinbase maturity) - the caching mechanism is generic, so
      the presumption is yes. And whether a node syncing from scratch, which
      validates every transaction at its block's height, agrees with the pre-fork
      node or the fresh one, since that decides which side of a split a restarted or
      rebuilt node lands on.

      TestBSVGenesisPushOnly's readmission_tripwire subtest asserts the readmission
      half of the current behaviour, so the port's waiver breaks as soon as any of
      this is fixed. The full reproduction is not in the tree; it is: Genesis to
      height 6 via wirepeer.WithGenesisActivationHeight, fund two OP_TRUE outputs
      confirmed at height 3, mine one of them spent by OP_1 OP_1 OP_ADD in a block
      at height 4, build three empty blocks from the funding block so the reorg
      lands the tip at height 6, then offer two blocks at height 7 - one holding the
      never-seen spend, one holding the already-validated spend - and compare.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-genesis-pushonly.py
  - id: legacy-whitelist-inert
    title: "The legacy peer whitelist cannot be configured, and the per-IP connection cap would ignore it anyway"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-p2p-max-connections-from-addr.py, whose second block
      asserts that -whitelist exempts an address from -maxconnectionsfromaddr.
      Teranode grants no such exemption, for two independent reasons.

      First, and the larger of the two: no whitelist can be in force at all.
      loadConfig parses config.Whitelists into config.whitelists, the []*net.IPNet
      list that isWhitelisted actually reads (services/legacy/config.go:523-557,
      peer_server.go:4026). setConfigValuesFromSettings then overwrites
      config.Whitelists from the settings map AFTERWARDS (peer_server.go:3530) and
      nothing re-derives config.whitelists. Since Teranode passes no bsvd command
      line, legacy_config_Whitelists is the only way to set a whitelist, and it
      populates the string list while leaving the parsed list empty - so
      isWhitelisted returns false for every address however the node is configured.
      settings.conf defines legacy_config_Whitelists in no context, so today no
      deployment even attempts it. The knock-on: serverPeer.addBanScore skips ban
      scoring for whitelisted peers (peer_server.go:544), so a peer an operator
      believes they have whitelisted is in fact still bannable on misbehaviour.

      Second, and separable: the per-IP cap in handleAddPeerMsg
      (peer_server.go:2312) never consults sp.isWhitelisted, so even a working
      whitelist would not lift MaxPeersPerIP for an address. bitcoin-sv's does.

      MEASURED: with legacy_config_Whitelists=127.0.0.1 set before daemon start,
      the sixth connection from 127.0.0.1 is still dropped and getpeerinfo still
      reports 5 - see the third subtest of TestBSVP2PMaxConnectionsFromAddr, which
      is a tripwire on exactly this. READ FROM CODE, not measured: which of the two
      reasons is doing the work, because neither can be isolated from a test - and
      that the settings key name is the one the reflection path matches
      (config.go:158 declares the field as Whitelists). No observable effect of a
      working whitelist exists to confirm against, which is the defect.

      Operationally: several peers sharing one NAT or one Kubernetes egress IP
      cannot hold more than MaxPeersPerIP (5) connections to a node, and an
      operator has no supported way to lift that for infrastructure they control.
      Separately, misbehaviour bans cannot be suppressed for a trusted peer.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4791; the two
      halves are separable and only the first is unambiguously a bug.

      Fix for the first: re-derive config.whitelists after
      setConfigValuesFromSettings, or move the whitelist parsing after it. Worth
      auditing the same ordering hazard for every other config field loadConfig
      post-processes into an unexported twin - the whitelist is unlikely to be the
      only one, and this gap is really an instance of "loadConfig validates, then
      the settings map overwrites what was validated".

      Fix for the second is a policy call, not an obvious bug: decide whether the
      per-IP cap should honour the whitelist as bitcoin-sv does. Establish first
      whether whitelisting is meant to be reachable in Teranode at all. If it is
      dead by design, the honest change is to remove Whitelists, isWhitelisted and
      its callers rather than leave a defence that reads as configurable and is not.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-p2p-max-connections-from-addr.py
  - id: per-ip-connection-count-leaks-on-duplicate-peer
    title: "Replacing a peer that shares an address never returns its slot against the per-IP cap"
    kind: defect
    status: open
    impact: >-
      Found while reading the per-IP cap for
      bsv-p2p-max-connections-from-addr.py. handleAddPeerMsg drops an existing peer
      that shares Addr() with an incoming one by calling DisconnectWithInfo and
      deleting it from state.outboundPeers / state.inboundPeers on the spot
      (services/legacy/peer_server.go:2287-2302). handleDonePeerMsg decrements
      state.connectionCount[host] only inside `if _, ok := list.Get(sp.ID()); ok`
      (peer_server.go:2402-2418), so when the replaced peer's done message arrives
      it is no longer in the list, the decrement never runs, and its slot against
      MaxPeersPerIP is never returned. CountIP then reports more connections than
      exist, and after MaxPeersPerIP such replacements the host cannot connect at
      all. connectionCount is process-lifetime state with no reconciliation, so it
      only ever drifts one way.

      NOT MEASURED, and not reachable from this port. Two live inbound connections
      cannot share a source port, so Addr() never collides for inbound peers, and
      wirepeer connects inbound only. Outbound and persistent peers dial a fixed
      remote address and so can collide - whether connManager in practice produces
      a second connection to an address it already holds is READ FROM THE CODE
      only, and is the thing to settle before treating this as live. The bookkeeping
      asymmetry itself is not in doubt; its reachability is.
    plan: >-
      UNLOGGED - awaiting review. Establish reachability first, since that decides
      whether this is a latent tidiness problem or an operational one: a
      legacy-package unit test can drive handleAddPeerMsg with two serverPeers
      sharing Addr(), then both done messages, and assert CountIP returns to zero.
      That is a cheap, decisive test and belongs in services/legacy regardless of
      the outcome.

      The fix, if confirmed: decrement connectionCount where the peer is removed in
      handleAddPeerMsg, or better, stop removing it there and let handleDonePeerMsg
      be the single place that unwinds a peer's bookkeeping - one owner for the
      counter rather than two call sites that must agree.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-p2p-max-connections-from-addr.py
  - id: max-peers-no-reservation-no-eviction
    title: "The total peer cap reserves nothing for outbound connections and never attempts eviction"
    kind: product-decision
    status: open
    impact: >-
      Found while porting bsv-p2p-max-connections.py. bitcoin-sv's -maxconnections
      is a total out of which -maxoutboundconnections plus one feeler slot are
      reserved, and when the inbound slots are full it calls
      AttemptToEvictConnection before refusing anyone - the log line the upstream
      script waits for, "failed to find an eviction candidate - connection dropped
      (full)", is that attempt reporting failure. Teranode has neither half.

      No reservation: config.MaxPeers is one flat total. state.Count() sums
      inboundPeers, outboundPeers and persistentPeers (peer_server.go:238) and
      handleAddPeerMsg refuses whichever peer arrives once that total is reached
      (peer_server.go:2320), with no notion of which kind of slot is being taken.
      So inbound peers can consume every slot the node would otherwise use to
      reach out. MEASURED: with legacy_config_MaxPeers=2, two inbound wire peers
      fill the cap and a third connection is refused - see
      TestBSVP2PMaxConnections. INFERRED, not measured: that a full inbound set
      would likewise refuse an outbound peer. handleAddPeerMsg is the single gate
      for both, reached from OnVersion for inbound and outbound alike, and the
      connectNodeMsg path applies the same test (peer_server.go:2705) - but
      addnode is handleUnimplemented (see net-rpcs-unimplemented), so an outbound
      connection cannot be driven from a test and the inference stands unproven.

      No eviction: there is no AttemptToEvictConnection analogue anywhere in
      services/legacy - "evict" in that package refers only to misbehaviour
      disconnects and association teardown. MEASURED: with the cap full, every
      established peer survived and the newcomer was dropped, which is bitcoin-sv's
      fallback behaviour without bitcoin-sv's attempt.

      Consequence, reasoned rather than measured, and the reason this is worth a
      decision rather than a note: eviction is the mechanism by which a node with
      full slots can still prefer a new peer over an entrenched one. Without it,
      once MaxPeers (20 in settings.conf) is reached the peer set is frozen until
      a peer leaves of its own accord. MaxPeersPerIP caps one address at 5, so four
      addresses suffice to fill a default node, after which no honest inbound peer
      can connect. That is the shape of an eclipse attack, and bitcoin-sv's
      eviction plus outbound reservation are the two defences aimed at it.
    plan: >-
      UNLOGGED - awaiting review. Raise as a product decision rather than a defect:
      neither absence looks accidental, and adding peer eviction is an
      architectural change, not a fix. What the review should settle is whether the
      eclipse exposure above is accepted, mitigated elsewhere (Teranode's native
      libp2p P2P service is a separate peer set with its own policy, which may be
      the intended answer for a real deployment), or worth implementing on the
      legacy path.

      Two things to establish first, neither of which changes the finding. Whether
      a full inbound set really does block outbound dialling - cheapest via a
      legacy-package unit test over handleAddPeerMsg rather than by implementing
      addnode, which would widen the public RPC surface and needs its own proposal.
      And what MaxPeers should be for a production node at all: 20 is low enough
      that the question is not academic, and it is not obviously the same number
      that suits a node whose real peering happens over libp2p.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-p2p-max-connections.py
  - id: no-reject-for-undecodable-version
    title: "A version message the node cannot decode gets a silent hangup, not a reject"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-p2p-version_msg.py. negotiateInboundProtocol
      (services/legacy/peer/peer.go:2675) reads the first message and, if decoding
      fails, returns the error immediately - nothing is written back to the peer,
      which sees the connection close with no explanation. The same function
      handles the adjacent case differently: a first message that decodes but is
      the wrong type gets wire.NewMsgReject(cmd, RejectMalformed, "a version
      message must precede all others") before the error is returned. So the
      reject machinery is present, correct, and skipped on exactly the path where
      the peer has least information to work from.

      MEASURED: a version frame carrying eight raw bytes where a serialised
      association ID belongs - upstream's msg_version_bad, struct.pack("<Q",
      0x00000000111111FE) - draws zero bytes and an immediate close. The identical
      frame minus those eight bytes is answered with the node's own version, which
      is what isolates the trailing field as the cause rather than the framing.
      bitcoin-sv answers the same input with a reject and a close, and the upstream
      script asserts the reject.

      READ FROM CODE: that this covers every undecodable first message, not only
      this one, since the error return is common to all of them.

      Operationally this is the version-handshake instance of the same problem as
      opaque-block-reject-reason, and slightly worse, because here there is no
      reason string at all rather than an unhelpful one. A peer operator whose
      implementation emits a version Teranode's decoder will not take - a
      trailing field it does not know, an association ID over
      MaxAssociationIDLen - sees a TCP close indistinguishable from a network
      fault, a ban, or a node that is down. Diagnosing it requires our logs.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4784. The fix is small
      and local, and the call site already demonstrates the pattern. Write a
      RejectMalformed reject before returning the decode error from
      negotiateInboundProtocol, as the wrong-message-type branch immediately below
      already does.

      Two cautions for whoever takes it. The reason string should not be
      err.Error(): go-wire's decode errors carry internal detail, and bitcoin-sv's
      reject reasons are a short closed vocabulary that matching is the point of -
      the same argument made in opaque-block-reject-reason, and worth settling once
      for both. And a peer that has not completed a handshake is unauthenticated
      and cheap to create, so anything written back on this path is an amplification
      surface: a fixed short string, written once before closing, is the safe
      shape.

      Worth checking at the same time, since it is adjacent and cheap: whether
      Teranode should validate the association ID format at all.
      peer.NewAssociation accepts the ID bytes without inspecting them, so
      bitcoin-sv's "Badly formatted association ID" check has no counterpart -
      any byte string within MaxAssociationIDLen is accepted as an association ID
      when Legacy.AllowBlockPriority is set, which it is by default. Not measured
      as a fault, and not obviously one; recorded because this port established it
      while establishing the above.
