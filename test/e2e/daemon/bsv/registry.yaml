  - name: bsv-cpfp-1000-children.py
    bucket: A
    status: blocked
    needs: [wirepeer]
    ported_to: ""
    upstream_assertions:
      - "a zero-fee parent with 2500 outputs is accepted and sits in the secondary mempool"
      - "getmempoolinfo reports it as present but not in the journal"
      - "over 1000 children each paying for themselves, but not for the parent, also stay in the secondary mempool"
      - "a grandchild paying for itself and its grandparent forms a CPFP group, moving the parent, child and grandchild to the primary mempool"
      - "998 further children move with them, the limit being the 1000-transaction reprocessing batch"
      - "mining a block moves the remaining secondary-mempool transactions to primary, except the one still not paying enough"
    waived_assertions: []
    reason: >-
      Blocked on no-cpfp-ancestor-fee-accounting, now confirmed by reading rather
      than by association with bsv-cpfp.py.

      Every assertion is about the secondary mempool - the accepted-but-unmineable
      state - and about CPFP groups forming within it. Teranode has neither: a
      transaction below minminingtxfee is refused at validation rather than parked,
      so the zero-fee parent in step one never enters the node at all. Measured while
      porting bsv-cpfp.py: a zero-fee transaction is rejected with "TX_POLICY (39):
      transaction fee is too low".

      The batch limit the script is named for - 1000 transactions reprocessed in one
      go - is a property of that reprocessing machinery, which does not exist here
      either.
  - name: bsv-cpfp.py
    bucket: A
    status: blocked
    needs: [wirepeer]
    ported_to: ""
    upstream_assertions:
      - "a transaction paying above the relay fee but below the mining fee is accepted into the mempool"
      - "it does not appear in the mining candidate: num_tx stays at 1, the coinbase alone"
      - "the same holds as further under-paying descendants are added"
      - "a descendant paying enough for itself is also accepted and still not mined"
      - "rebuildjournal leaves the mining candidate unchanged"
      - "a descendant paying enough for its ancestors too pulls all of them into the mining candidate: num_tx becomes 5"
      - "a further under-paying child of that descendant is accepted but not mined: num_tx stays 5"
      - "mining a block takes exactly the journal contents, leaving only the unpaid child in the mempool"
      - "invalidating the block returns the transactions to the mempool and empties the mining candidate again, because the paying descendant no longer covers the restored ancestors"
      - "reconsidering the block restores both the mempool and the candidate"
    waived_assertions: []
    reason: >-
      Blocked because the state the whole script is about does not exist in Teranode.

      CPFP needs a transaction to be ACCEPTED but NOT MINEABLE, so that a
      later-arriving descendant can pay its way in. bitcoind gets that state from two
      thresholds: -mindebugrejectionfee decides what enters the mempool and
      -minminingtxfee decides what enters the mining candidate, and anything between
      them waits for a child to rescue it.

      Teranode has the same setting name and applies it at a different point.
      minminingtxfee is a policy check inside ValidateTransaction - its own setting
      documentation says "Fee checks are POLICY only ... BDK enforces the floor during
      ValidateTransaction in policy mode" - so a transaction below it is REFUSED
      rather than parked. MEASURED: a zero-fee transaction is rejected with
      "TX_POLICY (39): transaction fee is too low", and a one-satoshi-fee transaction
      is accepted and appears in the mining candidate immediately, num_tx going 0 to 1
      with no intermediate state. There is nothing for a child to rescue, because the
      parent never got in.

      Every one of upstream's ten assertions depends on that gap between the two
      thresholds, including the invalidate/reconsider pair at the end, which is about
      ancestor debt being recomputed. rebuildjournal has no counterpart either -
      Teranode has no journal to rebuild.

      Recorded rather than approximated. A port could asserted that a low-fee
      transaction is refused and a paying one is mined, but that is a fee-policy test,
      not a CPFP test, and it would sit under a name promising something it does not
      check. See the no-cpfp-ancestor-fee-accounting gap.
