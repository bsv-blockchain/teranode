  - id: invalidblockrequest-port-red
    title: "The pre-existing TestBSVInvalidBlockRequest port fails under SETTINGS_CONTEXT=test"
    kind: test-config
    status: resolved
    impact: >-
      The only port that predates this exercise did not pass. td.ConnectToPeer
      builds an invalid multiaddr — "/dns/127.0.0.1/tcp/59641/p2p/" with an empty
      peer ID — so the three-node ring never forms and the test fails before
      asserting anything. The cause is that Settings.P2P.PeerID is empty:
      settings.conf defines p2p_peer_id only for a few contexts and not for
