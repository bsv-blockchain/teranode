  - name: bsv-genesis-pushonly.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVGenesisPushOnly"
    upstream_assertions:
      - "the initial chain leaves the tip two blocks below the Genesis activation height"
      - "a block below the activation height, whose transaction has a non-push-only unlocking script, is accepted"
      - "the accepted block becomes the tip, at the height below the activation height"
      - "an equivalent block at the activation height is rejected with RejectResult(16, blk-bad-inputs)"
      - "the rejection leaves the tip unchanged, still at the height below the activation height"
      - "the tip is still the accepted block's hash"
      - "invalidateblock on the accepted block returns the tip to its parent's height"
      - "the accepted block's transaction is not in the mempool after the block is invalidated"
    waived_assertions:
      - "an equivalent block at the activation height is rejected with RejectResult(16, blk-bad-inputs): Teranode has no wire reject code to compare against here - the block is submitted through BlockValidationClient.ProcessBlock, which returns a Go error - and the error text names the rule rather than upstream's generic category: TX_INVALID (31) wrapping GoBDK's \"Only non-push operators allowed in signatures\". The port asserts that string and the offending txid, which is a stronger statement than blk-bad-inputs: it proves the block was refused for the push-only rule and not for some unrelated defect."
      - "the accepted block's transaction is not in the mempool after the block is invalidated: Teranode has no mempool and no policy layer, so there is no re-check to drop the transaction on readmission. getrawmempool reports block assembly's pending hashes, and after invalidateblock the transaction is in that list. The port asserts the behaviour Teranode exhibits in a readmission_tripwire subtest, clearly labelled as a tripwire rather than an endorsement, so the waiver fails the moment re-validation is added. Diagnosing this waiver is what turned up the validated-tx-not-rechecked-across-activation defect, which is the substance behind what looked like a bookkeeping difference."
  - name: bsv-genesis-spendable-op-return.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVGenesisSpendableOpReturn"
    upstream_assertions:
      - "with Genesis active, a transaction paying a coinbase into an OP_TRUE OP_RETURN output is accepted into the mempool"
      - "exactly one transaction is in the mempool afterwards"
      - "the REST getutxos endpoint reports that output's scriptPubKey as the OP_TRUE OP_RETURN script verbatim, with checkmempool"
      - "framework-implied: the node is run with -acceptnonstdtxn=1, so a script that would otherwise be refused as non-standard is admitted"
      - "framework-implied: the node is run with -genesisactivationheight=10, so the transaction is validated after the fork"
    waived_assertions:
      - "exactly one transaction is in the mempool afterwards: Teranode has no mempool, and the nearest equivalent cannot express 'exactly one'. getrawmempool reports block assembly's pending hashes and always carries an all-ff sentinel for the coinbase placeholder, so the port asserts the transaction is present rather than counting - see tryRawMempool."
      - "the REST getutxos endpoint reports the output's scriptPubKey verbatim: Teranode serves no /rest endpoints and gettxout is handleUnimplemented, so the stored output cannot be read back and compared. Replaced with something stronger and better aimed at what the script is named for: the port SPENDS the output, which shows the node stored something usable rather than merely present. Upstream never spends it."
      - "the node is run with -acceptnonstdtxn=1: Teranode has no standardness switch, and none is needed - measured, it accepts this locking script in both eras, so it behaves as upstream-with-the-flag does. No divergence is claimed from that, since upstream sets the flag precisely to accept it too; what is untested here is whether Teranode enforces any standardness policy at all, which belongs to a script that tests standardness rather than this one."
    reason: >-
      Ported, and Teranode is correct here - recorded because a register full of
      divergences should also say where behaviour is right.

      The port asserts both sides of the fork, which upstream does not. Upstream only
      checks that the output can be created with Genesis active; it never spends it,
      so it would pass against a node that had the OP_RETURN rule backwards.
      MEASURED here: spending an OP_TRUE OP_RETURN output is refused below the
      activation height (TX_INVALID from GoBDK) and accepted at or above it. That is
      the Genesis semantics the script is named for, and the pre-Genesis half is the
      half that could silently regress into accepting a spend it must refuse.

      No gap. The one thing worth flagging for a future reader is the reason string
      on the pre-Genesis refusal - "GoBDK fail to ValidateTransaction", with no
      indication that OP_RETURN was the cause. That is the opaque-tx-reject-reason
      gap rather than anything specific to this script, and it is why the port
      asserts only that the spend is refused rather than why.
