  - name: bsv-update-invalid-chain-status-at-startup.py
    bucket: A
    status: ported-partial
    ported_to: "TestBSVUpdateInvalidChainStatus"
    upstream_assertions:
      - "after starting on the pre-generated chain, the active tip is the expected hash at height 12"
      - "the valid fork's tip is reported with status valid-fork"
      - "the first invalid fork's tip, recorded as headers-only by the old node version, is reported invalid after startup"
      - "the second invalid fork's tip, which branches off the first invalid fork and was also recorded headers-only, is reported invalid after startup"
      - "framework-implied: the statuses are corrected by a repair pass at startup, since the on-disk data records them wrongly"
      - "framework-implied: the node reads a data directory produced by node version 1.0.0"
    waived_assertions:
      - "the node reads a pre-generated bitcoind data directory, and a startup repair pass corrects the recorded statuses: neither can be set up. Teranode stores its chain in SQLite with file-backed block and subtree stores and cannot read a bitcoind data directory in any form, so there is no legacy state to load and no repair pass to trigger. Every one of upstream's four tip assertions depends on that chain existing, including its specific hashes."
      - "the valid fork's tip is reported with status valid-fork: Teranode reports valid-headers for an unfollowed branch, which the getchaintips.py port already records and waives with the reason. Asserted here only as 'not invalid', which is what this test needs from it."
    reason: >-
      Ported by testing the invariant rather than the repair. Upstream's whole setup
      is a data directory from bitcoind 1.0.0 whose block statuses were recorded
      wrongly by a historical bug, and the assertions are that a startup pass has
      since corrected them. Teranode cannot load that directory, so the repair pass
      has nothing to be tested against.

      What is portable is the property the repair restores, and it is worth a test on
      its own: a fork descending from an invalid block must read invalid rather than
      as a branch the node merely has not followed. MEASURED - a three-block fork
      reads valid-headers with branchlen 3, and invalidating the fork's BASE flips
      the fork's TIP, two blocks above it, to invalid. So invalidity propagates to
      descendants and Teranode never needs the correction upstream is checking for.

      The precondition is asserted rather than assumed: the fork is checked to be
      non-invalid before anything is invalidated. Without that the second assertion
      would hold on a node that reported every fork invalid, which is the same shape
      of false pass this exercise has hit several times.

      Deliberately distinct from getchaintips.py's port, which covers the valid-fork
      side and asserts an unfollowed branch is NOT reported invalid. This is the
      other direction - that a branch which should be invalid is reported so - and
      the two together pin both halves of the status.

      No gap. Note the fork has to be built through the block validation client
      rather than over the wire, because announcing it is not possible - see the
      headers-announcement-disconnects gap.
