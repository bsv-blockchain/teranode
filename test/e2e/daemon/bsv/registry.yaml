  - name: zapwallettxes.py
    bucket: C
    status: not-applicable
    reason: "Teranode declines every wallet RPC by design: getnewaddress, sendtoaddress, getbalance, listtransactions, listunspent, signrawtransaction, importprivkey, listsinceblock, settxfee and getwalletinfo are all routed to handleAskWallet in services/rpc/Server.go, which answers \"this implementation requires a wallet\"; resendwallettransactions, zapwallettxes and fundrawtransaction are not in the dispatch table at all. Key custody and wallet state live outside the node. This script's subject is wallet persistence across restart and the zapwallettxes flag, so there is no counterpart to port - unlike the scripts that merely USE the wallet to obtain funds and sign, which port fine by doing both client-side (see bsv-getdata.py)."
