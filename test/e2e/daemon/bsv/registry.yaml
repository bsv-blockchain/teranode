  - name: bsv-accept-header-with-ancestor.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVAcceptHeaderWithAncestor"
    upstream_assertions:
      - "a headers message announcing block B0 draws a getdata naming B0"
      - "sending B0 in reply makes it the active tip"
      - "a headers message announcing B2, whose parent B1 the node has never seen, draws no getdata and is logged as 'received header <hash>: missing prev block'"
      - "a headers message announcing B1 then draws a getdata naming B1"
      - "re-announcing B2 now draws a getdata naming B2, the parent's header having been supplied"
      - "a block whose previous-block hash is zero is rejected, logged as 'ERROR: FindPreviousBlockIndex: prev block not found'"
      - "framework-implied: the connection survives every step, since the test keeps using it throughout"
    waived_assertions:
      - "a headers message announcing block B0 draws a getdata naming B0: the peer is disconnected instead. handleHeadersMsg (netsync/manager.go:2054) treats any headers arriving outside headers-first mode as misbehaviour and calls DisconnectWithWarning, and headers-first mode is an initial-sync state. Measured: the peer is dropped and the node's peer list empties. Tripwired. See the headers-announcement-disconnects gap."
      - "sending B0 in reply makes it the active tip: unreachable, the connection having been closed by the announcement. Separately, Teranode refuses unrequested blocks (see PORTING.md), so the block would need a getdata that never comes."
      - "the missing-parent announcement draws no getdata and logs 'missing prev block': unreachable for the same reason, and the log is not readable from an in-process TestDaemon in any case (see log-assertions-unreachable). Note the assertion would also PASS vacuously if attempted - no getdata arrives for any announcement, whether the parent is known or not - which is exactly the shape of false pass this exercise has hit twice before."
      - "the B1 and re-announced B2 getdatas: unreachable, both requiring a connection that survives step one."
      - "a block with a zero previous-block hash is rejected: not reproduced, because it cannot fail. Teranode refuses any unrequested block from a wire peer regardless of its contents, so an orphan-genesis block would be refused for being unrequested rather than for having no parent, and the assertion would pass without testing the rule. Recorded rather than written."
    reason: >-
      The port is two assertions rather than seven, and both are about the same
      thing: Teranode disconnects a peer that announces a block header.

      Upstream's sequence needs the connection to survive its first message, and it
      does not. That single divergence takes out five of the seven assertions, which
      is why so much is waived here relative to other entries - the waivers are one
      cause, not six.

      The port pairs the tripwire with a control, and the control is what makes the
      finding specific: the same header exchange in the PULL direction - the peer
      sending getheaders, the node answering with headers - works, and the peer keeps
      its connection. Measured. Without it, a disconnect would be equally consistent
      with the harness sending something malformed.

      Also recorded, because it is the reason the missing-parent assertion is waived
      rather than attempted: no getdata arrives for ANY announcement here, so
      upstream's "no getdata for an unknown parent" check would pass without
      distinguishing anything. Two earlier entries in this exercise
      (p2p-unsolicited_addr.py, p2p-leaktests.py) hit the same shape, where a literal
      translation reports a pass and hides the divergence.
