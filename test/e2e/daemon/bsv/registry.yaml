      - "the node logs `Unknown command \"\" from peer=0` within 10 seconds of receiving a well-framed message whose command field is all NULs"
      - "the node does not act on the unrecognised command: it is ignored for extensibility rather than answered or punished"
      - "the node survives the malformed message and is still up at teardown"
    waived_assertions:
      - "the node logs `Unknown command \"\" from peer=0` within 10 seconds of receiving a well-framed message whose command field is all NULs: a Teranode port has no log sink to read - TestDaemon's logger is not capturable from a test - so the port asserts the behaviour the log line stands for instead. Teranode's log for the same frame is `Allowed test error from <addr>: ReadMessage: unhandled command []`, measured, which names a different mechanism than upstream's."
      - "the node does not act on the unrecognised command: it is ignored for extensibility rather than answered or punished: reproduced as an observation, not as the rule. bitcoin-sv ignores unknown commands deliberately and on every network - net/net_processing.cpp says \"Ignore unknown commands for extensibility\". Teranode reaches the same outcome only via peer.isAllowedReadError, a btcd-inherited affordance conditioned on RegTestNet and a 127.0.0.1 peer; off regtest the same frame draws a \"malformed\" reject and a disconnect. The port asserts the outcome and pins the regtest precondition in an assertion so the narrowness is visible, and records the divergence as the unknown-command-disconnects-off-regtest gap."
  - name: bsv-empty-payload.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVEmptyPayload"
    upstream_assertions:
      - "the node logs \"Unparseable reject message received\" within 10 seconds of receiving a reject message with an empty payload"
      - "the node swallows the undecodable reject rather than answering it with another reject, to avoid a reject feedback loop"
      - "the connection survives the undecodable reject, and the node is still up at teardown"
    waived_assertions:
      - "the node logs \"Unparseable reject message received\" within 10 seconds of receiving a reject message with an empty payload: a Teranode port has no log sink to read, so the port asserts behaviour instead. Teranode logs nothing at error level for this frame at all - the path it takes reports \"Remote peer has disconnected (EOF)\" at debug level, which is both a different message and a wrong one."
      - "the connection survives the undecodable reject, and the node is still up at teardown: Teranode disconnects. The frame is internally consistent (declared length 0, no payload, correct checksum), so go-wire hands MsgReject.Bsvdecode an empty reader and the first field read returns a bare io.EOF - measured directly against go-wire v1.2.10, not inferred. peer.inHandler cannot distinguish that from a dead socket: isAllowedReadError wants a *wire.MessageError, and shouldHandleReadError then matches io.EOF and concludes the remote peer hung up. The port asserts the disconnect in a truncated_payload_tripwire subtest, clearly labelled, so the waiver fails the moment Teranode learns to tell the two apart. The node's survival after the disconnect is reproduced. Recorded as the short-payload-read-as-peer-eof gap."
