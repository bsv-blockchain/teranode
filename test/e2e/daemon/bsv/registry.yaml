      was measured with the same stall while porting
      bsv-command-line-invalid-block.py: reconsiderblock takes 9.77s without the P2P
      service and 2ms with it - the same figure, twice, to within a hundredth of a
      second. invalidateblock is 2ms either way, so the stall belongs to the
      handlers that touch the P2P client rather than to any one RPC or to the work
      being done. The name is kept so existing references still resolve.

      That reframes the operational cost: it is not one status RPC being slow, it is
      an unknown subset of the RPC surface, including at least one state-changing
      call an operator would reach for during an incident. Which handlers are
      affected has not been enumerated - that enumeration is the first thing worth
      doing.

      The original finding follows.

      Found while porting net.py, and measured: with the legacy peer service alone
      a getpeerinfo call takes 9.757s; with the P2P service also running the same
      call takes 0.5ms, and returns byte-for-byte the same answer. The cause is
      that daemon/daemon_services.go always builds a P2P client for the RPC
      service (GetP2PClient at line 501, not conditional on the service running),
      and handleGetpeerinfo waits on GetPeerRegistry before answering. With
      nothing listening, that call is retried by the gRPC interceptor —
      grpc_max_retries 40 at grpc_retry_backoff 250ms, so ~10s — and only then
      does handleGetpeerinfo log the failure at info level and return the legacy
      half of the answer. Two distinct problems: the RPC service should not wait
      on a service that is not running, and the 9.757s wait exceeds the 5s
      RPC.ClientCallTimeout that handleGetpeerinfo puts on peerCtx, so the
      deadline is not being honoured by the retry interceptor. The same p2pClient
      backs setban, listbanned and isbanned, which pay the same cost. This is not
      test-only: legacy-only is a supported deployment, and there every
      peer-administration RPC is ~10s slow and silent about why.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4774.
      Report as a product defect. Two fixes, either of which helps: make the RPC
      service's P2P client construction conditional on the service being
      configured, and make the gRPC retry interceptor stop retrying once the call
      context's deadline has passed. Ports run against NewLegacyDaemonWithP2P so
      that polling assertions are not fighting a 10s floor per poll.
    blocks: []
    blocks_hooks: []
    found_while_porting: net.py
  - id: getpeerinfo-omits-txninvsize
    title: "getpeerinfo does not report per-peer inv queue depth, so propagation-queue tests cannot observe anything"
    kind: product-decision
    status: open
    impact: >-
      Found while triaging p2p-txn_propagation.py. This is an observability gap
      rather than an architectural one: Teranode's legacy service does maintain a
      per-peer inv send queue (services/legacy/peer/peer.go, invSendQueue in the
      queue handler), it just never publishes its depth. bitcoin-sv exports it as
      getpeerinfo's txninvsize, and the upstream test is built entirely on that
      field - assert every peer starts at zero, feed 200 transactions, assert the
      queue is non-empty but bounded, then assert it drains. None of those can be
      written against Teranode, because the number is not reachable from outside
      the process. There is also no -broadcastdelay equivalent to slow relay down
      enough to observe a queue mid-drain. Beyond testing, an operator cannot see
      whether a peer's relay queue is backing up, which is the first thing worth
      knowing when propagation is slow.
    plan: >-
      Not ours to decide: it means adding a field to a public RPC response. If it
      is added, the upstream assertions port almost directly. Until then
      p2p-txn_propagation.py stays blocked, and note that a port of it would still
      need funding-shim for the 200 wallet-built transactions and a multi-node mesh
      for the cross-node mempool checks, so this gap alone does not unblock it.
    blocks: [p2p-txn_propagation.py]
    blocks_hooks: []
  - id: net-rpcs-unimplemented
    title: "Teranode implements only one of the eight net RPCs upstream net.py exercises"
    kind: product-decision
    status: open
    impact: >-
      Found while porting net.py. getpeerinfo is the only one that answers.
      getconnectioncount, getnettotals, getnetworkinfo, addnode, getaddednodeinfo
      and ping are all wired to handleUnimplemented in services/rpc/Server.go and
      return -1 "Command unimplemented"; setnetworkactive and getauthconninfo are
      not in the dispatch table at all and return -32601 "Method not found". Two
      of these are genuinely not-applicable — getauthconninfo and getpeerinfo's
      authconn field describe bitcoin-sv authenticated connections, which Teranode
      has no counterpart for. The other six are ordinary unimplemented RPCs, and
      services/rpc/Server.go's own rpcUnimplemented map says of getnetworkinfo
      that it "should ultimately be" implemented. Operationally the missing ones
      are the peer-administration and traffic-accounting surface an operator
      reaches for first.
    plan: >-
      Not ours to decide, and deliberately not implemented here: adding them
      widens Teranode's public RPC surface, and addnode in particular lets an RPC
      caller direct the node's outbound connections. Ports assert what getpeerinfo
      supports — per-peer byte counters, connection arrival and departure — and
      TestBSVNet carries a tripwire subtest that fails as soon as any of these
      eight starts answering, so the waivers cannot quietly go stale.
