      - "scenario 2: a low-fee transaction from a whitelisted peer draws a reject naming it"
      - "scenario 2: the rejected low-fee transaction IS relayed to a second peer, because the sender is whitelisted"
      - "scenario 3: a bad-signature transaction draws a reject naming it"
      - "scenario 3: the bad-signature transaction is not relayed to a second peer"
      - "scenario 3: with a ban threshold far above one failure's score, the sender stays connected"
      - "scenario 4: with a ban threshold of 1, the bad-signature sender is disconnected"
      - "scenario 4: with a ban threshold of 1, listbanned holds exactly one entry afterwards"
      - "orphan scenario 1: children sent before their parents are not in the mempool and draw no reject"
      - "orphan scenario 1: once both parents are sent, the parents and every child are all in the mempool"
      - "orphan scenario 1: nothing is rejected at any point"
      - "orphan scenario 2: low-fee children sent before their parents are not in the mempool and draw no reject"
      - "orphan scenario 2: after the first parent, only that parent is in the mempool and nothing is rejected yet"
      - "orphan scenario 2: after the second parent, both parents are in the mempool"
      - "orphan scenario 2: every low-fee child then draws a reject naming it"
      - "orphan scenario 2: the peer is not banned for the low-fee children"
      - "orphan scenario 3: bad-signature children sent before their parents draw no reject and are not in the mempool"
      - "orphan scenario 3: after both parents, both parents are in the mempool and only they are"
      - "orphan scenario 3: the peer is disconnected and listbanned holds one entry"
      - "orphan scenario 4: children of one valid and one bad-signature parent draw no reject while held"
      - "orphan scenario 4: the valid parent is accepted and is the only thing in the mempool"
      - "orphan scenario 4: the invalid parent is rejected, and only it is rejected"
      - "orphan scenario 4: the children are never accepted, since one parent can never exist"
      - "orphan scenario 4: the peer is not banned, upstream raising banscore to 101 so one bad parent does not ban it"
    waived_assertions:
      - "scenario 2: a low-fee transaction from a whitelisted peer draws a reject naming it: the scenario cannot be set up at all. No whitelist can be in force in Teranode - loadConfig parses config.Whitelists into the list isWhitelisted reads, and setConfigValuesFromSettings then overwrites the string list afterwards without re-deriving it - so there is no way to be the whitelisted peer and no way to distinguish this scenario from scenario 1. See the legacy-whitelist-inert gap. The reject half is reproduced in scenario 1, which is the same assertion against the same code path."
      - "scenario 2: the rejected low-fee transaction IS relayed to a second peer, because the sender is whitelisted: same cause - the whitelist cannot be in force, so the behaviour that depends on it cannot be observed. Worth noting the port does prove relay works: scenario 1 carries a control that sends a valid transaction on the same connection and asserts the second peer receives a tx inv for it, so the not-relayed assertions there are not vacuously true."
      - "scenario 4: with a ban threshold of 1, the bad-signature sender is disconnected: Teranode charges no ban score for an invalid transaction, so no threshold can be crossed - see the no-ban-score-for-invalid-transactions gap. Measured with legacy_config_BanThreshold overridden to 1: ten distinct script-invalid transactions drew ten rejects and left the peer connected. The port asserts that as a tripwire, and asserts the rejects are exactly the transactions sent, so the subtest still measures something rather than merely observing an absence."
      - "scenario 4: with a ban threshold of 1, listbanned holds exactly one entry afterwards: same cause. The port asserts listbanned is empty, as a tripwire."
      - "orphan scenario 2: every low-fee child then draws a reject naming it: Teranode assesses and refuses them but never tells the peer - the orphan path logs at netsync/manager.go:1346 and continues, where the direct path pushes a reject at :1288. See the orphan-rejection-not-reported-to-peer gap. The port asserts the refusal is real by checking none of the children reaches block assembly, and asserts the absent reject as a tripwire, so both halves of the divergence are pinned."
      - "orphan scenario 3: bad-signature children sent before their parents draw no reject and are not in the mempool: not reproduced as a separate scenario. Its distinguishing assertion is the ban that follows, which cannot happen (see above), and its held-then-refused shape is exactly scenario 2's with a script failure instead of a fee failure - both reach the same processOrphanTransactions branch and produce the same silent refusal. Scenario 4 covers a script-invalid parent, which is the more interesting case because the orphans then can never be validated at all."
      - "orphan scenario 3: after both parents, both parents are in the mempool and only they are: as above - covered by scenario 2's equivalent assertions."
      - "orphan scenario 3: the peer is disconnected and listbanned holds one entry: no ban score is charged, as above."
      - "scenario 3: with a ban threshold far above one failure's score, the sender stays connected: reproduced, but for a different reason than upstream's, and recorded here so the difference is not lost. Upstream stays connected because one failure's 100 points are below its 10000000 threshold. Teranode stays connected because nothing is charged at any threshold. The outcome matches; the mechanism does not."
