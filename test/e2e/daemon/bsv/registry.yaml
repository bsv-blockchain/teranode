  - id: protoconf-not-validated
    title: "Nothing about a peer's protoconf is validated, which becomes a problem the moment the values are used"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-protoconf-versions-compatibility.py. bitcoin-sv
      validates a peer's protoconf on three axes and refuses the connection on each:
      numberOfFields must be at least 1 (it throws at deserialisation,
      src/protocol.h:622), maxRecvPayloadLength must be at least 1 MiB, and the
      message itself must not exceed LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH - which it
      also bans for. serverPeer.OnProtoconf (peer_server.go:695) applies none of
      these: it stores what arrives and inspects it only far enough to look for a
      stream policy.

      MEASURED, each on its own connection, each tolerated with no disconnect, no
      reject and nothing banned:

        - numberOfFields = 0. go-wire reads the compact size as 0 and returns a
          MsgProtoconf with nothing else populated; OnProtoconf stores the 0 and
          skips every branch guarded by NumberOfFields > 0.
        - maxRecvPayloadLength = 1 byte. Stored as given. bitcoin-sv's floor is
          1 MiB.
        - a 1,048,576-byte protoconf of filler. Accepted - and this one MATCHES
          bitcoin-sv, the only case in the script where the two agree. The filler
          decodes to nonsense rather than failing: 'a' is 0x61, so numberOfFields
          reads as 97 and maxRecvPayloadLength as 0x61616161, about 1.5 GB, and both
          are stored without comment.
        - a 1,048,577-byte protoconf, one byte over. bitcoin-sv disconnects and bans.
          Teranode does neither, and the connection remains usable - a getheaders on
          the same connection immediately afterwards was answered. That was checked
          rather than assumed, because refusing an over-long frame without draining
          its payload would leave 1 MiB of filler to be read as the next message
          header and desynchronise the connection permanently. It does not.

      One thing this script tests that Teranode gets right, worth recording as such:
      a two-field protoconf with an unknown extra field appended is parsed,
      tolerated, and the node keeps serving. That is the forward-compatibility
      property upstream's third case exists to protect, and it holds.

      Also checked and NOT a finding, because it looked like one: go-wire's protoconf
      encoding is not incompatible with bitcoin-sv's. The upstream script's bespoke
      helper classes serialise numberOfFields as a fixed 4-byte int, which makes
      go-wire's varint read look wrong - but those helpers exist precisely to send
      malformed messages. The real format is READWRITECOMPACTSIZE
      (src/protocol.h:615), which is what go-wire reads. Recorded so nobody else
      spends the time.

      Why this matters despite every case being harmless today: it is harmless only
      because the values are stored and never read (see
      protoconf-payload-limit-not-honoured). The moment anything reads them - which
      is exactly what fixing that gap means - a peer can declare 1 byte, or the
      1.5 GB the filler case produced, and Teranode will size real messages from it.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4798. Report as a defect, and carry the ordering
      constraint into it, because it is the substantive point: this should be fixed
      BEFORE or TOGETHER WITH protoconf-payload-limit-not-honoured, never after.
      Validating a value nobody reads is housekeeping; reading a value nobody
      validated is a defect waiting for a peer to find it.

      The checks to copy are bitcoin-sv's and all cheap. Reject numberOfFields = 0
      during decoding, which is where bitcoin-sv does it - note that this is a change
      to go-wire rather than to Teranode, so it needs coordinating in that repo.
      Reject maxRecvPayloadLength below LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH in
      OnProtoconf, where a node's own policy belongs rather than in the codec. A
      sensible upper bound belongs there too: bitcoin-sv's ceiling is 1 GB, and
      accepting 1.5 GB from filler bytes shows there is currently none.

      The one policy question is whether an over-long protoconf should ban. It is
      the same question unknown-command-disconnects-off-regtest raises about
      unparseable frames generally, so it is worth answering once for all message
      types rather than per type.

      A caution for verification, as with the sibling gap: the over-long case is
      masked on regtest by isAllowedReadError, so a regtest test shows tolerance
      where mainnet shows a disconnect. Verify that case against non-regtest chain
      params or on the reject path directly.
