  - id: short-payload-read-as-peer-eof
    title: "A message whose payload is too short to decode is misread as the peer hanging up, and a healthy peer is silently disconnected"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-empty-payload.py. A well-framed message whose
      payload is shorter than its command requires - declared length and checksum
      both correct, so nothing about the framing is wrong - makes go-wire's
      decoder hit the end of the payload reader and return a bare io.EOF.
      Measured against go-wire v1.2.10: a reject frame with declared length 0
      returns exactly io.EOF, not a *wire.MessageError and not
      io.ErrUnexpectedEOF.

      peer.inHandler (services/legacy/peer/peer.go) then has no way to tell that
      from the socket dying. isAllowedReadError requires a *wire.MessageError, so
      it declines. shouldHandleReadError matches err == io.EOF and returns false
      with the debug line "Remote peer has disconnected (EOF)". Control falls to
      the else branch, which matches io.EOF again and calls
      DisconnectWithWarning("Peer disconnected due to: EOF").

      Three things are wrong at once. The peer is disconnected though it did
      nothing but send a short message. It is told nothing - no reject is pushed,
      because that branch was skipped. And the operator-visible record blames the
      peer for a disconnect the node itself initiated, at debug level, so a node
      shedding peers this way looks like a node whose peers keep leaving.

      bitcoin-sv catches the same deserialisation failure and swallows it, and for
      the reject message specifically says why: "Avoid feedback loops by
      preventing reject messages from triggering a new reject message"
      (net/net_processing.cpp). The failure mode is not confined to reject - any
      command whose decoder runs off the end of a truncated-but-consistent payload
      takes the same path.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4771.
      Not fixed here; a porting change should not also change node behaviour.
      The fix is to distinguish "the payload ended early" from "the connection
      ended", which needs the decode-time EOF wrapped as a *wire.MessageError in
      go-wire rather than passed through bare - at which point Teranode's existing
      malformed-message handling applies unchanged and the peer gets a reject
      instead of a mystery disconnect. TestBSVEmptyPayload asserts the current
      behaviour in a tripwire subtest, so the day it changes the port fails and
      its waivers get rewritten.
    blocks: []
    found_while_porting: bsv-empty-payload.py
    blocks_hooks: []
