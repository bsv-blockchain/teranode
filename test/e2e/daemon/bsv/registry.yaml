    waived_assertions:
      - "a transaction whose output pushes 0x3b110000 bytes - about 991 MB - via OP_PUSHDATA4 is accepted, and OP_SIZE agrees: the magnitude is not reproduced, and this is a HARNESS limit rather than a Teranode one, which is stated plainly rather than dressed up. Upstream lifts every relevant policy to unlimited (-maxtxsizepolicy=0, -maxscriptsizepolicy=0, -maxstackmemoryusagepolicy=0, -maxmempool=3GB) to carry a roughly 1 GB transaction. Teranode's defaults are maxscriptsizepolicy 500000 and maxtxsizepolicy 10485760 and could be overridden the same way, but an in-process TestDaemon cannot carry a 1 GB transaction through propagation and block assembly. What the script's name and its three cases are actually about - which push opcode the encoding selects and whether OP_SIZE agrees with it - IS reproduced: the port uses 0x20000, above OP_PUSHDATA2's 0xffff ceiling, so the OP_PUSHDATA4 path runs on the same code. What is lost is the size-limit half at that scale, not the encoding. Verified by negative control: encoding the expected length one byte off makes all three cases fail, so the comparison is genuinely executed and not passing vacuously."
      - "the OP_PUSHDATA4 output can then be spent: reproduced at 0x20000 rather than 0x3b110000, for the reason above."
