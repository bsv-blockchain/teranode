  - name: bsv-op-separator.py
    bucket: A
    status: ported
    needs: [wirepeer]
    ported_to: "TestBSVOpSeparator"
    upstream_assertions:
      - "a transaction paying into a locking script of the form <pk1> OP_CHECKSIGVERIFY OP_CODESEPARATOR ... <pkN> OP_CHECKSIG is accepted"
      - "a transaction spending that output with N signatures, each taken over the subscript running from the most recently executed OP_CODESEPARATOR to the end, is accepted"
      - "exactly one transaction is in the mempool afterwards, which is how upstream expresses that the spend was accepted"
      - "framework-implied: the signatures are pushed in reverse key order, since the first OP_CHECKSIGVERIFY consumes the top of the stack"
      - "framework-implied: the node is run with -acceptnonstdtxn=1, so the non-standard locking script is admitted"
    waived_assertions: []
    reason: >-
      Ported in full, and Teranode is correct. OP_CODESEPARATOR changes the
      scriptCode each OP_CHECKSIG(VERIFY) signs, so the five signatures here cover
      five different subscripts; a node that ignored the opcode, or applied it at the
      wrong offset, would reject the spend. It accepts it.

      Counted as ported rather than partial because every assertion upstream makes is
      reproduced. Upstream's "exactly one in the mempool" is its way of saying the
      spend was accepted, and the port asserts that directly against block assembly
      instead of counting - Teranode has no mempool and getrawmempool carries a
      coinbase sentinel, so a count is not expressible, but nothing upstream checks
      is lost. -acceptnonstdtxn has no Teranode counterpart and needs none: measured,
      the locking script is accepted without it, which is how upstream-with-the-flag
      behaves too.

      The port adds a negative control upstream has no need for, and it is what makes
      the result mean anything: a second spend signs every input over the WHOLE
      locking script, which is what a node that ignored OP_CODESEPARATOR would
      expect. Only the first of those five signatures is then correct, and the spend
      is refused. Without that, an accepted spend would be consistent with the node
      not checking the later signatures at all.

      No gap. Worth recording for future ports that the signing hook exists and
      works: go-bt takes its scriptCode from Inputs[n].PreviousTxScript, so swapping
      that field per signature is how a subscript sighash is produced - the same
      approach test/consensus/test_builder.go uses in PushSeparatorSigs.
