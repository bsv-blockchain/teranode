      - "after the malformed version the node sends a reject: Teranode sends nothing and closes. negotiateInboundProtocol (services/legacy/peer/peer.go:2675) returns the decode error without writing anything back, while the same function does reject a first message of the wrong type - so the machinery exists and is unused on this path. See the no-reject-for-undecodable-version gap. The port asserts the silence as a tripwire, so the waiver breaks the day a reject appears."
      - "the node logs 'Failed to process version: (Badly formatted association ID': unreproducible in principle, not just because the log is unreachable from an in-process TestDaemon. The two nodes fail at different layers on identical input - bitcoin-sv decodes the trailing field and finds it is not a well-formed association ID, whereas go-wire rejects it during decoding because the 0xFE varint prefix declares 1118481 bytes against MaxAssociationIDLen 129 (measured). Teranode never constructs a MsgVersion, so no association handling runs, and there is no equivalent format check to reach anyway: peer.NewAssociation takes the ID bytes as given and validates nothing."
