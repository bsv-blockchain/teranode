  - id: protoconf-payload-limit-not-honoured
    title: "The protoconf maximum receive payload length is advertised and then ignored in both directions"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-protoconf.py. protoconf exists to negotiate messages
      larger than the legacy 1 MiB cap: each side declares how much it is willing
      to receive, and each side is expected to respect the other's number.
      Teranode declares one and respects nothing, and the number it declares is
      also not the number it will accept.

      The value it sends is correct. peer.go:2860 sends
      wire.NewMsgProtoconf(0, ...), which resolves to go-wire's
      DefaultMaxRecvPayloadLength of 2 MiB - the same default bitcoin-sv uses when
      -maxprotocolrecvpayloadlength is unset. Measured: numberOfFields 2,
      maxRecvPayloadLength 2097152, policies [BlockPriority Default]. The literal 0
      also means the value is not configurable; there is no setting.

      OUTBOUND - the peer's declared limit is ignored. The value arrives and is
      stored at peer_server.go:703 and is read nowhere in services/legacy: the only
      two references to maxRecvPayloadLength are that store and the field
      declaration. Outbound getdata size is governed instead by netsync's
      maxRequestedTxns / maxRequestedBlocks, both set to wire.MaxInvPerMsg - a
      vector COUNT, not a byte budget, so no arithmetic anywhere compares a message
      against what the peer said it would take. MEASURED: a peer that declared
      1 MiB (upstream's LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH, and the lowest value
      bitcoin-sv permits for the option) announced 40000 transactions and received
      one getdata of 1,440,009 bytes - 37% over its declared limit. A compliant node
      would have sent two messages, of 29126 and 10874 items.

      Why that is an interop risk and not only untidiness: bitcoin-sv BANS a peer
      whose message exceeds the receiver's declared limit. That is precisely what
      upstream's run_ban_test asserts, in the opposite direction. Teranode's largest
      possible getdata is 9 + 50000*36 = 1,800,009 bytes (1.72 MiB), so any
      bitcoin-sv peer configured below that can ban Teranode. Stated precisely
      because it bears on severity: a DEFAULT bitcoin-sv peer declares 2 MiB and is
      safe, so this needs a peer configured below 1.72 MiB, the floor being 1 MiB.
      Reachable by configuration, not by default.

      INBOUND - the advertisement exceeds what the node accepts. go-wire refuses an
      inv above MaxInvPerMsg, so the largest inv Teranode can decode is 1,800,009
      bytes, less than the 2 MiB it advertises. MEASURED: a hand-framed inv of 52000
      vectors (1,872,003 bytes - inside the advertised limit, above MaxInvPerMsg)
      drew no getdata, no reject and no ban, and the connection survived. It is
      discarded in silence.

      That silence is itself the regtest-and-loopback tolerance in
      peer.isAllowedReadError, already recorded as
      unknown-command-disconnects-off-regtest - so this is understated by any test
      that runs on regtest. On mainnet the same frame is answered with a "malformed"
      reject and a disconnect. A conforming peer that believes Teranode's
      advertisement and sends a 1.9 MiB inv would therefore be disconnected by
      Teranode for doing what Teranode invited.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4799. Report as a protocol-conformance defect. Three
      separable pieces, in the order they matter.

      First, honour the peer's declared limit when sizing outbound messages. The
      value is already captured per peer, so what is missing is a byte budget where
      netsync currently counts vectors. getdata is the case measured; the same
      reasoning covers anything Teranode sizes by count rather than bytes, and inv
      and headers are the obvious two to audit alongside it.

      Second, make the advertisement agree with what the node will accept - either
      advertise 1,800,009 rather than 2 MiB, or raise the inv ceiling to match the
      advertisement. Advertising more than will be accepted is a trap for a
      conforming peer, and this is a choice between two numbers rather than a design
      question.

      Third, decide whether the advertised value should be configurable. Not needed
      for conformance, but needed to port upstream's second and third cases, and by
      any operator wanting messages larger than the go-wire default.

      One caution for whoever verifies a fix: because the inbound half is masked on
      regtest by isAllowedReadError, a regtest test will show a silent drop where
      mainnet shows a disconnect. Verify that half against a non-regtest chain
      params, or by asserting on the reject path directly.
