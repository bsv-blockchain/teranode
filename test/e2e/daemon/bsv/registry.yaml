    upstream_assertions:
      - "with -factormaxsendqueuesbytes=15, fifteen peers each requesting the same 5 MB block all receive it, and the downloads proceed in parallel"
      - "with -factormaxsendqueuesbytes=1, some of those peers receive the block and the rest receive a reject with code REJECT_TOOBUSY (0x44)"
      - "in that case the downloads proceed in series rather than in parallel"
      - "requesting the tip block rather than an older one is also limited, with the same split between blocks and rejects"
      - "whitelisted peers requesting the tip are never limited: all fifteen receive the block"
    waived_assertions: []
    reason: >-
      Blocked on the setting, the response, the peer count and the whitelist - four
      separate reasons, any one of which would be enough.

      Teranode has no factormaxsendqueuesbytes or any other bound on bytes queued for
      sending, which is what every assertion turns on. It never sends REJECT_TOOBUSY,
      so the reject half has nothing to observe. Fifteen concurrent peers exceed
      MaxPeersPerIP, which is 5 and must not be raised to make a port pass. And the
      whitelist case needs a whitelist that cannot be configured
      (legacy-whitelist-inert).

      Not wasted: this script is what identified bitcoin-sv's SECOND bound on queued
      output, and prompted the getdata measurement that the
      no-pending-response-limit gap had left open. See that gap - it now carries both
      numbers.
