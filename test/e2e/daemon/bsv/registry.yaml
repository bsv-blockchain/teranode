  - id: tx-inv-dropped-during-startup-window
    title: "Transaction announcements are silently dropped for a window after startup while block announcements are not"
    kind: unknown
    status: investigating
    impact: >-
      Found while porting bsv-p2p-invalid-inv.py, as the reason its transaction
      assertion needed a precondition upstream does not need.

      MEASURED, and reproducible: on a freshly started daemon, a peer that
      announces a transaction gets no getdata, while the same peer on the same
      connection announcing a block a millisecond earlier does get one. After
      roughly one to two seconds, transaction announcements are answered normally
      and every subsequent one is answered. Established by elimination rather than
      by reading a log:

        - Not the FSM state as the test sees it. GetFSMCurrentState on the test's
          own blockchain client returned RUNNING before, during and after the
          window.
        - Not the UTXO store. Direct utxoStore.Get calls for the announced hash
          returned a clean TX_NOT_FOUND throughout, which haveInventory maps to
          "don't have it, request it" - the path that leads to a getdata.
        - Not the hash or the message shape: the identical announcement succeeds
          later, and fresh hashes succeed immediately once the window has passed.

      The only code path that treats the two vector types differently is the
      processInvs gate: processInvMsg returns early for InvTypeTx when processInvs
      is false, and does not consult it for InvTypeBlock. processInvs is set in
      handleInvMsg from sm.blockchainClient.GetFSMCurrentState, and a failed
      lookup and a genuine not-RUNNING state are indistinguishable there - the
      error is logged and processInvs stays false either way. netsync's blockchain
      client is a different instance from the test's, so the test observing
      RUNNING says nothing about what netsync saw.

      NOT ESTABLISHED: which of the two it is. That needs the node's log, which an
      in-process TestDaemon does not expose. Until it is known this is kind
      "unknown", not "defect".

      Why it may matter beyond tests: a dropped inv vector is not requeued or
      retried, so any transaction announced inside the window is simply never
      requested from that peer. BSV peers do not generally re-announce the same
      transaction to the same peer, so it is not obviously self-healing. If the
      cause is a transient client error rather than a real not-yet-RUNNING state,
      then the same fail-closed handling would drop announcements on any later
      blip too, not only at startup.
    plan: >-
      UNLOGGED - awaiting review. Diagnose before deciding anything; this is
      recorded as a question, not a defect.

      The decisive step is cheap: log or return the GetFSMCurrentState outcome in
      handleInvMsg distinctly for "lookup failed" and "state is not RUNNING", then
      re-run TestBSVP2PInvalidInv without its requireTxInvProcessingLive
      precondition and read which one fires. If it is a lookup error, the question
      becomes whether dropping is the right response to not knowing the state -
      the alternatives being to retry the lookup, or to requeue the vector rather
      than discard it. If the state genuinely is not RUNNING for a second or two
      after the FSM reports RUNNING to another client, that is a separate and more
      interesting question about how the FSM state is propagated to service
      clients.

      Also worth settling while in there: whether block announcements SHOULD bypass
      the processInvs gate. The asymmetry may well be intentional - a node that is
      still coming up wants blocks - but it is not commented, so it currently reads
      as an oversight either way.
