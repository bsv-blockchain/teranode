  - name: p2p-leaktests.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVP2PLeakTests"
    upstream_assertions:
      - "a peer that sends veracks without ever sending a version ends up disconnected"
      - "that peer receives nothing other than a reject (its on_reject is overridden to tolerate one)"
      - "a peer that connects and sends nothing at all receives no message whatsoever, rejects included"
      - "a peer that sends a version but no verack, then sends ping and getaddr, receives no pong"
      - "and receives no addr"
      - "and receives nothing else outside VERSION/VERACK/REJECT - the rule the docstring states"
      - "a block mined while all three are attached is not announced as an inv to any of them"
      - "after all three connections are closed, getpeerinfo reports zero peers"
      - "framework-implied: the node is run with -banscore=10, which is why the first peer sends exactly ten veracks"
    waived_assertions:
      - "a peer that sends a version but no verack receives no pong: it does. Teranode treats the handshake as complete once it has the peer's version - negotiateInboundProtocol never waits for a verack in return - so the peer is registered, appears in getpeerinfo, and its ping is answered. Measured, with the nonce echoed back to prove the pong answers that ping. Tripwired. See the pre-handshake-message-leak gap."
      - "and receives no addr: it does, once the node has any addresses to give. Measured, and the port seeds the address manager first precisely so this is not vacuous - against a freshly started node the address manager is empty, pushAddrMsg has nothing to send, and upstream's assertion passes for a reason unrelated to handshake state. Tripwired. See the pre-handshake-message-leak gap."
      - "and receives nothing else outside VERSION/VERACK/REJECT: not asserted as a closed set. Teranode also sends protoconf and, intermittently, feefilter to a peer that has not sent a verack - feefilter appeared in three of four measured runs, so it is real but not deterministic enough to assert on. The port asserts the two deterministic leaks instead, both of which are direct answers to requests. See the pre-handshake-message-leak gap."
      - "a block mined while all three are attached is not announced as an inv to any of them: cannot fail here for a reason connected to handshake state. Teranode does not announce a locally mined block to legacy wire peers at all - see the legacy-block-announcement gap - so the assertion is vacuously satisfied. The block is still mined at the same point in the sequence, so the port regains this assertion for free if that gap is ever closed."
      - "after all three connections are closed, getpeerinfo reports zero peers: not reproduced, and deliberately so. The port asserts the opposite of the interesting half - that a peer which sent only a version IS counted while connected - because that is the mechanism behind both leaks above. Peer teardown accounting is already covered by the p2p-connections.py port, which exercises it directly."
      - "the node is run with -banscore=10: Teranode's ban threshold is legacy config.BanThreshold and is not what governs this case. The first message that is neither a version nor a createstream is rejected and the connection closed immediately, so no score accumulates and the count of veracks is irrelevant. Upstream flags its own count as implementation-specific, so sending one rather than ten follows that comment."
