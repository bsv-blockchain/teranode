  - id: unsolicited-addr-accepted
    title: "Addresses a peer volunteers unasked are added to the address manager, and the node dials from it"
    kind: defect
    status: open
    impact: >-
      Found while porting p2p-unsolicited_addr.py, which exists in bitcoin-sv
      specifically to assert that this does not happen. serverPeer.OnAddr
      (services/legacy/peer_server.go:1779) hands every address in the message to
      addrManager.AddAddresses with no check that the node ever asked for any of
      them - there is no counterpart to the solicited-only rule bitcoin-sv and
      Bitcoin Core both apply. The only thing OnAddr rejects is an addr with an
      empty address list.

      MEASURED: a peer sent upstream's exact message - 104.20.31.65:10000 through
      :10009, unasked - and an unrelated later peer's getaddr had those addresses
      handed back to it. Two of the ten each time, which is not partial acceptance
      but AddressCache sampling: addrmgr returns len(known) * getAddrPercent / 100
      entries after a Fisher-Yates shuffle, and with getAddrPercent = 23 and ten
      known addresses that is two, chosen at random. Different pairs came back on
      different runs, so all ten were stored.

      Why it matters: the address manager is what the node dials from. With
      legacy_config_ConnectPeers empty - which is the committed default in
      settings.conf - newServer installs a newAddressFunc that feeds the connection
      manager from addrManager.GetAddress (peer_server.go:3714), so an attacker who
      can reach the legacy port can influence which peers the node dials. That is
      the eclipse-attack shape address-manager poisoning has always had, and the
      reason upstream wrote the test.

      Bounded honestly: an operator who sets legacy_config_ConnectPeers gets
      newAddressFunc left nil and MaxPeers pinned to the number of configured peers,
      so a node peered explicitly does not dial from the poisoned set at all. How
      Teranode is actually deployed therefore decides whether this is live or
      latent, and that is a question for the review rather than something this
      exercise can settle.

      A second, quieter finding worth recording with it: upstream's test PASSES
      against Teranode, and passes for a reason unrelated to what it tests. Its only
      evidence of acceptance is onward relay, and Teranode never relays an addr
      unsolicited - pushAddrMsg is reachable only from OnGetAddr and from an
      outbound-only branch of OnVersion. Anyone porting this script by translating
      its assertions literally would have recorded a pass and moved on. The
      acceptance is visible only by asking the node with getaddr, which is what the
      port does.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4783, with the
      deployment question attached, since it decides the severity rather than the
      existence. Cross-referenced with #4782 in both issues, since that is the read
      side of the same address-manager exposure and together they mean an attacker can
      both write to and read back that set.

      The fix bitcoin-sv and Bitcoin Core both use is to track whether a getaddr is
      outstanding for the peer and drop an addr that answers no request. Teranode
      already has the state to hang that on: serverPeer carries sentAddrs for the
      opposite direction, so a symmetric sentGetAddr flag set where OnVersion
      requests addresses (the addrManager.NeedMoreAddresses branch at
      peer_server.go:648) is the natural place. Large unsolicited addr messages are
      conventionally dropped outright rather than trimmed.

      Two things to settle in review. Whether production Teranode runs with
      legacy_config_ConnectPeers set - if it always does, this is latent and can be
      fixed at leisure; if it can be empty, an attacker chooses part of the peer
      set. And whether the address manager should be dialled from at all on the
      legacy path, given that Teranode's own peer discovery happens over libp2p; if
      not, the safest change is to stop installing newAddressFunc rather than to
      police what reaches the address manager.
