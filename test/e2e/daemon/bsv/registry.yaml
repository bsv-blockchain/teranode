  - name: invalidblockrequest.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVInvalidBlockRequest"
    upstream_assertions:
      - "valid block is requested via getdata and becomes the chain tip"
      - "block with a duplicated transaction is rejected with RejectResult(16, bad-txns-duplicate), and re-requested"
      - "block whose transaction spends the same outpoint twice is rejected with RejectResult(16, bad-txns-inputs-duplicate)"
      - "block with a bad coinbase value is rejected with RejectResult(16, bad-cb-amount), and NOT re-requested"
      - "each rejected block leaves the chain tip where it was"
    waived_assertions:
      - "block with a duplicated transaction is re-requested, and a block with a bad coinbase value is NOT re-requested: upstream distinguishes the two by whether the node asks for the block again after rejecting it. Teranode draws no such distinction — netsync answers both with a reject and drops the block — so there is no re-request behaviour to observe, and asserting either way would assert a property the node does not have. The rejection halves of both assertions are reproduced."
      - "the reject carries reason bad-txns-duplicate / bad-cb-amount: Teranode's wire reject uses the matching code (RejectInvalid, 16) but the fixed reason string \"block rejected\" for every cause, so the two reasons are indistinguishable over the wire. See the opaque-block-reject-reason gap. The port asserts Teranode's own reasons (\"duplicate transaction in subtree\", \"is greater than the fees + block subsidy\") on the ProcessBlock error, where they are distinguishable. bad-txns-inputs-duplicate is NOT waived: GoBDK produces that exact string and the port asserts it verbatim."
      - "the duplicate-transaction block is built by merkle malleability, leaving the block hash unchanged: upstream appends the final transaction a second time, which the classic merkle tree absorbs because it duplicates the last node to pad an odd row. A Teranode block's merkle root comes from its subtree, so the duplicate changes the root and the hash, and the same-hash construction is not expressible. The defect under test — a block containing a duplicated transaction — is submitted and rejected."
