  - name: spamlog.py
    bucket: A
    status: blocked
    needs: [wirepeer]
    ported_to: ""
    upstream_assertions:
      - "after five seconds of spamming malformed inv messages, the node's log file is smaller than 1 MB"
      - "framework-implied: the node is run with -whitelist=127.0.0.1 and -debugexclude=net, so ordinary network logging is off and only unexpected output would grow the file"
    waived_assertions: []
    reason: >-
      Blocked, and it is the whole script rather than part of it: the log file size
      is the only assertion spamlog.py makes. An in-process TestDaemon writes
      through a ulogger the test cannot inspect, so there is no file to size and no
      count to bound - see the log-assertions-unreachable gap.

      Deliberately not ported thinly. What is left without the log assertion is "the
      node survives being spammed with malformed inv messages", which
      TestBSVPeerFlood already asserts against a very similar flood, so a port here
      would add a passing test and no coverage. Recorded as blocked rather than
      written that way, per GOAL.md rule 5.

      Worth noting for whoever unblocks it, because it changes what the port should
      assert: Teranode logs every tolerated read error at ERROR level with a runtime
      caller lookup, measured at about 12.5 KB of allocation per message while
      porting bsv-peer-flood.py. That is exactly the kind of per-message logging
      this script exists to catch. It is bounded in production only because the
      tolerance that produces it is regtest-only - off regtest the first malformed
      message disconnects the peer - so the interesting version of this port would
      have to establish which log lines a peer can provoke on a real network.
