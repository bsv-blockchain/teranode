  - name: bsv-pvq-timeouts.py
    bucket: A
    status: blocked
    needs: [wirepeer]
    ported_to: ""
    upstream_assertions:
      - "a standard transaction is validated on a high-priority queue, bounded by -maxstdtxvalidationduration"
      - "a transaction exceeding that timeout is moved to the low-priority queue rather than rejected"
      - "a non-standard transaction is bounded by -maxnonstdtxvalidationduration on the low-priority queue"
      - "a reject message is sent only for a low-priority transaction, or a high-priority one that did not time out, and only for a non-internal reject code"
      - "a transaction that times out on the high-priority queue and then fails on the low-priority queue draws a reject"
      - "framework-implied: the validation thread pool splits roughly 75/25 between high and low priority when more than four threads are configured"
    waived_assertions: []
    reason: >-
      Blocked on an architecture Teranode does not have. Prioritised Validation
      Queues are a bitcoin-sv construct - two thread pools, a documented 75/25 split,
      and transactions demoted from one queue to the other on timeout - and Teranode's
      validator is organised differently. Nothing here has a counterpart to observe.

      The two timeout settings the script drives do exist by name, and that turned out
      to be worth checking rather than assuming: see the tx-validation-timeouts-inert
      gap. They are declared with documented defaults and are never loaded or read, so
      configuring them changes nothing and the demotion behaviour every assertion
      depends on cannot be triggered.
