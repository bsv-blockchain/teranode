  - name: bsv-peer-flood.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVPeerFlood"
    upstream_assertions:
      - "a peer can flood the node with small malformed messages while never reading the responses, and the node does not fall over"
      - "each malformed blocktxn draws a reject reply, which is what fills the node's send buffer"
      - "with both buffers full the node logs 'Dropping reject message because we're paused for send and receive' - it stops queueing rejects rather than growing its send buffer without bound"
      - "getpeerinfo continues to answer while the peer is paused, reporting non-zero sendsize and recvsize"
      - "once the flood stops and the peer resumes reading, sendsize and recvsize both return to zero within 120 seconds"
      - "framework-implied: the node is run with -maxreceivebuffer=10KB and -maxsendbuffer=10KB, which is what makes the buffers fill at this scale"
    waived_assertions:
      - "each malformed blocktxn draws a reject reply: no reject is sent, and the message is not even recognised. go-wire defines no blocktxn, getblocktxn or cmpctblock - only sendcmpct - so this is an unrecognised command, and an undecodable message yields a *wire.MessageError that peer.isAllowedReadError tolerates on regtest from a loopback peer. See the unknown-command-disconnects-off-regtest gap. The port asserts the absence of a reject, and asserts that the node's handshake reply IS waiting unread on the same connection, so the absence is a decision about the malformed messages rather than a dead connection."
      - "with both buffers full the node logs 'Dropping reject message...': there is no such state to reach. No rejects are generated, so the send buffer never fills from them, and Teranode has no bounded send buffer to fill anyway - peer.queueHandler holds pending output in an unbounded list.New(). The port asserts what that absence is supposed to protect: that the node retains no more than a generous bound after a flood it cannot answer."
      - "getpeerinfo reports non-zero sendsize and recvsize, and both return to zero: Teranode's getpeerinfo reports neither field, so neither the pause nor the recovery can be observed that way. The port substitutes requireStillServing, which is the recovery in the only form available - the node is still accepting connections and answering from the blockchain store."
      - "the node is run with -maxreceivebuffer=10KB and -maxsendbuffer=10KB: Teranode has no equivalent settings, in legacy config or elsewhere."
    reason: >-
      Ported, but three of upstream's four mechanisms are absent, so most of it is
      waived - recorded here rather than left implicit because the shortfall is the
      substance of this entry.

      Two things were measured while establishing it, and NEITHER was raised as a
      gap, deliberately.

      First, peer.queueHandler holds pending output in an unbounded list, which
      looked like the vector upstream's -maxsendbuffer exists to bound. It was
      tested here with a flood of one million pings and showed no upward trend.

      SUPERSEDED: that was a measurement problem, not an absence. A ping response is
      a pong, so the amplification is about 1x and a ping flood can never make the
      queue grow faster than the attacker's own bandwidth. Retested later with
      getheaders, which amplifies about 349x, the queue does hold everything asked
      for - see the no-pending-response-limit gap, which carries the numbers. The
      conclusion recorded here originally was too weak, and the reason is worth
      keeping: an unbounded queue cannot be probed with a message type that does not
      amplify. The heap-growth tripwire in the
      port is what would catch it if that changed.

      Second, the allocation cost per unrecognised message is high and strikingly
      deterministic: about 12.5 KB each, holding to 0.1 MB across runs at both
      200,000 messages (2491.9 MB) and 2,000 (25.0 MB). Almost certainly the
      logging rather than the read path: every tolerated read error is logged, and
      the line carries a runtime caller lookup - it renders as
      "asm_arm64.s:1447: ERR_LEVEL Allowed test error from ..." - which is expensive
      per call. A ping flood, which is not logged, costs about 1.4 KB per 32-byte
      ping. Not raised as a gap for two reasons: the cost is transient, with live
      heap after a forced collection showing no growth at all, and the path is
      reachable only on regtest, since off regtest the first unrecognised command
      disconnects the peer. Recorded so anyone profiling the legacy read path has
      the figures, and because a per-message logged error with caller lookup is
      worth knowing about if that tolerance is ever extended beyond regtest.
  - name: bsv-protoconf-versions-compatibility.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVProtoconfVersionsCompatibility"
    upstream_assertions:
      - "a protoconf declaring numberOfFields = 0 disconnects the peer"
      - "that peer is not banned (listbanned stays empty)"
      - "a protoconf declaring maxRecvPayloadLength = 1 byte disconnects the peer, the minimum being 1 MiB"
      - "that peer is not banned either"
      - "a protoconf carrying an unknown extra field beyond numberOfFields = 2 does not break the node"
      - "the node's own protoconf advertises MAX_PROTOCOL_RECV_PAYLOAD_LENGTH"
      - "maxRecvPayloadLength is still parsed correctly despite the unknown extra field, proven by the node splitting its getdata into exactly 2 messages of estimateMaxInvElements(declared limit) items rather than falling back to the 1 MiB default"
      - "a protoconf whose payload is exactly LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH is accepted, the peer stays connected and is not banned"
      - "a protoconf whose payload is LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH + 1 disconnects the peer"
      - "and bans it - listbanned becomes 1, the only ban in the script"
    waived_assertions:
      - "a protoconf declaring numberOfFields = 0 disconnects the peer: Teranode tolerates it. bitcoin-sv throws at deserialisation (src/protocol.h:622); go-wire accepts a compact size of 0 and returns a MsgProtoconf with nothing else set, and OnProtoconf stores it and skips everything guarded by NumberOfFields > 0. Measured: connected, no reject, not banned. Tripwired. See the protoconf-not-validated gap."
      - "a protoconf declaring maxRecvPayloadLength = 1 byte disconnects the peer: Teranode stores the value unchecked - there is no floor. Measured as tolerated, and tripwired. See the protoconf-not-validated gap."
      - "maxRecvPayloadLength is still parsed correctly despite the unknown extra field: unobservable rather than untrue. The proof upstream uses is that the node honours the declared limit when sizing getdata, and Teranode never reads the value at all (see protoconf-payload-limit-not-honoured), so correct parsing has no consequence any peer can see. The port asserts the half that is observable and is what forward compatibility means in practice: the unknown field costs the peer nothing and the node keeps serving."
      - "the node's own protoconf advertises MAX_PROTOCOL_RECV_PAYLOAD_LENGTH: covered by the bsv-protoconf.py port rather than repeated here, where it is a precondition instead - each subtest waits for the node's protoconf before sending its own."
      - "a protoconf of LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH + 1 disconnects the peer: Teranode tolerates it on regtest. The frame is over-long for both implementations - go-wire's MaxProtoconfPayload is 1 MiB, exactly upstream's constant - but Teranode's response is the loopback-and-regtest affordance in peer.isAllowedReadError, so off regtest the disconnect half may well hold. See protoconf-not-validated and unknown-command-disconnects-off-regtest. The port additionally measures that the connection stays usable afterwards, which a node that refused the frame without draining its payload would not manage."
      - "and bans it: no counterpart on any network. Teranode applies no ban score to protoconf at all. Tripwired. See the protoconf-not-validated gap."
  - name: bsv-protoconf-violation.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVProtoconfViolation"
    upstream_assertions:
      - "the node sends a protoconf to a handshaked peer (wait_for_protoconf)"
      - "the node's protoconf arrives after its verack (msg_index[protoconf] > msg_index[verack])"
      - "listbanned is empty before the violation"
      - "a peer that sends protoconf more than once is disconnected"
      - "that peer is not banned - listbanned is still empty afterwards"
      - "framework-implied: mininode.P2PHandler.connect sends a protoconf of its own during the handshake, so the message the test then sends explicitly is the node's SECOND, which is what makes it a violation"
    waived_assertions:
      - "a peer that sends protoconf more than once is disconnected: Teranode has no duplicate-protoconf guard. serverPeer.OnProtoconf (peer_server.go:695) does not record that it has run for this peer, so every protoconf is processed as if it were the first. Measured: seven on one connection, no disconnect, no reject, nothing banned. See the no-duplicate-protoconf-guard gap - the substance is what OnProtoconf redoes on each call, not the absent disconnect by itself. Asserted as a tripwire so the waiver breaks if the guard is added."
  - name: bsv-protoconf.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVProtoconf"
    upstream_assertions:
      - "the node's protoconf advertises max_recv_payload_length equal to 2 * LEGACY_MAX_PROTOCOL_PAYLOAD_LENGTH when -maxprotocolrecvpayloadlength is unset"
      - "the node's protoconf advertises the value passed to -maxprotocolrecvpayloadlength when it is set (upstream runs the whole suite again at 500 MiB)"
      - "an inv within the advertised limit does not ban the peer (listbanned stays empty)"
      - "the node answers with getdata, and every announced element is eventually requested"
      - "the node splits its getdata so no single message exceeds the limit the PEER declared in its own protoconf: all but the last carry estimateMaxInvElements(peer limit) items"
      - "the last getdata carries exactly the remaining elements"
      - "an inv with estimateMaxInvElements(advertised) - 1 items does not ban the peer"
      - "an inv with exactly estimateMaxInvElements(advertised) items does not ban the peer"
      - "an inv with estimateMaxInvElements(advertised) + 1 items disconnects AND bans the peer (listbanned becomes 1)"
      - "with -recvinvqueuefactor set, 4*factor max-size inv messages are all remembered and every announced item is requested"
      - "one further inv message overflows that queue, after which the total requested is strictly less than the total announced"
    waived_assertions:
      - "the node's protoconf advertises the value passed to -maxprotocolrecvpayloadlength: Teranode has no such setting. peer.go sends wire.NewMsgProtoconf(0, ...) with a literal 0, so the advertised value is always go-wire's DefaultMaxRecvPayloadLength. Upstream's second pass at 500 MiB has no counterpart. See the protoconf-payload-limit-not-honoured gap."
      - "the node splits its getdata so no single message exceeds the limit the peer declared: not honoured at all. The peer's declared value is stored at peer_server.go:703 and read nowhere in services/legacy; getdata sizing comes from netsync's maxRequestedTxns, which is wire.MaxInvPerMsg - a vector count, not a byte budget. Measured: a peer declaring 1 MiB received a single getdata of 1,440,009 bytes. Asserted as a tripwire. See the protoconf-payload-limit-not-honoured gap."
      - "the last getdata carries exactly the remaining elements: same cause - there is no split, so there is no last message to check. See the protoconf-payload-limit-not-honoured gap."
      - "an inv with estimateMaxInvElements(advertised) - 1 items does not ban the peer: the boundary is unreachable. A 2 MiB advertisement implies 58253 items, above go-wire's MaxInvPerMsg of 50000, so none of the three probes around that boundary can be encoded. The port instead measures the boundary that does exist, at MaxInvPerMsg."
      - "an inv with exactly estimateMaxInvElements(advertised) items does not ban the peer: unreachable for the same reason."
      - "an inv with estimateMaxInvElements(advertised) + 1 items disconnects and bans the peer: unreachable for the same reason, and Teranode does neither at the boundary it does have. Measured: a hand-framed inv of 52000 vectors - inside the advertised limit, above MaxInvPerMsg - draws no getdata, no reject and no ban. Asserted as a tripwire. See the protoconf-payload-limit-not-honoured gap."
      - "with -recvinvqueuefactor set, 4*factor max-size inv messages are all remembered: Teranode has no -recvinvqueuefactor equivalent to set, and no announced-inv queue whose depth is observable from the wire, so neither this assertion nor the overflow that follows it can be expressed."
      - "one further inv message overflows that queue, after which the total requested is strictly less than the total announced: same cause."
