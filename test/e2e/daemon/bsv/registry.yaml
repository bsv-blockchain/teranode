  - name: bsv-command-line-invalid-block.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVCommandLineInvalidBlock"
    upstream_assertions:
      - "starting the node with -invalidateblock=<tip> leaves the tip one block lower"
      - "reconsiderblock on that block over RPC restores it as the tip"
      - "starting with two -invalidateblock arguments for adjacent blocks below the tip leaves the tip below the lower of them"
      - "reconsiderblock on the HIGHER of those two, in a later run, restores the chain all the way to the original tip"
      - "an -invalidateblock argument naming a block 90 deep, together with -reindex=1, leaves the tip just below it"
      - "an -invalidateblock argument naming a non-existent block is ignored and leaves the tip alone"
      - "an -invalidateblock argument naming a block the node has not yet received prevents that block becoming the tip when it later arrives"
      - "reconsiderblock on a block the node has never seen fails with RPC error -5 and the message 'Block not found'"
      - "a control: without the -invalidateblock argument, the same block IS accepted as the tip"
    waived_assertions:
      - "every -invalidateblock startup argument, and -reindex=1: Teranode has no such settings, so none of upstream's seven node configurations can be set up. The port reaches the same node behaviour through the invalidateblock RPC, which upstream also calls, and which is the only route available."
      - "reconsiderblock on the HIGHER of two invalidated blocks restores the chain: it fails instead, with 'parent block is invalid'. bitcoin-sv can do this because Core's ResetBlockFailureFlags clears the failure flag on ancestors as well as descendants; Teranode requires the lowest invalidated block to be named. Measured both ways - reconsidering the lower one does restore the full chain. Tripwired. See the reconsiderblock-ignores-ancestors gap."
      - "reconsiderblock on an unknown block fails with RPC error -5 and 'Block not found': the code is -25 and the message is a four-level internal error chain ending in 'sql: no rows in result set'. Tripwired on both. See the reconsiderblock-error-contract gap."
      - "an -invalidateblock argument naming a block not yet received prevents it becoming the tip on arrival: unreachable without the startup option, and there is no RPC to pre-invalidate an unknown hash - invalidateblock requires a block the node holds."
      - "the -reindex=1 and 90-deep scenarios: unreachable for the same reason, and neither adds a rule the RPC-level assertions do not already cover - depth is not what invalidation keys on."
    reason: >-
      Ported through the RPCs rather than the command line, because the command line
      option does not exist. Worth doing rather than marking blocked: reconsiderblock
      was untested anywhere in this exercise before this port - invalidateblock.py's
      port exercises invalidation and reorg but never the way back - and porting it
      turned up two divergences and one performance surprise.

      Each subtest starts its own daemon, as upstream starts a node per scenario. That
      is load-bearing rather than tidy: an earlier version shared one daemon and the
      two-block scenario failed, because the first subtest had already invalidated and
      reconsidered the tip and left state that stopped the chain coming fully back.
      Independent scenarios measure the rule; shared ones measure the order they ran
      in.

      Two false starts worth recording, both of which produced a passing test for the
      wrong reason. The first read the tip immediately after each RPC and passed - but
      only because it ran without the P2P service, where reconsiderblock spends 9.77s
      waiting out gRPC retries, and the asynchronous chain work finished inside that
      window. Enabling P2P cut the call to 2ms and the same assertion failed one block
      short. The stall had been doing the waiting. The second then polled for
      settlement and still failed, which is what led to the shared-state problem
      above. The port now polls AND isolates.

      The 9.77s figure is exactly the one getpeerinfo-stalls-without-p2p-service
      records, which is why that gap has been broadened - it is not specific to
      getpeerinfo.
  - name: bsv-conflict.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVConflict"
    upstream_assertions:
      - "a graph of eight chained unconfirmed transactions is accepted, and the mempool lists exactly those eight"
      - "after a block mines a transaction double-spending one of them, the double-spent transaction is gone from the mempool"
      - "every transaction descending from it is gone too, including two that also descend from surviving parents"
      - "the transaction that was mined in that block is gone from the mempool"
      - "the two transactions descending only from surviving outputs are still there"
      - "the mempool contains exactly those two and nothing else"
      - "framework-implied: the node runs with -minrelaytxfee=0, so nothing in the graph is refused on fee grounds"
    waived_assertions:
      - "the mempool lists exactly the eight, and afterwards exactly the two: Teranode has no mempool and getrawmempool reports block assembly pending hashes, which always carry an all-ff sentinel for the coinbase placeholder, so an exact set comparison is not expressible - see tryRawMempool. The port asserts presence for each of the eight by name and, after the block, absence for each of the six and presence for the two, which covers the same ground per transaction rather than as a set."
      - "the node runs with -minrelaytxfee=0: Teranode has no such setting. Not needed - every transaction in the graph pays a 1000 satoshi fee and all eight were accepted, measured, so nothing is being refused on fee grounds."
    reason: >-
      Ported, and Teranode handles the whole graph correctly.

      The two evictions worth having a test for are the ones where a transaction has
      a surviving parent as well as a doomed one: descendant1 spends txToBeMined,
      which was mined rather than invalidated, and descendant4 spends stayInPool2,
      which survives. Both must still go, because one input each is gone. A node that
      walked only direct children, or that kept anything with a live parent, would
      keep them - and would then mine a block double-spending an already-spent
      output. The port adds a subtest with no upstream counterpart asserting exactly
      that the next block carries none of them.

      IMPORTANT for anyone extending this: the eviction is ASYNCHRONOUS. Measured -
      immediately after the conflicting block becomes the tip the doomed transactions
      are all still listed, and about a second later they are gone. The first version
      of this port read the pool once, saw the double-spent transaction and its
      descendant still present, and would have been written up as a serious defect
      that does not exist. This is the third time in this exercise that reading node
      state immediately after an operation gave a wrong answer - see also
      bsv-command-line-invalid-block.py, where the same mistake was masked by an
      unrelated 9.77s stall.

      One harness fact worth not rediscovering: spending an OP_TRUE output needs an
      EMPTY unlocking script. Pushing OP_TRUE as well leaves two items on the stack
      and fails the clean-stack rule, which is what the first attempt here did -
      GoBDK rejects it with the usual opaque message, so the cause is not obvious
      from the error.
