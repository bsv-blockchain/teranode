      - "a transaction whose output pushes 0xffff bytes via OP_PUSHDATA2 is accepted, and OP_SIZE agrees"
      - "the OP_PUSHDATA2 output can then be spent"
      - "a transaction whose output pushes 0x3b110000 bytes - about 991 MB - via OP_PUSHDATA4 is accepted, and OP_SIZE agrees"
