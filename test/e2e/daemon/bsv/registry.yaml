      that never calls ConnectToPeer, so nothing in this package depends on the
      broken helper any more. The replacement asserts all three defects upstream
      checks: a duplicated transaction, a transaction spending the same outpoint
      twice, and a coinbase paying above subsidy — plus, over wirepeer, that a
      valid block is requested via getdata and becomes the tip. One correction to
      the plan as originally written: it assumed wirepeer would let the port
      assert the upstream reason strings. Measurement says otherwise — Teranode's
      wire reject carries the fixed reason "block rejected" for every cause (see
      the opaque-block-reject-reason gap) — so the reasons are asserted where they
