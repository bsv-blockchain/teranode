  - name: bsv-p2p-max-connections-from-addr.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVP2PMaxConnectionsFromAddr"
    upstream_assertions:
      - "with -maxconnectionsfromaddr=N, getpeerinfo reports exactly N peers once N connections have been opened from one address"
      - "framework-implied: each of those connections completes the version/verack handshake before being counted, because P2PHandler waits for it - so the cap counts negotiated peers, not half-open sockets"
      - "framework-implied: the connection opened beyond the cap is accepted at TCP level - upstream builds the extra Connection without expecting a dial error, so the drop is a node decision rather than a refused accept"
      - "the node logs 'connection from <ip> dropped: too many connections from the same address' for the over-cap connection"
      - "getpeerinfo still reports exactly N after the drop, so the over-cap connection displaced no established peer"
      - "with -whitelist=<ip> alongside -maxconnectionsfromaddr=N, the cap does not apply to that address and N+1 connections from it are admitted"
      - "with no -maxconnectionsfromaddr at all the cap is off, and 20 connections from one address are admitted"
    waived_assertions:
      - "the node logs 'connection from <ip> dropped: too many connections from the same address': Teranode's log is not reachable from the in-process TestDaemon, and its message differs anyway - 'Max peers per IP reached [5] - disconnecting peer'. The port asserts the drop itself over the wire, which is the property the log line stands in for, plus that the peer is dropped before the node writes even its version."
      - "with -whitelist=<ip> the cap does not apply to that address: Teranode has no such exemption and, separately, no configurable whitelist at all - see the legacy-whitelist-inert gap. The third subtest is a tripwire that goes red the day either half is fixed, at which point this waiver should become a real port."
      - "with no cap at all, 20 connections from one address are admitted: Teranode's MaxPeersPerIP is always on (default 5, settings.conf 5) and has no off value - 0 bars every inbound connection, since handleAddPeerMsg compares with >=. Raising it to 20 to satisfy the assertion would relax the defence the first subtest asserts, which GOAL.md rule 3 forbids."
  - name: bsv-p2p-max-connections.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVP2PMaxConnections"
    upstream_assertions:
      - "getpeerinfo reports exactly the inbound allowance once that many connections have been opened, so a total connection cap is enforced at all"
      - "the inbound allowance is -maxconnections minus -maxoutboundconnections minus one feeler slot, so inbound peers cannot consume the slots the node reserves for its own outbound connections"
      - "framework-implied: each admitted connection completes the version/verack handshake before being counted, because P2PHandler waits for it"
      - "framework-implied: the connection opened beyond the cap is accepted at TCP level - upstream builds the extra Connection without expecting a dial error, so the refusal is a node decision rather than a refused accept"
      - "the node logs 'failed to find an eviction candidate - connection dropped (full)', which is bitcoin-sv attempting to evict an existing peer to make room and reporting that it found no candidate - the newcomer is dropped only as the fallback"
      - "getpeerinfo still reports the same count after the drop, so the cap held and no slot was freed"
      - "with no -maxconnections at all, 100 connections from one address are admitted"
    waived_assertions:
      - "the inbound allowance is -maxconnections minus -maxoutboundconnections minus one feeler slot: Teranode's config.MaxPeers is a single flat total that inbound, outbound and persistent peers all count against (state.Count in peer_server.go), with nothing reserved for outbound. See the max-peers-no-reservation-no-eviction gap. The port sets MaxPeers to upstream's inbound allowance rather than its -maxconnections, which reproduces upstream's observable while being explicit that the knob means something different."
      - "the node logs 'failed to find an eviction candidate - connection dropped (full)': Teranode never attempts eviction - there is no AttemptToEvictConnection analogue - so it always drops the newcomer, and the log is unreachable from the in-process TestDaemon anyway. See the max-peers-no-reservation-no-eviction gap. The port's final loop is a tripwire asserting every established peer survives, which is what distinguishes 'the newcomer was refused' from 'a peer was evicted and the newcomer took its slot' - the count alone cannot."
      - "with no -maxconnections at all, 100 connections from one address are admitted: Teranode's MaxPeers is always on (default 125, settings.conf 20) and MaxPeersPerIP would refuse the sixth connection from one address regardless, so satisfying this would mean relaxing two defences at once, which GOAL.md rule 3 forbids."
  - name: bsv-p2p-max-pending-responses.py
    bucket: A
    status: blocked
    needs: [wirepeer]
    ported_to: ""
    upstream_assertions:
      - "with -maxpendingresponses_getheaders=50, a peer that sends 100 getheaders without reading the responses is disconnected"
      - "with -maxpendingresponses_gethdrsen=10, a peer that sends 25 gethdrsen without reading is disconnected"
      - "sending exactly the configured maximum of either is allowed, the connection survives, and every response is delivered once reading resumes"
      - "with neither option set, the limit is not enforced: 100 getheaders and 25 gethdrsen are all answered and the peer stays connected"
      - "with -whitelist, the limit is not enforced even when configured"
      - "framework-implied: the node has 2000 blocks, so each response is as large as possible and the send buffer fills sooner"
    waived_assertions: []
    reason: >-
      Blocked on three counts.

      Teranode has no maxpendingresponses limit for getheaders or anything else -
      grepped across settings and the legacy config; the only pendingResponses in the
      tree is stallHandler tracking replies the node is WAITING FOR, which is the
      opposite direction. Half the assertions are about that limit being enforced and
      the other half about it not being, and neither is expressible when the setting
      does not exist.

      Half the script is gethdrsen, which go-wire does not implement - see
      legacy-wire-message-subset.

      The remaining machinery is also out of reach: the non-disconnect cases count log
      lines (log-assertions-unreachable), and the whitelist case needs a whitelist
      that cannot be configured (legacy-whitelist-inert).

      Not wasted, though - see the no-pending-response-limit gap, which this script
      prompted and which quantifies what the missing limit costs.
