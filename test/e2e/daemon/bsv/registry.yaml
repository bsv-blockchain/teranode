      - "the accepted block's legacy sigop count is exactly MAX_BLOCK_SIGOPS_PER_MB"
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 sigops (OP_CHECKSIG) is rejected with RejectResult(16, bad-blk-sigops)"
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB/20 OP_CHECKMULTISIG is accepted, and its legacy sigop count is exactly MAX_BLOCK_SIGOPS_PER_MB"
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB/20+1 OP_CHECKMULTISIG is rejected with RejectResult(16, bad-blk-sigops), and its count is MAX_BLOCK_SIGOPS_PER_MB+1"
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB OP_CHECKSIGVERIFY is accepted, and its count is exactly MAX_BLOCK_SIGOPS_PER_MB"
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 OP_CHECKSIGVERIFY is rejected with RejectResult(16, bad-blk-sigops)"
      - "each rejected pre-Genesis block leaves the tip unchanged, since the next block builds on the same parent"
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB sigops (OP_CHECKSIG) is accepted"
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 sigops (OP_CHECKSIG) is accepted"
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB/20+1 OP_CHECKMULTISIG is accepted"
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB OP_CHECKSIGVERIFY is accepted"
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 OP_CHECKSIGVERIFY is accepted"
      - "a post-Genesis block of ONE_MEGABYTE+500 bytes carrying MAX_BLOCK_SIGOPS_PER_MB_POST_GENESIS (1000000) sigops is accepted"
    waived_assertions:
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 sigops (OP_CHECKSIG) is rejected with RejectResult(16, bad-blk-sigops): Teranode counts signature operations per block nowhere, on either side of the Genesis activation height, so there is no rejection to observe - see the sigops-limit-absent-pre-genesis gap. The port asserts the opposite outcome in a clearly labelled tripwire: the block is accepted and becomes the tip. It also asserts, as upstream does, that the block's legacy sigop count really is MAX_BLOCK_SIGOPS_PER_MB+1, so the acceptance is a divergence and not an accounting error on this side."
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB/20+1 OP_CHECKMULTISIG is rejected with RejectResult(16, bad-blk-sigops), and its count is MAX_BLOCK_SIGOPS_PER_MB+1: same absent rule. Not reproduced as a separate case because it differs from the OP_CHECKSIG case above only in how upstream's counter scores one opcode (20 rather than 1), and with no counter on this side there is nothing for the distinction to exercise. The port's legacySigopCount helper does implement the x20 rule, so the variant is one line away if a limit is ever added."
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 OP_CHECKSIGVERIFY is rejected with RejectResult(16, bad-blk-sigops): same absent rule, and OP_CHECKSIGVERIFY scores identically to OP_CHECKSIG under upstream's counting, so this case is the OP_CHECKSIG case with a different opcode byte. Nothing on the Teranode side distinguishes them."
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB/20 OP_CHECKMULTISIG is accepted, and its legacy sigop count is exactly MAX_BLOCK_SIGOPS_PER_MB: the acceptance half is reproduced for OP_CHECKSIG. Repeating it per opcode measures the same nothing three times, since acceptance is unconditional here."
      - "a pre-Genesis block with MAX_BLOCK_SIGOPS_PER_MB OP_CHECKSIGVERIFY is accepted, and its count is exactly MAX_BLOCK_SIGOPS_PER_MB: as above."
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB/20+1 OP_CHECKMULTISIG is accepted: as above, on the post-Genesis side."
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB OP_CHECKSIGVERIFY is accepted: as above."
      - "a post-Genesis block with MAX_BLOCK_SIGOPS_PER_MB+1 OP_CHECKSIGVERIFY is accepted: as above."
      - "a post-Genesis block of ONE_MEGABYTE+500 bytes carrying MAX_BLOCK_SIGOPS_PER_MB_POST_GENESIS (1000000) sigops is accepted: upstream pads to just over one megabyte because its allowance scales per megabyte, so the case checks that crossing into a second megabyte does not reintroduce a limit. With no limit on either side of the fork and none scaling with size, building a megabyte block buys no assertion. The port keeps its blocks small and records instead the arithmetic upstream relies on: GetMaxBlockSigOpsConsensusBeforeGenesis is (1 + (size-1)/1e6) * 20000, so the allowance for every block at or below one megabyte is the same 20000 the port uses."
      - "each rejected pre-Genesis block leaves the tip unchanged, since the next block builds on the same parent: nothing is rejected, so there is no unchanged tip to assert. The port asserts the converse throughout - each accepted block becomes the tip - which is what makes the divergence visible rather than implied."
