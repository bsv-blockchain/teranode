  - id: no-duplicate-protoconf-guard
    title: "protoconf can be sent repeatedly, and each one redoes peer setup including sync-manager registration"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-protoconf-violation.py. bitcoin-sv allows protoconf
      once per connection and disconnects a peer that sends a second - deliberately
      a disconnect and not a ban, per the upstream script's own comment. Teranode
      has no such rule: serverPeer.OnProtoconf (services/legacy/peer_server.go:695)
      keeps no record that it has already run for this peer, so it re-executes in
      full every time.

      MEASURED: seven protoconf messages on one handshaked connection. The peer was
      not disconnected, drew no reject, and listbanned stayed empty throughout.

      The missing disconnect matters less than what each repeat re-executes:

        1. numberOfFields and maxRecvPayloadLength are overwritten. No consequence
           today, and worth stating precisely rather than implying one:
           maxRecvPayloadLength is stored at peer_server.go:703 and read nowhere in
           services/legacy - the only two references are the declaration and that
           store. So a peer can change it freely and nothing observes the change.
           (That the value is never read is a separate matter and a signpost for
           the bsv-protoconf.py port, since honouring a peer's declared maximum
           receive payload length is what protoconf exists to negotiate. Not opened
           as a gap here - it belongs to that entry, which has not been read yet.)
        2. Stream-policy negotiation runs again: assoc.SetPolicy, and for outbound
           peers openRequiredStreams().
        3. sp.server.syncManager.NewPeer(sp.Peer, nil) is called again, whenever the
           peer has an association.

      Item 3 is the reason this is filed as a defect rather than a tolerance note.
      A duplicate NewPeer is a hazard this codebase has already been bitten by and
      documented: the comment in handleAddPeerMsg says syncManager.NewPeer is
      "intentionally NOT called here" because a duplicate newPeerMsg, when a
      donePeerMsg landed between the two, "left a permanently-disconnected peer
      pointer in peerStates, which startSync then re-picked forever and the node
      ground to a halt". That hazard was removed from one call site while remaining
      reachable, repeatedly and on demand, from another - and from a message a peer
      controls.

      READ FROM CODE, not measured, and the thing to settle before sizing this:
      item 3's reachability. It requires the peer to hold an association, i.e. to
      have sent a non-empty AssociationID in its version while
      Legacy.AllowBlockPriority is set - which is the default. wirepeer sends no
      AssociationID, so the port's peer has no association and the measurement
      above exercises items 1 and 2 only. Whether repeated registration actually
      reproduces the grinding-halt failure, or is absorbed harmlessly by
      peerStates, is not established either way.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4800. Report as a defect, with the reachability
      question carried into it rather than resolved first, since the fix is the
      same either way and cheaper than the investigation.

      The fix mirrors bitcoin-sv and closes all three items at once: record on the
      serverPeer whether protoconf has been seen, and on a second one disconnect
      without banning. That also makes Teranode's wire behaviour match the
      reference implementation, which is what the upstream test asserts.

      If disconnecting is judged too harsh for a message some peer might resend
      benignly, the minimum is to make OnProtoconf idempotent - above all to call
      syncManager.NewPeer at most once per peer, which is the invariant the
      handleAddPeerMsg comment already describes as necessary.

      To establish reachability of item 3: add an AssociationID option to wirepeer
      so a test peer can hold an association, or drive OnProtoconf twice in a
      legacy-package unit test and assert how many newPeerMsg values reach the sync
      manager's channel. The unit test is the more direct of the two and does not
      widen the harness.
