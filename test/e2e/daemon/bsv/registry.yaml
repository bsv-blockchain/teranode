  - id: unsupported-inv-type-ignored-not-disconnected
    title: "Unsupported inventory types are free to send: no disconnect, no ban score, a goroutine each"
    kind: defect
    status: open
    impact: >-
      Found while porting bsv-p2p-invalid-inv.py. bitcoin-sv treats an inventory
      vector of type ERROR (0) as a protocol violation - no honest peer sends one -
      logs "Got invalid inv" and disconnects. Teranode discards the vector and
      carries on. That much is deliberate: SyncManager.processInvMsg
      (services/legacy/netsync/manager.go) switches on the type and its default
      branch is a bare return, and the caller's comment says "Ignore unsupported
      inventory types". What is not deliberate is the price.

      handleInvMsg iterates the vectors and, for every one that is not
      InvTypeBlock, does wg.Add(1) and spawns a goroutine whose body is
      processInvMsg - so the goroutine is created BEFORE the type switch that will
      discard the vector. A single inv message may carry wire.MaxInvPerMsg = 50000
      vectors. Sending 50000 unsupported vectors therefore costs the sender about
      1.8MB and costs the node 50000 goroutine creations plus a WaitGroup barrier,
      every one of which does nothing but return.

      Nothing charges the peer for it. There is no disconnect, no reject, and no
      ban score - and ban scoring on this path is clearly reachable, because the
      adjacent getdata handler does exactly that:
      sp.addBanScore(0, uint32(length)*99/wire.MaxInvPerMsg, "getdata")
      (peer_server.go:1438) charges a peer for an oversized getdata. inv has no
      equivalent.

      MEASURED: 200000 unsupported vectors across four full-size messages on one
      connection. The peer was never disconnected, drew no reject, and the node
      was still serving headers afterwards. The single-vector and full-size cases
      are both asserted in TestBSVP2PInvalidInv as tripwires.

      READ FROM CODE, not measured: the goroutine-per-discarded-vector count, and
      that this is unbounded across messages. A test cannot count goroutines in the
      daemon it shares a process with, so the cost is established from the loop
      rather than observed. That is the part worth confirming with a profile before
      sizing the risk.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4781. Two separable
      pieces, and only the first is unambiguous.

      Cross-referenced with #4700, which makes the same observation about the
      ban-score asymmetry from the getheaders side - "getheaders is also not covered
      by the legacy getdata ban-score". Same missing policy, a different message,
      worth settling once for the legacy message set rather than per message type.

      The cheap fix: do not spawn a goroutine for a vector the type switch will
      discard. Filter on type before the wg.Add(1) - or better, hoist the switch
      out of processInvMsg into the loop, since the loop already special-cases
      InvTypeBlock and so already knows the type. This removes the amplification
      without changing any policy.

      The policy question: whether to charge a ban score for unsupported inventory
      types, as bitcoin-sv does by disconnecting. Worth deciding rather than
      inheriting - the getdata handler shows the mechanism is right there and
      already used one function away.
