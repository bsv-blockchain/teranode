    blocks_hooks: []
    found_while_porting: p2p-unsolicited_addr.py
  - id: pre-handshake-message-leak
    title: "A peer that never sends a verack is treated as fully connected and has its requests answered"
    kind: defect
    status: open
    impact: >-
      Found while porting p2p-leaktests.py, which exists to enforce one rule, stated
      in its own docstring: a node should send nothing but VERSION, VERACK and
      REJECT until it has received a VERACK. Teranode does not implement the rule,
      because it does not wait for the inbound verack at all.
      negotiateInboundProtocol reads the peer's version, calls handleVersionMsg and
      writeLocalVersionMsg, and returns; the caller then starts the message handlers
      and sends its own verack. Nothing anywhere blocks on the peer acknowledging.

      MEASURED, on a peer that sent a version and never a verack:

        - Its ping is answered with a pong. The nonce comes back, so it is
          unambiguously a reply to that ping and not a keepalive.
        - Its getaddr is answered with an addr, disclosing entries from the address
          manager.
        - It appears in getpeerinfo as an ordinary inbound peer, which is the
          mechanism behind both: handleAddPeerMsg runs off OnVersion, so the peer is
          registered in the peer lists before any verack could arrive.
        - It is also sent protoconf, and intermittently feefilter - present in three
          of four runs. Recorded as real but not asserted on, since it is not
          deterministic.
        - It is never dropped. Added while porting p2p-timeouts.py, which comes at
          the same defect from the timeout side: peer.Start applies
          negotiateTimeout (services/legacy/peer/peer.go:63, 30 seconds) only while
          negotiateInboundProtocol is still running, and that function returns as
          soon as the version has been handled. So no deadline covers the missing
          verack. Measured on one connection: a silent peer was dropped at exactly
          30.0s while a peer that had sent a version and no verack was still
          connected, still in getpeerinfo, at 49s. bitcoin-sv drops its equivalent
          at 60s, and upstream asserts that it does.

      Two of the three peers upstream attaches behave correctly, and that is worth
      recording so this reads as a narrow finding rather than a broad one. A peer
      that says nothing at all is sent nothing at all. A peer whose first message is
      a verack rather than a version gets a reject naming the reason - "a version
      message must precede all others" - and the connection is closed immediately,
      which is stricter than bitcoin-sv, where the equivalent takes ten messages to
      accumulate a ban score.

      A methodological point that belongs with the finding: the addr half of this is
      invisible against a freshly started node. The address manager is empty, so
      pushAddrMsg has nothing to send and upstream's assertion passes for a reason
      unrelated to handshake state. It only becomes visible after the node has
      learned some addresses, which the port arranges deliberately. This is the
      second gap in this exercise - after unsolicited-addr-accepted - where a
      literal translation of the upstream assertions would have reported a pass and
      hidden a real divergence.

      Consequences, in the order they seem to matter. The address-manager contents
      are disclosed to anyone who can open a TCP connection and send a version,
      which combined with unsolicited-addr-accepted means an attacker can both write
      to and read back that set. Half-handshaked peers occupy slots against
      MaxPeersPerIP and MaxPeers, which combined with
      max-peers-no-reservation-no-eviction lowers the cost of filling a node's peer
      table - a version is enough, no verack needed. And the node does work on behalf
      of peers that have not demonstrated they can complete a handshake, which is
      the generic reason Bitcoin Core adopted the rule.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4782. It is a
      conformance gap with a disclosure consequence rather than anything acutely
      exploitable, so the severity call is the reviewer's - filed without a [security]
      prefix on that basis, and the issue says so explicitly. Cross-referenced with
      #4783, the write side of the same address-manager exposure.

      The fix has a natural shape: gate reply-generating handlers on the verack
      having arrived. peer.Peer already tracks verAckReceived, so the cheapest
      correct version is to check it in the handlers that answer requests - OnPing,
      OnGetAddr, OnGetData, OnGetHeaders and the rest - or, more cleanly, to withhold
      registration with the server until the verack lands, so the peer simply is not
      a peer yet. The second is closer to what bitcoin-sv does and avoids a growing
      list of per-handler checks, but it moves handleAddPeerMsg off OnVersion, which
      the comment there says was placed deliberately - so it needs care and is not a
      one-line change.

      Worth deciding at the same time, since it is the same question: whether
      protoconf and feefilter should also wait for the verack. protoconf is arguably
      part of the BSV handshake and bitcoin-sv sends it early too, so it may be
      correct as is; feefilter is not, and upstream's test flags it explicitly.
    blocks: []
    blocks_hooks: []
    found_while_porting: p2p-leaktests.py
  - id: block-txcount-preallocation
    title: "An 89-byte block message can make the node allocate tens of gigabytes before reading a transaction"
    kind: defect
    status: open
    impact: >-
      SECURITY-SENSITIVE. Found while porting bsv-block-bad-count.py, which exists
      to check that a block message declaring an absurd transaction count is
      refused rather than acted on. The guard it tests is present and works. The
      finding is that the guard's threshold is high enough to leave a
      memory-exhaustion vector wide open beneath it.

      MsgBlock.Bsvdecode reads the 80-byte header, reads the transaction count as a
      varint, checks it against maxTxPerBlock(), and then - before reading a single
      transaction byte - does make([]MsgTx, txCount) and
      make([]*MsgTx, txCount). Nothing relates the count to how many bytes the
      message actually contains. The declared payload length in the wire header is
      89 bytes; the count can claim hundreds of millions.

      maxTxPerBlock() is (MaxBlockPayload() / minTxPayload) + 1, where minTxPayload
      is 10 and MaxBlockPayload() returns go-wire's ebs. Teranode sets that to 4e9
      via wire.SetLimits(4000000000) at services/legacy/Server.go:255, so the
      ceiling a peer may declare is 400,000,001.

      MEASURED, at deliberately small scale: 200,000 declared transactions in an
      89-byte frame allocated 13.7 MB; 600,000 allocated 41.2 MB; 1,200,000
      allocated 82.4 MB. That is 72.0 bytes per declared transaction, linear across
      all three, taken from runtime.ReadMemStats around the send - possible because
      an in-process TestDaemon allocates in the test's own process, on a daemon
      otherwise idle enough that drift is under half a megabyte.

      NOT EXECUTED, and deliberately: the ceiling. 400,000,001 x 72.0 bytes is
      about 26.8 GiB from one 89-byte message. That figure is arithmetic from the
      measured slope and the ceiling read out of the code, not something this
      exercise triggered - running it risks taking the host down rather than the
      node, and the mechanism is already established by the linear measurements
      above.

      Reachability is the part that makes it serious. The allocation happens during
      message decode, so it precedes every policy check: the unrequested-block
      rejection in netsync is downstream of it, and per
      pre-handshake-message-leak a peer need not even complete a handshake - a
      version is enough to have its messages read. The cost is also paid BEFORE the
      peer is dropped: measured, the connection is closed about 50 ms after the
      frame, once the truncated payload runs out, so the disconnect is the aftermath
      rather than a defence. An attacker reconnects and repeats. Note also that
      MaxPeersPerIP permits five concurrent connections per address.

      Two related observations recorded while establishing this, both of which
      shaped the port. First, the streaming block handler
      (services/legacy/peer/wire_streaming.go) does NOT avoid this: it exists to
      stop the full payload being buffered as a []byte, and wraps the reader in an
      io.LimitedReader, but it then calls the same MsgBlock.Bsvdecode, so the
      pre-allocation is unchanged. Second, ReadVarInt rejects non-canonical
      encodings, so any count the guard could permit - all of which fit in 32 bits -
      must be sent in the 0xFE form. A first attempt to measure this used the 0xFF
      form for a small count and saw no allocation at all, which looked exactly like
      the guard working. Worth knowing for anyone reproducing it.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4779, with the
      [security] prefix per GOAL.md. The fix belongs in go-wire rather than in
      Teranode, which means coordinating in that repository - the issue cannot be
      closed by a change in this tree.

      The issue opens by warning against closing it as a duplicate of #4572, which
      is the same class of defect (capacity derived from an untrusted count) but was
      fixed by validating the count against a policy maximum. That remedy does not
      transplant here: the policy maximum IS the hole at 400,000,001, and the check
      against it already exists at msg_block.go:88.

      The fix is the standard one for length-prefixed formats: bound the count by
      the bytes actually available before allocating, not by a policy maximum.
      Inside the streaming handler the available length is already known and already
      used to build the io.LimitedReader, so the information needed is in hand -
      a count above length/minTxPayload cannot possibly be satisfied and can be
      rejected outright. Failing that, allocate incrementally with append rather
      than sizing up front from an untrusted number; the arena in the same function
      already clamps its own hint to [4 KiB, 4 MiB] for exactly this reason, so the
      pattern is established one line away.

      Worth auditing alongside it, since the shape is generic rather than specific
      to blocks: every other Bsvdecode that sizes a slice from a peer-supplied count.
      MsgInv is bounded by MaxInvPerMsg and so is only a 50,000-element exposure,
      but it deserves the same read, as do headers and getdata.

      One thing not established: whether Teranode's process memory limits or
      container limits would turn this into a clean crash-and-restart rather than
      host-level memory pressure. That changes the operational severity and not the
      defect, and it needs someone who knows how Teranode is deployed.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-block-bad-count.py
  - id: porttest-suite-intermittent-failure
    title: "Suite failures on a machine that suspends mid-run, and one earlier failure still unexplained"
    kind: test-config
    status: resolved
    impact: >-
      Recorded so it is not lost rather than because it is understood. During the
      bsv-peer-flood.py tick, one `make bsvporttest` run failed with the last
      progress line being "Daemon TestBSVNet stopped successfully" and no assertion
      message captured. It did not reproduce: three subsequent full-suite runs
      passed, including one with -v, and TestBSVNet run alone passed six times out
      of six.

      Not attributable to that tick's port on the evidence available. The same run
      also contained a genuine failure of TestBSVPeerFlood, whose heap assertion was
      wrong at the time and has since been fixed, so the tail of that output is not
      trustworthy as a guide to what else went wrong - it is possible the suite
      failure was only that test, and the TestBSVNet line was simply the last thing
      printed before the summary. That is the most likely explanation and it would
      mean there is nothing here at all.

      DIAGNOSED on the following tick, and it turned out to be the harness's host
      rather than anything in the node or the ports. Two more suite runs failed, and
      the second was instrumented: the test binary reported 163.678s of test time
      inside 78 minutes of wall clock at 0% CPU. The machine was suspending between
      tests. Confirmed by a run whose process showed 5.7 seconds of CPU across 35
      minutes wall clock in state S - blocked, not busy - and by Go's own -timeout
      never firing, which is what happens when the monotonic clock stops with the
      machine.

      That also explains why it looked like a hang and why it could not be
      reproduced on demand: nothing was wrong, the machine was asleep. Both failing
      runs ended immediately after TestBSVP2PTimeouts, which is the one port in the
      suite whose assertions are about wall-clock deadlines - it samples either side
      of the node's 30-second negotiation timeout, and a suspend across that window
      leaves every peer dropped for reasons unrelated to the test.

      One correction to the record: a SIGQUIT sent to the blocked process to collect
      a goroutine dump produced "fault 0x18a94750c" instead and destroyed that run's
      evidence. The right tool was a short -timeout, which makes Go dump every
      goroutine itself.

      NOT explained by this: the very first failure, seen the previous tick after
      TestBSVNet. It is consistent with the same cause, since that run also contained
      a genuine TestBSVPeerFlood failure whose output masked everything else, but the
      assertion message was lost and it cannot be attributed now.
    plan: >-
      RESOLVED by hardening the affected port rather than by changing the suite.
      waitUntil in TestBSVP2PTimeouts now skips, with an explicit message, when the
      clock jumps more than 10 seconds past a sampling point. Skipping is the honest
      outcome: a failure there would report that the node behaved wrongly when the
      test had simply stopped running for a while.

      Two notes for anyone hitting something similar. Check CPU time against wall
      clock before diagnosing a hang - 5.7 seconds across 35 minutes is a suspended
      machine, not a deadlock, and reading it as a deadlock cost real time here. And
      run the suite with a short -timeout when investigating, never SIGQUIT, for the
      reason above.

      No further action unless a suite failure appears on a machine that has
      demonstrably stayed awake.
    blocks: []
    blocks_hooks: []
    found_while_porting: bsv-peer-flood.py
  - id: opaque-tx-reject-reason
    title: "Every rejected transaction gets the reason 'rejected', and the real cause is lost twice over"
    kind: defect
    status: open
    impact: >-
      Found while porting invalidtxrequest.py. The transaction twin of
      opaque-block-reject-reason, and worse, because the detail is discarded at two
      separate boundaries rather than one.

      At the wire boundary: netsync/manager.go:1288 answers a refused transaction
      with PushRejectMsg(CmdTx, RejectInvalid, "rejected", txHash, false) - the same
      fixed string for every cause. The line above it reads
      "TODO better rejection code and message from the error", and the specific error
      is in scope at that point, having just been logged on the previous line. So
      this is known and the material is in hand.

      At the validator boundary, and this part is new: the specific GoBDK error does
      not survive to the caller either. ScriptVerifierGoBDK.go:307 logs it and then
      mapBDKValidationError wraps it as
      errors.NewTxInvalidError(errMsgInvalidTx, errVerify), where errMsgInvalidTx is
      the constant "GoBDK fail to ValidateTransaction". MEASURED across the
      propagation client: Error() returns "TX_INVALID (31): GoBDK fail to
      ValidateTransaction", %+v renders the same, and the unwrap chain has exactly
      one element - so the cause is not recoverable programmatically even in-process.
      The only place the real reason exists is a log line.

      MEASURED for reference, on a transaction spending an OP_TRUE output with an
      unlocking script of a single OP_NOTIF, which is upstream's input: the wire
      reject carries cmd "tx", code REJECT_INVALID and reason "rejected", naming the
      correct txid, and the peer is not disconnected. bitcoin-sv sends
      mandatory-script-verify-flag-failed for the same input, and the upstream test
      asserts that string.

      Worth recording that the code half is right: RejectInvalid is 16, which is what
      upstream asserts, so a peer learns the class of failure and only loses the
      cause. Also worth recording the counter-example already noted in
      opaque-block-reject-reason - GoBDK does sometimes surface a specific message,
      as the bsv-genesis-pushonly.py port measured ("Only non-push operators allowed
      in signatures") - so the detail exists inside BDK and is being flattened by
      Teranode's own wrapping rather than never produced.

      Operationally this costs a peer operator the ability to find out why their
      transaction was refused without access to our logs, and it costs Teranode's own
      callers the ability to branch on the reason.
    plan: >-
      Raised as https://github.com/bitcoin-sv/teranode/issues/4790, and worth reviewing together
      with opaque-block-reject-reason since the two share a fix strategy and a
      caution, and a single decision should cover both.

      The two boundaries need separate work. Inside the validator, stop flattening:
      either include the BDK error's own text in the TxInvalidError message, or keep
      it retrievable so errors.As can reach a typed script error. The wrapping is
      already there, so this is about what NewTxInvalidError renders and unwraps to
      rather than about plumbing a new value through.

      At the wire boundary, derive the reject reason from the error already in hand
      at the PushRejectMsg call site, which is what the TODO there asks for. The
      caution from opaque-block-reject-reason applies unchanged and is the reason to
      decide both at once: do not pass err.Error() through to a peer. bitcoin-sv's
      reasons are a short closed vocabulary and matching it is the point, so a
      mapping from Teranode error to upstream reason string is what is wanted, not
      internal error text.
    blocks: []
    blocks_hooks: []
    found_while_porting: invalidtxrequest.py
  - id: log-assertions-unreachable
    title: "No port can assert on the node's log output, which costs fidelity on a countable set of entries"
    kind: test-config
    status: open
    impact: >-
      Ours to fix rather than a node defect, and quantified rather than asserted,
      because the cost turned out to be smaller than it first looked.

      An in-process TestDaemon writes through a ulogger the test cannot inspect.
      daemon.TestOptions chooses between four hardcoded logger factories
      (daemon/test_daemon.go:452-480) on UseUnifiedLogger, EnableDebugLogging and
      EnableErrorLogging, with no way to supply one - so there is no log sink to read
      and no counter to bound. bitcoin-sv's framework has check_for_log_msg and a log
      file on disk, and upstream leans on both.

      MEASURED against the upstream suite and this registry: 35 of the 279 upstream
      scripts assert on log content or log size. Of those, 12 are bucket A - 8
      already ported with a log assertion waived, 4 still todo. The rest are in
      buckets B and C and are not in scope to port, so the honest figure for what
      this obstacle costs is about 13 entries: retiring waivers on 8 landed ports,
      unblocking spamlog.py, which has no other assertion, and improving 4 not yet
      started. Not the sweeping unlock it appeared to be before counting.

      Each of those 8 waivers is defensible on its own - in most cases the port
      asserts the behaviour the log line stands for, and in two cases
      (bsv-block-bad-count.py, bsv-p2p-invalid-inv.py) it asserts something stronger
      than the log could show. The loss is narrower than the count suggests: what
      cannot be checked is that the node says the right thing, as distinct from
      doing it.
    plan: >-
      NEEDS A DECISION rather than filing, because the fix touches shared test
      infrastructure rather than this package. Not done unilaterally for that reason.

      The change is small and additive: a LoggerFactory field on daemon.TestOptions,
      honoured ahead of the four existing branches and defaulting to today's
      behaviour when nil. wirepeer would then grow a helper returning a daemon plus a
      captured-log accessor, and ports could assert on log content the way upstream
      does. Nothing existing changes behaviour.

      The reservation worth weighing against it: asserting on log strings couples
      ports to log wording, which is not a contract and will drift, and several of
      the current waivers are better than the assertion they replace. If it is done,
      the guidance should be to assert on logs only where the log is the ONLY
      evidence - spamlog.py being the clear case - and to keep preferring
      behavioural assertions everywhere else.

      Until decided, ports keep waiving log assertions with a reason, which is the
      current practice and is working.
    blocks: [spamlog.py, bsv-log-time-diff.py]
    blocks_hooks: []
    found_while_porting: spamlog.py

