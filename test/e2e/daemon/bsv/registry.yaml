  - name: p2p-timeouts.py
    bucket: A
    status: ported-partial
    needs: [wirepeer]
    ported_to: "TestBSVP2PTimeouts"
    upstream_assertions:
      - "all three connections are accepted and still open one second after connecting"
      - "the peer that sent a version has received the node's version"
      - "a peer that sent a version but no verack is still connected 31 seconds in"
      - "a peer that sent only a ping, never a version, is still connected 31 seconds in"
      - "a peer that sent nothing at all is still connected 31 seconds in"
      - "the peer that sent a version but no verack is disconnected by 62 seconds - the deadline to receive a version or verack is 60 seconds"
      - "the peer that sent only a ping is disconnected by 62 seconds"
      - "the peer that sent nothing at all is disconnected by 62 seconds"
    waived_assertions:
      - "a peer that sent only a ping, never a version, is still connected 31 seconds in: it is gone within milliseconds. negotiateInboundProtocol rejects the first message that is neither a version nor a createstream - 'a version message must precede all others' - and closes. Stricter than bitcoin-sv, which tolerates the ping and waits out its full deadline, so this is a divergence rather than a defect and no gap is opened for it. The port asserts the prompt disconnect instead, and checks it happens well before the negotiation deadline so it cannot be confused with one."
      - "the peer that sent only a ping is disconnected by 62 seconds: reached far earlier, for the reason above, so the assertion holds but says nothing about a deadline."
      - "the peer that sent a version but no verack is still connected 31 seconds in: it is - but so is it at 49 seconds, and indefinitely as far as this port can show. Reproduced in the sense that the assertion passes; recorded as a waiver because it passes for the opposite reason to upstream's. See the pre-handshake-message-leak gap, to which this port added the timeout-side evidence."
      - "the peer that sent a version but no verack is disconnected by 62 seconds: it is not. negotiateTimeout covers only the window while negotiateInboundProtocol is running, and that returns as soon as the version is handled, so no deadline applies to a missing verack. Measured against the silent peer on the same node, which was dropped at exactly 30.0s. Tripwired. See the pre-handshake-message-leak gap."
      - "the three 31-and-62-second sample points: not reproduced at upstream's constants. Teranode's negotiateTimeout is 30 seconds where bitcoin-sv's deadline is 60, so the port samples at 28 and 33 seconds against its own constant, taken from services/legacy/peer/peer.go:63 rather than hardcoded. Rescaled openly rather than silently: the whole subject of this script is wall-clock behaviour, so the port costs ~33s against upstream's 62 and attaches all three peers at once so one wait covers them."
