t to uint32</text></g><path d="M431,138.4199 L431,193.4199 L782,193.4199 L782,148.4199 L772,138.4199 L431,138.4199" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M772,138.4199 L772,148.4199 L782,148.4199 L772,138.4199" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.9141" x="437" y="155.9883">Short hashes are zero-padded.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.5371" x="437" y="171.2988">Negative indices are not rejected before the cast.</text><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.3511" x="437" y="186.6094">Both full and limited RPC users can call this method.</text><path d="M10,206.3516 L72.1387,206.3516 L72.1387,213.6621 L62.1387,223.6621 L10,223.6621 L10,206.3516" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="362.6367" style="stroke:#000000;stroke-width:1.5;" width="1211.0093" x="10" y="206.3516"/><text fill="#333333" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="25" y="219.9199">alt</text><text fill="#333333" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.332" x="87.1387" y="218.9863">[Hash parsing fails]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg3"><polygon fill="#666666" points="67.7524,240.9727,57.7524,244.9727,67.7524,248.9727,63.7524,244.9727" style="stroke:#666666;stroke-width:1;"/><line style="stroke:#666666;stroke-width:1;stroke-dasharray:2,2;" x1="61.7524" x2="415.9961" y1="244.9727" y2="244.9727"/><text fill="#333333" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.9893" x="73.7524" y="240.2305">Error</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="1221