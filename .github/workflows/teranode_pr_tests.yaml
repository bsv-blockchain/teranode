name: Teranode PR tests
# The run-name carries the tested PR/merge/base identity to the downstream
# sonar-pr-analyze.yaml workflow, which validates every field before trusting
# it. Base retargets do not rerun this workflow (default trigger types), so the
# Sonar gate keeps the same staleness contract as every other required check.
run-name: sonar-pr/${{ github.event.pull_request.number }}/merge/${{ github.sha }}/base/${{ github.event.pull_request.base.sha }}/ref/${{ github.event.pull_request.base.ref }}

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  REPO: teranode
  SETTINGS_CONTEXT_DEFAULT: test
  GO_VERSION: "1.26.0"
  # Disable testcontainers' Ryuk reaper sidecar — Docker Hub rate-limits and
  # gateway timeouts pulling testcontainers/ryuk:* are the dominant flake
  # source on CI. Ephemeral runners are torn down regardless, so the reaper
  # provides no value here. Tests already call container.Terminate() explicitly.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  scope:
    name: compute test scope
    # Needs Go to build the import graph; the small arm runner is plenty.
    runs-on: teranode-runner-8-core-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.s.outputs.full }}
      # any_go is intentionally not surfaced: no job gates on it any more (the
      # linter always runs for Sonar). It still appears in the action's
      # "Scope decision" log group for debugging.
      run_unit: ${{ steps.s.outputs.run_unit }}
      unit_pkgs: ${{ steps.s.outputs.unit_pkgs }}
    steps:
      # Local action reference requires the workspace to be checked out first.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - id: s
        uses: ./.github/actions/test-scope
        with:
          go-version: ${{ env.GO_VERSION }}
          force-full: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}

  golangci-lint:
    name: golangci-lint
    # Deliberately NOT scope-gated. The downstream Sonar pipeline
    # (sonar-inputs -> sonar-pr-analyze.yaml) hard-requires
    # golangci-lint-report.xml, and a missing input fails the required
    # "SonarQube Quality Gate" check. Skipping this job on docs-only PRs would
    # turn every such PR red, so it always runs and always uploads a report.
    # arm64-safe: pure Go analysis, no containers (golangci-lint ships arm64).
    runs-on: teranode-runner-8-core-arm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Forbid %w in errors.New* format strings
        run: ./scripts/check_error_wrap_verbs.sh

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # golangci typechecks (no -race) and the action caches its own build
      # artifacts, so restore the module cache only.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'

      - name: golangci-lint with checkstyle report
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.10.1
          args: --timeout=5m --disable gosec --disable prealloc --output.checkstyle.path=golangci-lint-report.xml --output.text.path=stdout

      - name: Upload golangci-lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golangci-lint-report
          path: golangci-lint-report.xml
          if-no-files-found: error
          retention-days: 1

  test:
    name: test
    needs: [scope]
    # Always runs, for two independent reasons:
    #  1. Sonar: main's sonar-inputs job hard-requires coverage.out, so this job
    #     must emit one on every run or the required Quality Gate check fails.
    #  2. Fail-open: a status function is REQUIRED here. Without one, a scope job
    #     that dies in checkout/setup-go/go-cache (before it can fail open) makes
    #     this job SKIP, and a skipped required check satisfies branch
    #     protection - a green PR with zero tests run.
    # Scope then only decides WHAT runs; see the run step's branching.
    if: ${{ !cancelled() }}
    runs-on: teranode-runner-16-core-arm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      # Only login to Docker Hub for internal PRs to avoid rate limits.
      # Fork PRs won't have access to secrets and will skip this step.
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run Go tests
        # Tracks each test binary's peak RSS (VmHWM — the kernel's monotonic
        # high-water mark) silently in the background, then prints a top-10
        # peak-memory table at the END of the run, so per-binary unit-test memory
        # stays visible and regressions are caught early. No deps; survives a
        # SIGTERM (the summary also runs from the EXIT trap). Sampler runs under
        # `set +e` so a SIGPIPE/no-match can't trip the step's `set -e`; `make test`
        # keeps it.
        run: |
          TRACK="$(mktemp)"
          track() {
            set +e
            local st pid hwm cmd name
            while :; do
              for st in /proc/[0-9]*/status; do
                hwm="$(awk '/^VmHWM:/{print $2; exit}' "$st" 2>/dev/null)"
                [ -n "$hwm" ] || continue
                pid="${st#/proc/}"; pid="${pid%/status}"
                cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null)"
                name="${cmd%% *}"; name="${name##*/}"
                case "$name" in *.test) echo "$hwm $name" >> "$TRACK" ;; esac
              done
              sleep 10
            done
          }
          track & TRACK_PID=$!
          job_peak() {
            local f
            for f in /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory/memory.max_usage_in_bytes; do
              if [ -r "$f" ]; then awk -v b="$(<"$f")" 'BEGIN{printf "%.1fG", b/1073741824}'; return; fi
            done
            awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} END{printf "%.1fG",(t-a)/1048576}' /proc/meminfo
          }
          summary() {
            set +e
            kill "$TRACK_PID" 2>/dev/null
            echo "::group::Peak memory  (job peak=$(job_peak))"
            awk '$1>m[$2]{m[$2]=$1} END{for (k in m) printf "%d %s\n", m[k], k}' "$TRACK" 2>/dev/null \
              | sort -rn | head -10 | awk '{printf "PEAKMEM %.1fG %s\n", $1/1048576, $2}'
            echo "::endgroup::"
          }
          trap summary EXIT
          if [ "$SCOPE_RESULT" != "success" ] || [ "$SCOPE_FULL" = "true" ]; then
            # Full run. Also the fallback when the scope JOB itself failed before
            # the tool could fail open - never trust an unwritten output set.
            echo "Full unit suite (scope result=$SCOPE_RESULT full=$SCOPE_FULL)"
            make test
          elif [ -n "$UNIT_PKGS" ]; then
            # Scoped run: compile and test only the affected packages. Coverage is
            # still written, but -coverpkg is narrowed to the same set - that is
            # what avoids the ./... instrumentation driving the ~110GB full-run peak.
            echo "Scoped unit suite"
            make test TEST_PKGS="$UNIT_PKGS"
          else
            # No production package affected (e.g. an e2e-only change). There is
            # nothing to test, but Sonar still requires a coverage profile, so
            # emit a valid empty one rather than failing the required gate.
            echo "No affected unit packages - emitting empty coverage profile"
            echo "mode: atomic" > coverage.out
          fi
        # Pass scope outputs via env (not ${{ }} interpolated into the run-line) so
        # the tool-produced package list can never be parsed as shell.
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_FULL: ${{ needs.scope.outputs.full }}
          UNIT_PKGS: ${{ needs.scope.outputs.unit_pkgs }}
        continue-on-error: false

      - name: Upload coverage report
        # Unconditional: every path through the run step above leaves a
        # coverage.out behind, and sonar-inputs treats a missing one as fatal.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

      # - name: Publish Test Summary Results
      #   if: always()
      #   run: npx github-actions-ctrf ctrf-report.json

  test-aerospike-native-ops:
    name: test aerospike native-ops (fork image)
    # Runs the aerospike store suite against the BSV fork of aerospike-server
    # with aerospike_use_native_teranode_ops enabled, asserting the startup
    # capability probe actually engages the native operate-path
    # (AEROSPIKE_EXPECT_NATIVE_OPS=true fails the store tests if it does not).
    # Gated on the AEROSPIKE_NATIVE_OPS_IMAGE repository variable so the job
    # is inert until the fork image is published to a registry CI can reach.
    if: vars.AEROSPIKE_NATIVE_OPS_IMAGE != ''
    runs-on: teranode-runner-8-core-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Login to GitHub Container Registry
        if: startsWith(vars.AEROSPIKE_NATIVE_OPS_IMAGE, 'ghcr.io/')
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run aerospike store suite with native ops
        env:
          AEROSPIKE_CONTAINER_IMAGE: ${{ vars.AEROSPIKE_NATIVE_OPS_IMAGE }}
          AEROSPIKE_CONTAINER_PLATFORM: linux/arm64
          AEROSPIKE_EXPECT_NATIVE_OPS: "true"
          SETTINGS_CONTEXT: test
        run: |
          go test -race -tags "testtxmetacache" -count=1 -timeout=15m ./stores/utxo/aerospike/...

  filename-check-report:
    name: filename check report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Generate filename check report
        run: ./scripts/check_filenames.sh

      - name: Upload filename check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-filename-report
          path: sonar_filename_report.json
          if-no-files-found: error
          retention-days: 1

  # Fixed producer names keep the legacy downstream compatible during rollout.
  # Failed-job reruns also rerun dependents, so this job reselects each newest
  # producer artifact and seals the effective set into the current-attempt bundle.
  sonar-inputs:
    name: Aggregate Sonar inputs
    needs:
      - golangci-lint
      - test
      - filename-check-report
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download golangci-lint report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: golangci-lint-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download filename check report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sonar-filename-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Presence-only validation: never execute or parse artifact contents.
      - name: Validate required Sonar inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in coverage.out golangci-lint-report.xml sonar_filename_report.json; do
            [ -f "$file" ] || {
              echo "::error::Missing required Sonar input file: $file"
              exit 1
            }
          done

      - name: Upload Sonar input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-inputs-${{ github.run_attempt }}
          path: |
            coverage.out
            golangci-lint-report.xml
            sonar_filename_report.json
          if-no-files-found: error
          retention-days: 1
