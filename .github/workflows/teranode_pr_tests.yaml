name: Teranode PR tests
# The run-name carries the tested PR/merge/base identity to the downstream
# sonar-pr-analyze.yaml workflow, which validates every field before trusting
# it. Base retargets do not rerun this workflow (default trigger types), so the
# Sonar gate keeps the same staleness contract as every other required check.
run-name: sonar-pr/${{ github.event.pull_request.number }}/merge/${{ github.sha }}/base/${{ github.event.pull_request.base.sha }}/ref/${{ github.event.pull_request.base.ref }}

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  REPO: teranode
  SETTINGS_CONTEXT_DEFAULT: test
  GO_VERSION: "1.27.0"
  # Disable testcontainers' Ryuk reaper sidecar — Docker Hub rate-limits and
  # gateway timeouts pulling testcontainers/ryuk:* are the dominant flake
  # source on CI. Ephemeral runners are torn down regardless, so the reaper
  # provides no value here. Tests already call container.Terminate() explicitly.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  golangci-lint:
    name: golangci-lint
    # arm64-safe: pure Go analysis, no containers (golangci-lint ships arm64).
    runs-on: teranode-runner-8-core-arm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Forbid %w in errors.New* format strings
        run: ./scripts/check_error_wrap_verbs.sh

      - name: Cap tracing.WithLogMessage sites
        run: make lint-tracing-info

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # golangci typechecks (no -race) and the action caches its own build
      # artifacts, so restore the module cache only.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'

      # The Block Validation gap-proof tests sit behind the bvgaps build tag, which nothing else
      # compiles; vet them so a rename in the code they exercise fails the PR.
      - name: Vet gap-proof tests (bvgaps)
        run: make vet-bvgaps

      - name: golangci-lint with checkstyle report
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          args: --timeout=5m --disable gosec --disable prealloc --output.checkstyle.path=golangci-lint-report.xml --output.text.path=stdout

      - name: Upload golangci-lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golangci-lint-report
          path: golangci-lint-report.xml
          if-no-files-found: error
          retention-days: 1

  consensus-vectors:
    name: consensus-vectors
    # bitcoin-sv's script, transaction and signature hash vectors (test/consensus),
    # which make test skips with the rest of test/. Seconds, no -race.
    # arm64-safe: gobdk ships arm64 libraries.
    runs-on: teranode-runner-8-core-arm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Plain go test (no -race): module cache only.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'

      - name: Run consensus vectors
        run: make consensustest

  test-shard:
    name: test ${{ matrix.shard }}
    # make test is split across runners so no shard waits on a long tail of slow
    # packages. Under -race and coverage on one 16-core runner the seven slowest
    # packages each took 220-340 s and set the unit job's ~9 min wall time, so they
    # run in pairs on their own runners. A pair runs concurrently, so a shard costs
    # about its slower package. stores/utxo/aerospike keeps its own shard for its
    # testcontainer suite and memory. Every path in a shard's TEST_PKGS must also be
    # in the unit shard's TEST_EXCLUDE (and the reverse), or its tests run twice or
    # not at all; COVERAGE_SHARDS in the `test` job lists every shard.
    # The `test` job below is the required check.
    runs-on: teranode-runner-16-core-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            run: make test TEST_EXCLUDE="stores/utxo/aerospike services/blockvalidation model services/blockassembly/subtreeprocessor stores/utxo/utxoset services/blockassembly services/legacy/netsync services/blockchain stores/blockchain/sql" TEST_COVERPROFILE=coverage-unit.out
            profile: coverage-unit.out
          - shard: aerospike
            run: make test-pkgs TEST_PKGS=stores/utxo/aerospike TEST_COVERPROFILE=coverage-aerospike.out
            profile: coverage-aerospike.out
          - shard: blockvalidation
            run: make test-pkgs TEST_PKGS="services/blockvalidation model" TEST_COVERPROFILE=coverage-blockvalidation.out
            profile: coverage-blockvalidation.out
          - shard: subtreeprocessor
            run: make test-pkgs TEST_PKGS="services/blockassembly/subtreeprocessor stores/utxo/utxoset" TEST_COVERPROFILE=coverage-subtreeprocessor.out
            profile: coverage-subtreeprocessor.out
          - shard: blockassembly
            run: make test-pkgs TEST_PKGS="services/blockassembly services/legacy/netsync" TEST_COVERPROFILE=coverage-blockassembly.out
            profile: coverage-blockassembly.out
          - shard: blockchain
            run: make test-pkgs TEST_PKGS="services/blockchain stores/blockchain/sql" TEST_COVERPROFILE=coverage-blockchain.out
            profile: coverage-blockchain.out
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      # Only login to Docker Hub for internal PRs to avoid rate limits.
      # Fork PRs won't have access to secrets and will skip this step.
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run Go tests
        # Prints each test binary's peak memory at the end, even if the runner is shut down.
        run: .github/scripts/track-test-memory.sh ${{ matrix.run }}

      - name: Run heavy Go tests
        # Cases gated behind TERANODE_HEAVY_TESTS: minutes under -race and coverage,
        # seconds without.
        if: matrix.shard == 'unit'
        run: make test-heavy

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage-${{ matrix.shard }}
          path: ${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 1

  test:
    name: test
    # The required check. Fails unless every test shard passed, then merges their
    # coverage profiles into the coverage.out that the coverage gate and Sonar read.
    needs: test-shard
    # Runs when a shard fails or is skipped, so the check reports it, but not when
    # a newer push cancels the workflow.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Download coverage profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: go-coverage-*
          path: coverage-profiles
          merge-multiple: true

      - name: Merge coverage profiles
        # Every profile comes from -race (mode: atomic) with -coverpkg=./..., so a
        # block can appear in several; the coverage gate and Sonar count a block
        # covered when any copy of it is.
        # COVERAGE_SHARDS must name every test-shard matrix entry.
        env:
          COVERAGE_SHARDS: unit aerospike blockvalidation subtreeprocessor blockassembly blockchain
        run: .github/scripts/merge-coverage.sh coverage-profiles coverage.out $COVERAGE_SHARDS

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'

      - name: Check consensus package coverage
        # Fails when a consensus-critical package's statement coverage in the
        # merged coverage.out falls below its minimum.
        run: go run ./cmd/coveragegate -profile coverage.out -thresholds .github/consensus-coverage.txt

      - name: Require every test shard to pass
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          [ "$SHARDS_RESULT" = "success" ] || { echo "::error::Test shards finished with result: $SHARDS_RESULT"; exit 1; }

      # - name: Publish Test Summary Results
      #   if: always()
      #   run: npx github-actions-ctrf ctrf-report.json

  test-aerospike-native-ops:
    name: test aerospike native-ops (fork image)
    # Runs the aerospike store suite against the BSV fork of aerospike-server
    # with aerospike_use_native_teranode_ops enabled, asserting the startup
    # capability probe actually engages the native operate-path
    # (AEROSPIKE_EXPECT_NATIVE_OPS=true fails the store tests if it does not).
    # Gated on the AEROSPIKE_NATIVE_OPS_IMAGE repository variable so the job
    # is inert until the fork image is published to a registry CI can reach.
    if: vars.AEROSPIKE_NATIVE_OPS_IMAGE != ''
    runs-on: teranode-runner-8-core-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Login to GitHub Container Registry
        if: startsWith(vars.AEROSPIKE_NATIVE_OPS_IMAGE, 'ghcr.io/')
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run aerospike store suite with native ops
        env:
          AEROSPIKE_CONTAINER_IMAGE: ${{ vars.AEROSPIKE_NATIVE_OPS_IMAGE }}
          AEROSPIKE_CONTAINER_PLATFORM: linux/arm64
          AEROSPIKE_EXPECT_NATIVE_OPS: "true"
          SETTINGS_CONTEXT: test
        run: |
          go test -race -tags "testtxmetacache" -count=1 -timeout=15m ./stores/utxo/aerospike/...

  js-unit-tests:
    name: js unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Runs every *.test.js under services/ with node's built-in runner and
      # writes lcov for Sonar. Sonar scans another checkout, so the absolute
      # SF: paths are rewritten relative to the repository root.
      - name: Run JS unit tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'services/*.test.js')
          : > lcov.info
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JS unit tests under services/."
            exit 0
          fi
          node --test --experimental-test-coverage \
            --test-coverage-exclude='**/*.test.js' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            "${files[@]}"
          sed -i "s#^SF:${GITHUB_WORKSPACE}/#SF:#" lcov.info

      - name: Upload JS coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-coverage-report
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  filename-check-report:
    name: filename check report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Generate filename check report
        run: ./scripts/check_filenames.sh

      - name: Upload filename check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-filename-report
          path: sonar_filename_report.json
          if-no-files-found: error
          retention-days: 1

  # Fixed producer names keep the legacy downstream compatible during rollout.
  # Failed-job reruns also rerun dependents, so this job reselects each newest
  # producer artifact and seals the effective set into the current-attempt bundle.
  sonar-inputs:
    name: Aggregate Sonar inputs
    needs:
      - golangci-lint
      - test
      - filename-check-report
      - js-unit-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download golangci-lint report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: golangci-lint-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download filename check report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sonar-filename-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download JS coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: js-coverage-report
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Presence-only validation: never execute or parse artifact contents.
      - name: Validate required Sonar inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in coverage.out golangci-lint-report.xml sonar_filename_report.json lcov.info; do
            [ -f "$file" ] || {
              echo "::error::Missing required Sonar input file: $file"
              exit 1
            }
          done

      - name: Upload Sonar input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-inputs-${{ github.run_attempt }}
          path: |
            coverage.out
            golangci-lint-report.xml
            sonar_filename_report.json
            lcov.info
          if-no-files-found: error
          retention-days: 1
