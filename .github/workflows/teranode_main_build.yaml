name: Teranode main test build push

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - staging
      - release/*

jobs:
  # Tests and code lint
  test_and_lint:
    uses: ./.github/workflows/teranode_main_tests.yaml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  # A stable vX.Y.Z tag builds only when its completed release checklist, with a
  # Go decision, is on main. Branches and beta tags pass. See docs/howto/releaseProcess.md.
  release-checklist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Check the release checklist
        run: ./scripts/check-release-checklist.sh "${{ github.ref_type }}" "${{ github.ref_name }}" origin/main

  # Calculate version information
  calculate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      git_version: ${{ steps.version.outputs.git_version }}
      git_commit: ${{ steps.version.outputs.git_commit }}
      git_sha: ${{ steps.version.outputs.git_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0  # Fetch all history for tags
      - name: Calculate version
        id: version
        run: ./scripts/determine-git-version.sh

  # Run remote build and deploy workflow
  build-and-deploy:
    needs: [calculate-version, release-checklist]
    uses: bsv-blockchain/teranode-shared-workflows/.github/workflows/build_and_deploy.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      repository: ${{ github.repository }}
      tag_latest: true
      build_args: |
        GIT_VERSION=${{ needs.calculate-version.outputs.git_version }}
        GIT_COMMIT=${{ needs.calculate-version.outputs.git_commit }}
        GIT_SHA=${{ needs.calculate-version.outputs.git_sha }}
      architectures: '["amd64", "arm64"]'
      runner_labels: '{"amd64":"teranode-runner-16-core","arm64":"teranode-runner-16-core-arm","manifest":"ubuntu-latest"}'
    secrets: inherit
