name: Teranode main tests
on:
  workflow_call

env:
  REPO: teranode
  GO_VERSION: '1.27.0'
  # Disable testcontainers' Ryuk reaper sidecar — Docker Hub rate-limits and
  # gateway timeouts pulling testcontainers/ryuk:* are the dominant flake
  # source on CI. Ephemeral runners are torn down regardless, so the reaper
  # provides no value here. Tests already call container.Terminate() explicitly.
  TESTCONTAINERS_RYUK_DISABLED: "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  go-test:
    name: Go test ${{ matrix.shard }}
    # ARM runner (see teranode_pr_tests.yaml): more headroom for the heavy
    # `make test` -race+coverage compile; runs natively on arm64.
    runs-on: teranode-runner-16-core-arm
    # make test is split across runners. The slowest packages (200-340 s each under
    # -race and coverage) take about as long alone as beside the rest, so they are
    # bound by the clock, not by cores, and all run together in the slow shard. That
    # shard starts them at once instead of behind the rest of the build, and the unit
    # shard no longer waits for them. stores/utxo/aerospike keeps its own shard for
    # its testcontainer suite and memory. Every path in a shard's TEST_PKGS must also be
    # in the unit shard's TEST_EXCLUDE (and the reverse), or its tests run twice or
    # not at all; COVERAGE_SHARDS in the sonarqube job lists every shard.
    # .github/scripts/check-test-shards.sh checks both on every PR.
    # Unsplit, make test took ~18 min, and 15 min cancelled every main run from
    # 18 Nov 2026.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            run: make test TEST_EXCLUDE="stores/utxo/aerospike services/blockvalidation model services/blockassembly/subtreeprocessor stores/utxo/utxoset services/blockassembly services/legacy/netsync services/blockchain stores/blockchain/sql" TEST_COVERPROFILE=coverage-unit.out
            profile: coverage-unit.out
          - shard: aerospike
            run: make test-pkgs TEST_PKGS=stores/utxo/aerospike TEST_COVERPROFILE=coverage-aerospike.out
            profile: coverage-aerospike.out
          - shard: slow
            run: make test-pkgs TEST_PKGS="services/blockvalidation model services/blockassembly/subtreeprocessor stores/utxo/utxoset services/blockassembly services/legacy/netsync services/blockchain stores/blockchain/sql" TEST_COVERPROFILE=coverage-slow.out
            profile: coverage-slow.out
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The unit shard saves the module cache and the -race/coverage build cache.
      # The e2e-build-cache job below saves the end-to-end build cache, and
      # bench-build-cache the non-race benchmark build cache. All run only on the
      # default branch, so every PR job can read them back.
      - name: Restore and save Go caches
        uses: ./.github/actions/go-cache
        with:
          # Save only on the default branch. GitHub scopes caches by branch, so
          # only main's cache is readable by every PR. staging/release/tag builds
          # restore but don't write, leaving the 10 GB repo budget to main.
          # The two end-to-end caches count against the same budget: about
          # 840 MB compressed (4.0 GB on disk) for x86 and 430 MB (2.1 GB)
          # for ARM, one entry per architecture per day.
          save: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'unit' }}

      - name: Run Go tests
        # Prints each test binary's peak memory at the end, even if the runner is shut down.
        run: .github/scripts/track-test-memory.sh ${{ matrix.run }}

      # The unit shard is the only build-cache saver but no longer tests the
      # packages the other shards run, so compile their test binaries here too,
      # or every PR's slow and aerospike shards compile them from scratch.
      # TEST_PKGS is the unit shard's TEST_EXCLUDE (check-test-shards.sh checks it).
      - name: Build the other shards' test binaries into the Go build cache
        # PR runs never execute this step, so a failure here costs only cache
        # warmth, never main's tests, coverage upload or cache save.
        if: github.ref == 'refs/heads/main' && matrix.shard == 'unit'
        continue-on-error: true
        run: make test-build-pkgs TEST_PKGS="stores/utxo/aerospike services/blockvalidation model services/blockassembly/subtreeprocessor stores/utxo/utxoset services/blockassembly services/legacy/netsync services/blockchain stores/blockchain/sql"

      # Drop build-cache objects unused for 90+ min before the post-job save,
      # keeping the uploaded tarball under the 10 GB repo cache cap.
      - name: Trim Go build cache
        if: always()
        run: find ~/.cache/go-build -type f -mmin +90 -delete 2>/dev/null || true

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage-${{ matrix.shard }}
          path: ${{ matrix.profile }}
          retention-days: 1

  # Copies the module and build caches the unit shard just saved to GitHub's
  # cache into the S3 cache the self-hosted AWS runners read. Runs on the AWS saver
  # label, the only runner allowed to write to that bucket; its runner group
  # only accepts this workflow on refs/heads/main. Not needed once main's unit
  # shard itself runs on the saver label.
  go-cache-s3-sync:
    name: Go cache to S3
    if: github.ref == 'refs/heads/main'
    needs: go-test
    runs-on: bsva-aws-arm64-16-saver
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Copy Go caches to S3
        uses: ./.github/actions/go-cache
        with:
          s3_sync: 'true'

  # Saves the build cache the Benchmark Comparison jobs restore. Those jobs build
  # without -race on ubuntu-latest (amd64), so neither the -race cache above nor
  # anything built on this workflow's ARM runners can serve them.
  bench-build-cache:
    name: Benchmark build cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore and save Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          save_bench_build_cache: 'true'

      # Same packages and build flags as the bench jobs in benchmark-compare.yaml,
      # read from its matrix so a new group is cached without an edit here.
      - name: Build the benchmark test binaries without -race
        run: |
          pkgs=$(sed -n '/matrix:/,/steps:/p' .github/workflows/benchmark-compare.yaml \
            | grep -vE '^[[:space:]]*#' | grep -oE '[.]/[a-z][A-Za-z0-9_./-]*' | sort -u)
          echo "$pkgs"
          # One binary per package, so a later group whose package shares a base
          # name with another (go test -c -o dir/ refuses that) cannot break this job.
          for p in $pkgs; do
            go test -c -tags testtxmetacache -o "$RUNNER_TEMP/bench-bin/$(echo "$p" | tr '/.' '__').test" "$p"
          done

      # Drop entries this build did not use, as the unit job does for its cache.
      - name: Trim benchmark build cache
        run: |
          find ~/.cache/go-build-bench -type f -mmin +90 -delete 2>/dev/null || true
          du -sh ~/.cache/go-build-bench


  smoketest:
    name: smoketest
    runs-on: teranode-runner-8-core
    continue-on-error: true
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) misses every teranode package here.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run Smoke tests
        run: make smoketest
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload smoketest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoketest-results
          path: /tmp/teranode-test-results/smoketest-results.txt
          retention-days: 2

  prunertest:
    name: prunertest
    # arm64: aerospike (8.1, arm64), no SV-node (see teranode_pr_smoketests.yaml).
    runs-on: teranode-runner-8-core-arm
    continue-on-error: true
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) misses every teranode package here.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run Pruner tests
        run: make prunertest
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload prunertest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prunertest-results
          path: /tmp/teranode-test-results/prunertest-results.txt
          retention-days: 2

  # Saves the build cache the end-to-end jobs restore (smoke, sequential,
  # legacy-sync, prunertest, chainintegrity, here and in teranode_pr_smoketests.yaml).
  # It runs on both runner types those jobs use, and runs each compile those
  # jobs run with the same flags: the -race test builds, the non-race
  # go test -list the sharded smoke jobs use to pick their tests, and the
  # make install-tools build of gotestsum. The key holds the UTC date and the
  # go.mod hash, and actions/cache does not save over an existing key, so the
  # cache holds the compile of the first successful main run for that date and
  # go.mod. A PR reuses it for every package whose source and dependencies match
  # that run's commit; the rest, and everything that depends on them, still
  # compile.
  e2e-build-cache:
    name: e2e build cache (${{ matrix.runner }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [teranode-runner-8-core, teranode-runner-8-core-arm]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore and save Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          save_e2e_build_cache: 'true'

      # Flags must match the Makefile's smoketest, legacy-sync, prunertest and
      # chainintegrity targets (-race, no tags), the go test -list in
      # test/scripts/list_test_shard.sh (no -race, no tags; the PR smoke shards
      # run it before the tests) and the compile step of
      # test/scripts/run_tests_sequentially.sh. go test -c also caches the vet
      # results that go test computes before running.
      - name: Build the end-to-end test binaries
        run: |
          set -euo pipefail
          make install-tools
          out="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$out"
          for d in test/e2e/daemon/ready test/e2e/chainintegrity; do
            (cd "$d" && go test -c -race -o "$out/$(echo "$d" | tr '/' '_').test")
          done
          # The smoke and sequential shards run only on x86 runners.
          [ "$RUNNER_ARCH" = X64 ] || exit 0
          (cd test/e2e/daemon/ready && go test -list '.*' >/dev/null)
          for d in $(find ./test/sequentialtest -name '*_test.go' -exec dirname {} \; | sort -u); do
            (cd "$d" && go test -c -tags aerospike,native,memory,postgres,sqlite -race -o "$out/$(echo "$d" | tr '/.' '__').test")
          done

      # Drop entries this build did not use, as the unit job does for its cache.
      - name: Trim e2e build cache
        run: |
          find ~/.cache/go-build-e2e -type f -mmin +90 -delete 2>/dev/null || true
          du -sh ~/.cache/go-build-e2e

  sonarqube:
    name: Sonarqube
    runs-on: teranode-runner-8-core
    needs: go-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0

      - name: Download coverage profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: go-coverage-*
          path: coverage-profiles
          merge-multiple: true

      # Sonar reads coverage.out; a block that appears in several profiles counts
      # as covered when any copy is. COVERAGE_SHARDS must name every go-test
      # matrix entry.
      - name: Merge coverage profiles
        env:
          COVERAGE_SHARDS: unit aerospike slow
        run: .github/scripts/merge-coverage.sh coverage-profiles coverage.out $COVERAGE_SHARDS

      - name: Run filename check script
        run: |
          ./scripts/check_filenames.sh

      - name: Forbid %w in errors.New* format strings
        run: ./scripts/check_error_wrap_verbs.sh

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # golangci typechecks (no -race) and Sonar reads prebuilt reports, so
      # restore the module cache only.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'

      # Re-run golangci-lint separately without exiting on errors and generating a report for use in Sonar
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest
          args: --timeout=5m --disable gosec --disable prealloc --issues-exit-code=0 --output.checkstyle.path=golangci-lint-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
