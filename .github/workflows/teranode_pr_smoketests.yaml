name: Teranode PR smoke tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  REPO: teranode
  SETTINGS_CONTEXT_DEFAULT: test
  GO_VERSION: "1.26.0"

jobs:
  scope:
    name: compute test scope
    runs-on: teranode-runner-8-core-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.s.outputs.full }}
      run_smoke: ${{ steps.s.outputs.run_smoke }}
      run_chainintegrity: ${{ steps.s.outputs.run_chainintegrity }}
      run_seq: ${{ steps.s.outputs.run_seq }}
      seq_pkgs: ${{ steps.s.outputs.seq_pkgs }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - id: s
        uses: ./.github/actions/test-scope
        with:
          go-version: ${{ env.GO_VERSION }}
          force-full: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}

  smoketest:
    name: smoketest (shard ${{ matrix.shard }})
    needs: [scope]
    # A status function is REQUIRED for fail-open. Without one, a scope job that
    # dies at the runner/step level (checkout, setup-go, go-cache) - before the
    # action can fail open - makes this job SKIP, and a skipped required check
    # satisfies branch protection. `needs.scope.result != 'success'` turns that
    # into a full run instead of a silent pass.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full == 'true' || needs.scope.outputs.run_smoke == 'true') }}
    runs-on: teranode-runner-8-core
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # Only login to Docker Hub for internal PRs to avoid rate limits.
      # Fork PRs won't have access to secrets and will skip this step.
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run Smoke tests
        run: make smoketest SHARD=${{ matrix.shard }} TOTAL=3
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload smoketest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoketest-shard-${{ matrix.shard }}-results
          path: /tmp/teranode-test-results/smoketest-results.txt
          retention-days: 2

  prunertest:
    name: prunertest
    # Runs in test/e2e/daemon/ready (same package as smoke), so gated on run_smoke.
    needs: [scope]
    # A status function is REQUIRED for fail-open. Without one, a scope job that
    # dies at the runner/step level (checkout, setup-go, go-cache) - before the
    # action can fail open - makes this job SKIP, and a skipped required check
    # satisfies branch protection. `needs.scope.result != 'success'` turns that
    # into a full run instead of a silent pass.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full == 'true' || needs.scope.outputs.run_smoke == 'true') }}
    # arm64: TestPruner/TestBlobDeletion use aerospike (8.1, arm64) but no
    # SV-node, so this moves to arm unlike smoketest/legacy-sync/sequential.
    runs-on: teranode-runner-8-core-arm
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run Pruner tests
        run: make prunertest
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload prunertest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prunertest-results
          path: /tmp/teranode-test-results/prunertest-results.txt
          retention-days: 2

  legacy-sync:
    name: legacy-sync
    # Runs in test/e2e/daemon/ready (same package as smoke), so gated on run_smoke.
    needs: [scope]
    # A status function is REQUIRED for fail-open. Without one, a scope job that
    # dies at the runner/step level (checkout, setup-go, go-cache) - before the
    # action can fail open - makes this job SKIP, and a skipped required check
    # satisfies branch protection. `needs.scope.result != 'success'` turns that
    # into a full run instead of a silent pass.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full == 'true' || needs.scope.outputs.run_smoke == 'true') }}
    runs-on: teranode-runner-8-core
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run Legacy Sync tests
        run: make legacy-sync
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload legacy-sync results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-sync-results
          path: /tmp/teranode-test-results/legacy-sync-results.txt
          retention-days: 2

  chainintegrity:
    name: chainintegrity
    needs: [scope]
    # A status function is REQUIRED for fail-open. Without one, a scope job that
    # dies at the runner/step level (checkout, setup-go, go-cache) - before the
    # action can fail open - makes this job SKIP, and a skipped required check
    # satisfies branch protection. `needs.scope.result != 'success'` turns that
    # into a full run instead of a silent pass.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full == 'true' || needs.scope.outputs.run_chainintegrity == 'true') }}
    # arm64: no SV-node; images all arm64-capable (teranode multi-arch,
    # aerospike-server:8.1 arm64, postgres + redpanda arm64).
    runs-on: teranode-runner-8-core-arm
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run Chain Integrity tests
        run: make chainintegrity
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload chainintegrity results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chainintegrity-results
          path: /tmp/teranode-test-results/chainintegrity-results.txt
          retention-days: 2

  sequential:
    name: sequential (shard ${{ matrix.shard }})
    needs: [scope]
    # A status function is REQUIRED for fail-open. Without one, a scope job that
    # dies at the runner/step level (checkout, setup-go, go-cache) - before the
    # action can fail open - makes this job SKIP, and a skipped required check
    # satisfies branch protection. `needs.scope.result != 'success'` turns that
    # into a full run instead of a silent pass.
    # On a scope-job failure seq_pkgs is empty, which the runner reads as
    # "all packages" - so the fallback run is the full sequential suite.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full == 'true' || needs.scope.outputs.run_seq == 'true') }}
    runs-on: teranode-runner-8-core
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - name: Run sequential shard
        # On full runs SEQ_PKGS is empty → all sequential packages. On scoped runs
        # it restricts the shard to the affected packages. SEQ_PKGS comes in via
        # env (not ${{ }} interpolated into the run-line) so the tool-produced
        # package list can never be parsed as shell.
        run: make sequentialtest-shard SHARD=${{ matrix.shard }} TOTAL=7 SEQ_PKGS="$SEQ_PKGS"
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}
          SEQ_PKGS: ${{ needs.scope.outputs.seq_pkgs }}

      - name: Upload sequential shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sequentialtest-shard-${{ matrix.shard }}-results
          path: /tmp/teranode-test-results/sequentialtest-shard-${{ matrix.shard }}-results.txt
          retention-days: 2
