name: Teranode PR smoke tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  REPO: teranode
  SETTINGS_CONTEXT_DEFAULT: test
  GO_VERSION: "1.27.0"

jobs:
  # TEMPORARY, removed before review: saves the e2e cache in this PR's scope so a
  # re-run of the end-to-end jobs here can measure a hit.
  e2e-build-cache-trial:
    name: TRIAL e2e build cache (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [teranode-runner-8-core, teranode-runner-8-core-arm]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      - name: Restore and save Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          save_e2e_build_cache: 'true'

      # Flags must match the Makefile's smoketest, legacy-sync, prunertest and
      # chainintegrity targets (-race, no tags) and the compile step of
      # test/scripts/run_tests_sequentially.sh. go test -c also caches the vet
      # results that go test computes before running.
      - name: Build the end-to-end test binaries
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$out"
          for d in test/e2e/daemon/ready test/e2e/chainintegrity; do
            (cd "$d" && go test -c -race -o "$out/$(echo "$d" | tr '/' '_').test")
          done
          # The sequential shards run only on x86 runners.
          [ "$RUNNER_ARCH" = X64 ] || exit 0
          for d in $(find ./test/sequentialtest -name '*_test.go' -exec dirname {} \; | sort -u); do
            (cd "$d" && go test -c -tags aerospike,native,memory,postgres,sqlite -race -o "$out/$(echo "$d" | tr '/.' '__').test")
          done

      # Drop entries this build did not use, as the unit job does for its cache.
      - name: Trim e2e build cache
        run: |
          find ~/.cache/go-build-e2e -type f -mmin +90 -delete 2>/dev/null || true
          du -sh ~/.cache/go-build-e2e

  smoketest:
    name: smoketest (shard ${{ matrix.shard }})
    runs-on: teranode-runner-8-core
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # Only login to Docker Hub for internal PRs to avoid rate limits.
      # Fork PRs won't have access to secrets and will skip this step.
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) never matches these compiles.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run Smoke tests
        run: make smoketest SHARD=${{ matrix.shard }} TOTAL=3
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload smoketest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoketest-shard-${{ matrix.shard }}-results
          path: /tmp/teranode-test-results/smoketest-results.txt
          retention-days: 2

  prunertest:
    name: prunertest
    # arm64: TestPruner/TestBlobDeletion use aerospike (8.1, arm64) but no
    # SV-node, so this moves to arm unlike smoketest/legacy-sync/sequential.
    runs-on: teranode-runner-8-core-arm
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) never matches these compiles.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run Pruner tests
        run: make prunertest
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload prunertest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prunertest-results
          path: /tmp/teranode-test-results/prunertest-results.txt
          retention-days: 2

  legacy-sync:
    name: legacy-sync
    runs-on: teranode-runner-8-core
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) never matches these compiles.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run Legacy Sync tests
        run: make legacy-sync
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload legacy-sync results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-sync-results
          path: /tmp/teranode-test-results/legacy-sync-results.txt
          retention-days: 2

  chainintegrity:
    name: chainintegrity
    # arm64: no SV-node; images all arm64-capable (teranode multi-arch,
    # aerospike-server:8.1 arm64, postgres + redpanda arm64).
    runs-on: teranode-runner-8-core-arm
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) never matches these compiles.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run Chain Integrity tests
        run: make chainintegrity
        continue-on-error: false
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload chainintegrity results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chainintegrity-results
          path: /tmp/teranode-test-results/chainintegrity-results.txt
          retention-days: 2

  sequential:
    name: sequential (shard ${{ matrix.shard }})
    runs-on: teranode-runner-8-core
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: "false"

      # The e2e -race cache built on main for this runner's architecture; the
      # unit job's cache (ARM, with coverage) never matches these compiles.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'
          e2e_build_cache: 'true'

      - name: Run sequential shard
        run: make sequentialtest-shard SHARD=${{ matrix.shard }} TOTAL=7
        env:
          settings_context: ${{ env.SETTINGS_CONTEXT_DEFAULT }}

      - name: Upload sequential shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sequentialtest-shard-${{ matrix.shard }}-results
          path: /tmp/teranode-test-results/sequentialtest-shard-${{ matrix.shard }}-results.txt
          retention-days: 2
