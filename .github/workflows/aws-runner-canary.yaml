name: AWS runner canary

# Trial only: smoke-tests the self-hosted AWS spot runner trial.
# Runs on push to this branch only; never merged to main.
on:
  push:
    branches:
      - ci/aws-runner-canary

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        label:
          - bsva-aws-arm64-8
          - bsva-aws-arm64-16
          - bsva-aws-x64-8
          - bsva-aws-x64-16
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - name: Machine
        run: |
          set -x
          uname -m
          nproc
          free -g
          df -h /
          TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          for k in instance-type instance-life-cycle; do
            echo "$k: $(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/$k)"
          done

      - name: Docker, Buildx, Compose
        run: |
          set -x
          docker version
          docker buildx version
          docker compose version
          docker run --rm hello-world

      - name: Privileged container and sudo
        run: |
          set -x
          sudo -n true
          docker run --rm --privileged alpine:3 sh -c 'ip link add dummy0 type dummy && echo privileged-ok'

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go build (timing only)
        run: time go build ./...

  # Trial diagnostic: the Aerospike testcontainer exits at once on the AWS arm64
  # runners. Starts the image the way testcontainers-aerospike-go v0.4.0 does
  # (aerospike/aerospike-server:8.1, no env, command, mounts or ulimits, 3000/tcp
  # on a random host port) and prints the host settings and the container log.
  aerospike-diag:
    name: aerospike-diag
    runs-on: bsva-aws-arm64-16
    timeout-minutes: 15
    env:
      IMAGE: aerospike/aerospike-server:8.1
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          username: ${{ vars.DOCKER_ORG }}
          password: ${{ secrets.DOCKER_ORG_TOKEN }}

      - name: Host settings
        run: |
          set -x
          uname -srvmo || true
          ulimit -a || true
          ulimit -Hn || true
          cat /proc/sys/fs/file-max || true
          cat /proc/sys/fs/nr_open || true
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          stat -fc %T /sys/fs/cgroup || true
          grep -m1 -E 'Features|CPU part' /proc/cpuinfo || true
          lscpu || true
          free -m || true
          docker info 2>&1 | grep -vE '^ *(Name|ID):' || true
          systemctl show docker containerd -p LimitNOFILE || true
          cat /etc/docker/daemon.json || true

      - name: Aerospike as the tests run it
        run: |
          set -x
          docker pull "$IMAGE" || true
          docker run --rm "$IMAGE" sh -c 'ulimit -a; ulimit -Hn' || true
          docker run -d --name as-default -p 3000 "$IMAGE" || true
          sleep 15
          docker ps -a || true
          docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} ulimits={{.HostConfig.Ulimits}}' as-default || true
          docker logs as-default 2>&1 || true
          docker rm -f as-default || true

      - name: Aerospike with nofile=65536
        run: |
          set -x
          docker run --rm --ulimit nofile=65536:65536 "$IMAGE" sh -c 'ulimit -a; ulimit -Hn' || true
          docker run -d --name as-nofile --ulimit nofile=65536:65536 -p 3000 "$IMAGE" || true
          sleep 15
          docker ps -a || true
          docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} ulimits={{.HostConfig.Ulimits}}' as-nofile || true
          docker logs as-nofile 2>&1 || true
          docker exec as-nofile asinfo -v status || true
          docker rm -f as-nofile || true

  # Trial diagnostic for services/probe TestHistoryEndpointProjectsStage, which
  # fails on the AWS runners. Its first pipeline evaluation fsyncs the probe
  # state file under t.TempDir(); the test reads history ~100 ms later. This
  # measures fsync latency on TMPDIR and runs the test idle, under buffered
  # write load, and with TMPDIR on tmpfs, on an AWS and a GitHub-hosted runner.
  probe-fsync-diag:
    name: probe-fsync-diag (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        label:
          - bsva-aws-arm64-16
          - teranode-runner-16-core-arm
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache
        with:
          build_cache: 'false'

      - name: Disks and temp dirs
        run: |
          set -x
          echo "TMPDIR=${TMPDIR:-unset} RUNNER_TEMP=$RUNNER_TEMP"
          go env GOTMPDIR || true
          df -hT /tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /dev/shm || true
          findmnt -T /tmp || true
          findmnt -T "$GITHUB_WORKSPACE" || true
          lsblk -o NAME,TYPE,SIZE,MODEL,MOUNTPOINTS || true
          for q in /sys/block/*/queue/scheduler; do echo "$q: $(cat "$q")"; done || true
          cat /proc/sys/vm/dirty_ratio /proc/sys/vm/dirty_background_ratio /proc/sys/vm/dirty_expire_centisecs || true
          nproc; free -m

      - name: Build probe test binary (-race, as make test)
        run: go test -c -race -o "$RUNNER_TEMP/probe.test" ./services/probe

      - name: fsync latency and test runs
        shell: bash
        run: |
          # bash -e would stop at load_stop (kill/wait exit non-zero) before the tmpfs arm.
          set +e
          set -u
          cat > "$RUNNER_TEMP/fsync.py" <<'PY'
          import os, sys, time, tempfile
          d = sys.argv[1]; n = int(sys.argv[2]); lat = []
          for _ in range(n):
              fd, p = tempfile.mkstemp(dir=d)
              os.write(fd, b"x" * 2048)
              t = time.perf_counter(); os.fsync(fd); lat.append((time.perf_counter() - t) * 1000)
              os.close(fd); os.unlink(p)
          lat.sort()
          print("fsync %s n=%d p50=%.2fms p90=%.2fms p99=%.2fms max=%.2fms" % (d, n, lat[n//2], lat[n*9//10], lat[min(n-1, n*99//100)], lat[-1]))
          PY
          runs() {
            local label=$1 tmp=$2 pass=0 fail=0
            for _ in $(seq 1 10); do
              if (cd services/probe && TMPDIR="$tmp" "$RUNNER_TEMP/probe.test" -test.run '^TestHistoryEndpointProjectsStage$' -test.count=1 -test.timeout 60s > "$RUNNER_TEMP/run.log" 2>&1); then
                pass=$((pass+1))
              else
                fail=$((fail+1)); grep -m1 -A2 'expected:' "$RUNNER_TEMP/run.log" || tail -5 "$RUNNER_TEMP/run.log"
              fi
            done
            echo "RESULT $label TMPDIR=$tmp pass=$pass fail=$fail"
          }
          # Buffered write load: half the free space on /tmp, at most 12 GiB, so TempDir writes never hit ENOSPC.
          load_start() {
            local avail_mb count
            avail_mb=$(df -Pm /tmp | awk 'NR==2 {print $4}')
            count=$(( avail_mb / 2 < 12288 ? avail_mb / 2 : 12288 ))
            echo "load: ${count} MiB into /tmp (free ${avail_mb} MiB)"
            dd if=/dev/zero of=/tmp/probe-load bs=1M count="$count" status=none & LOAD=$!
            sleep 3
          }
          load_stop() { kill "$LOAD" 2>/dev/null || true; wait "$LOAD" 2>/dev/null || true; rm -f /tmp/probe-load; sync; }

          echo "== idle"
          python3 -I "$RUNNER_TEMP/fsync.py" /tmp 100
          python3 -I "$RUNNER_TEMP/fsync.py" /dev/shm 100
          runs idle /tmp

          echo "== buffered write load on /tmp"
          load_start
          python3 -I "$RUNNER_TEMP/fsync.py" /tmp 50
          runs load /tmp
          load_stop

          echo "== buffered write load on /tmp, test TMPDIR on tmpfs"
          load_start
          python3 -I "$RUNNER_TEMP/fsync.py" /dev/shm 50
          runs load /dev/shm
          load_stop
