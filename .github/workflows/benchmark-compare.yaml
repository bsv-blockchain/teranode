name: Benchmark Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  benchmarks:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache: false

      - name: Display PR branch info
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Run PR benchmarks
        run: |
          go test -bench=. -benchmem -benchtime=1s -short -timeout=30m -count=1 -run=^$ \
            -tags "testtxmetacache" \
            ./errors \
            ./model \
            ./services/asset/httpimpl \
            ./services/blockassembly \
            ./services/blockassembly/mining \
            ./services/blockassembly/subtreeprocessor \
            ./services/blockchain/work \
            ./services/blockpersister \
            ./services/blockvalidation \
            ./services/legacy/bsvec \
            ./services/legacy/bsvutil/hdkeychain \
            ./services/legacy/netsync \
            ./services/legacy/peer \
            ./services/subtreevalidation \
            ./services/validator \
            ./stores/blob/null \
            ./stores/blockchain/options \
            ./stores/blockchain/sql \
            ./stores/txmetacache \
            ./stores/utxo \
            ./stores/utxo/meta \
            ./test/consensus \
            ./ulogger \
            ./util \
            ./util/health \
            ./util/servicemanager \
            ./util/usql \
            | tee pr-benchmark-output.txt

      - name: Parse PR results
        run: |
          go run ./cmd/parse-benchmarks \
            -input pr-benchmark-output.txt \
            -output pr-benchmarks.json \
            -commit "${{ github.sha }}" \
            -branch "PR-${{ github.event.pull_request.number }}" \
            -pr "${{ github.event.pull_request.number }}"

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Display main branch info
        run: |
          echo "Branch: main"
          echo "Commit: $(cd main && git rev-parse HEAD)"

      - name: Run main benchmarks
        run: |
          cd main
          go test -bench=. -benchmem -benchtime=1s -short -timeout=30m -count=1 -run=^$ \
            -tags "testtxmetacache" \
            ./errors \
            ./model \
            ./services/asset/httpimpl \
            ./services/blockassembly \
            ./services/blockassembly/mining \
            ./services/blockassembly/subtreeprocessor \
            ./services/blockchain/work \
            ./services/blockpersister \
            ./services/blockvalidation \
            ./services/legacy/bsvec \
            ./services/legacy/bsvutil/hdkeychain \
            ./services/legacy/netsync \
            ./services/legacy/peer \
            ./services/subtreevalidation \
            ./services/validator \
            ./stores/blob/null \
            ./stores/blockchain/options \
            ./stores/blockchain/sql \
            ./stores/txmetacache \
            ./stores/utxo \
            ./stores/utxo/meta \
            ./test/consensus \
            ./ulogger \
            ./util \
            ./util/health \
            ./util/servicemanager \
            ./util/usql \
            | tee ../main-benchmark-output.txt

      - name: Capture baseline SHA
        id: baseline_sha
        run: echo "value=$(cd main && git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Parse main results
        run: |
          go run ./cmd/parse-benchmarks \
            -input main-benchmark-output.txt \
            -output main-benchmarks.json \
            -commit "${{ steps.baseline_sha.outputs.value }}" \
            -branch "main"

      - name: Compare benchmarks
        id: compare
        run: |
          go run ./cmd/compare-benchmarks \
            -current pr-benchmarks.json \
            -baseline main-benchmarks.json \
            -output benchmark-report.md \
            -threshold 5.0

      - name: Display report
        if: always()
        run: cat benchmark-report.md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            pr-benchmarks.json
            main-benchmarks.json
            benchmark-report.md
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('benchmark-report.md', 'utf8');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
