name: Benchmark Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  benchmarks:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: false

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Display PR branch info
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Run PR benchmarks
        run: |
          # Testing with blockassembly only; uncomment all packages once validated
          go test -bench=. -benchmem -benchtime=1s -short -timeout=30m -count=3 -run=^$ \
            -tags "testtxmetacache" \
            ./services/blockassembly \
            | tee pr-benchmark-output.txt

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Capture baseline SHA
        id: baseline_sha
        run: echo "value=$(cd main && git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Display main branch info
        run: |
          echo "Branch: main"
          echo "Commit: ${{ steps.baseline_sha.outputs.value }}"

      - name: Run main benchmarks
        run: |
          cd main
          go test -bench=. -benchmem -benchtime=1s -short -timeout=30m -count=3 -run=^$ \
            -tags "testtxmetacache" \
            ./services/blockassembly \
            | tee ../main-benchmark-output.txt

      - name: Compare benchmarks
        id: compare
        run: |
          go run ./cmd/compare-benchmarks \
            -baseline main-benchmark-output.txt \
            -current pr-benchmark-output.txt \
            -output benchmark-report.md \
            -threshold 10.0 \
            -alpha 0.05 \
            -baseline-sha "${{ steps.baseline_sha.outputs.value }}" \
            -current-sha "${{ github.sha }}" \
            -baseline-ref "main" \
            -current-ref "PR-${{ github.event.pull_request.number }}"

      - name: Display report
        if: always()
        run: cat benchmark-report.md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            pr-benchmark-output.txt
            main-benchmark-output.txt
            benchmark-report.md
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- benchmark-comparison-report -->';
            const body = marker + '\n' + fs.readFileSync('benchmark-report.md', 'utf8');
            const issue_number = context.payload.pull_request.number;

            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              // Update existing comment
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
              console.log('Created new comment');
            }
