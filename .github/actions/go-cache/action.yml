name: 'Go cache'
description: >
  Restore (and on main's saver jobs, save) the Go module cache
  (~/go/pkg/mod) and build caches (~/.cache/go-build, ~/.cache/go-build-e2e,
  ~/.cache/go-build-bench).

  GitHub Actions caches are branch-scoped: only caches written on the default
  branch are readable by all PRs. So only main-branch jobs save: the unit
  test job (save: 'true') saves the module cache and the -race/coverage
  build cache, the e2e-build-cache job (save_e2e_build_cache: 'true') saves
  the per-architecture end-to-end build cache, and the benchmark build cache
  job (save_bench_build_cache: 'true') saves the non-race benchmark build
  cache. Every other job restores only.

  Uses runs-on/cache, a drop-in for actions/cache: on the self-hosted AWS
  runners (RUNS_ON_S3_BUCKET_CACHE set in the runner's environment) it reads
  and writes an S3 bucket in the runners' region; everywhere else it falls
  back to GitHub's cache, exactly as actions/cache. On AWS only main's saver
  label can write to the bucket.

  The build cache key rotates daily (GO_CACHE_DATE) so it never goes stale for
  weeks at a time; restore-keys fall back to the most recent dated entry, then
  to any build cache for this OS.

inputs:
  s3_sync:
    description: >
      'true' only in main's go-cache-s3-sync job on the AWS saver runner: copy
      the module and build caches main just saved to GitHub's cache into the
      AWS runners' S3 cache, under the same keys. Restores nothing for a build.
    default: 'false'
  save:
    description: >
      'true' only on the main-branch unit test job, which saves the module
      cache and the -race/coverage build cache.
      'false' (default) everywhere else — restore only, no upload.
    default: 'false'
  build_cache:
    description: >
      Whether to include the build cache (~/.cache/go-build). The saver builds
      it with -race, and Go keys the build cache by build flags, so jobs that do
      NOT run -race (plain go build/test, golangci typecheck, benchmarks) get
      near-zero hits and just waste bandwidth on a multi-GB tarball. Set 'false'
      for those — the module cache (~/go/pkg/mod) is always restored regardless.
    default: 'true'
  e2e_build_cache:
    description: >
      'true' in the end-to-end test jobs (smoke, sequential, legacy-sync,
      prunertest, chainintegrity): restore the build cache that main's
      e2e-build-cache job builds without coverage on the same runner
      architecture, into ~/.cache/go-build-e2e, and point GOCACHE at it.
      The unit job's cache cannot serve them: it is built on ARM with
      -coverpkg=./..., which changes every teranode package's compile.
      Set build_cache: 'false' alongside it.
    default: 'false'
  save_e2e_build_cache:
    description: >
      'true' only in main's e2e-build-cache job: restore and save the
      end-to-end build cache.
    default: 'false'
  bench_build_cache:
    description: >
      Whether to use the benchmark build cache (~/.cache/go-build-bench): the
      benchmark packages built without -race and with -tags testtxmetacache on
      this runner's architecture, saved by the main-branch benchmark build cache
      job. The key is dated, so each day's entry holds the build of that day's
      first main run (per go.mod hash); later main runs that day hit it and do
      not save. 'true' also points GOCACHE at it and adds -trimpath to GOFLAGS
      for the rest of the job: without -trimpath Go keys each package by its
      directory, and the bench jobs build their base side in a subdirectory.
    default: 'false'
  save_bench_build_cache:
    description: >
      'true' only on the main-branch benchmark build cache job: restores and
      saves the benchmark build cache (implies bench_build_cache). Independent of
      save, so that job never saves the module cache.
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Compute Go cache date
      shell: bash
      run: echo "GO_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

    # --- GitHub cache -> S3 copy (main's go-cache-s3-sync job only) ---
    # actions/cache always talks to GitHub's cache, even on the AWS runners;
    # runs-on/cache/save writes to S3 there. Saved under the matched key, so S3
    # holds exactly what GitHub has.
    - name: Read Go module cache from GitHub's cache
      id: sync_mod
      if: inputs.s3_sync == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-

    - name: Write Go module cache to S3
      if: inputs.s3_sync == 'true' && steps.sync_mod.outputs.cache-matched-key != ''
      uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/go/pkg/mod
        key: ${{ steps.sync_mod.outputs.cache-matched-key }}

    - name: Read Go build cache from GitHub's cache
      id: sync_build
      if: inputs.s3_sync == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ hashFiles('**/go.mod') }}-
          gobuild-${{ runner.os }}-

    - name: Write Go build cache to S3
      if: inputs.s3_sync == 'true' && steps.sync_build.outputs.cache-matched-key != ''
      uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build
        key: ${{ steps.sync_build.outputs.cache-matched-key }}

    # --- restore-only path (PR jobs, every non-main job) ---
    - name: Restore Go module cache
      if: inputs.save != 'true' && inputs.s3_sync != 'true'
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-

    - name: Restore Go build cache
      if: inputs.save != 'true' && inputs.s3_sync != 'true' && inputs.build_cache == 'true'
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ hashFiles('**/go.mod') }}-
          gobuild-${{ runner.os }}-

    - name: Restore Go benchmark build cache
      id: bench_restore
      if: inputs.bench_build_cache == 'true' && inputs.save_bench_build_cache != 'true'
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build-bench
        key: gobuild-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-
          gobuild-bench-${{ runner.os }}-${{ runner.arch }}-

    # --- save path (authoritative savers only: main-branch jobs) ---
    # actions/cache registers a post-job step that uploads at job end, AFTER
    # the trim step in the caller has run. Saves only on a key miss (new day or
    # new go.sum/go.mod), so same-day reruns are no-ops.
    - name: Save Go module cache
      if: inputs.save == 'true'
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-

    - name: Save Go build cache
      if: inputs.save == 'true' && inputs.build_cache == 'true'
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ hashFiles('**/go.mod') }}-
          gobuild-${{ runner.os }}-

    # --- end-to-end build cache (see the e2e_build_cache input) ---
    # Keyed by architecture too: the x86 jobs (SV Node image is x86 only) and
    # the ARM jobs each get the cache built on their own runner type.
    - name: Restore Go e2e build cache
      if: inputs.e2e_build_cache == 'true' && inputs.save_e2e_build_cache != 'true'
      id: e2e-restore
      uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build-e2e
        key: gobuild-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-
          gobuild-e2e-${{ runner.os }}-${{ runner.arch }}-

    - name: Warn on a missed e2e build cache
      if: inputs.e2e_build_cache == 'true' && inputs.save_e2e_build_cache != 'true' && steps.e2e-restore.outputs.cache-matched-key == ''
      shell: bash
      run: echo "::warning::No end-to-end build cache for ${{ runner.arch }}; this job compiles its tests from scratch."

    - name: Save Go e2e build cache
      if: inputs.save_e2e_build_cache == 'true'
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build-e2e
        key: gobuild-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-
          gobuild-e2e-${{ runner.os }}-${{ runner.arch }}-

    - name: Use the e2e build cache
      if: inputs.e2e_build_cache == 'true' || inputs.save_e2e_build_cache == 'true'
      shell: bash
      run: echo "GOCACHE=$HOME/.cache/go-build-e2e" >> "$GITHUB_ENV"

    # A miss means every benchmark group compiles cold, so say so on the run page.
    - name: Report a benchmark build cache miss
      if: steps.bench_restore.outcome == 'success' && steps.bench_restore.outputs.cache-matched-key == ''
      shell: bash
      run: echo "::warning::No benchmark build cache restored; this job compiles from scratch."

    - name: Save Go benchmark build cache
      if: inputs.save_bench_build_cache == 'true'
      uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
      with:
        path: ~/.cache/go-build-bench
        key: gobuild-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-${{ env.GO_CACHE_DATE }}
        restore-keys: |
          gobuild-bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod') }}-
          gobuild-bench-${{ runner.os }}-${{ runner.arch }}-

    - name: Point GOCACHE at the benchmark build cache
      if: inputs.bench_build_cache == 'true' || inputs.save_bench_build_cache == 'true'
      shell: bash
      run: |
        echo "GOCACHE=$HOME/.cache/go-build-bench" >> "$GITHUB_ENV"
        echo "GOFLAGS=${GOFLAGS:+$GOFLAGS }-trimpath" >> "$GITHUB_ENV"
