syntax = "proto3";

// Version: v1 (implicit). No version suffix; the unsuffixed name IS v1. A
// breaking change adds the next suffixed version (v2) alongside it -- see
// docs/references/protoVersioning.md.
package pruner;

option go_package = "github.com/bsv-blockchain/teranode/services/pruner/pruner_api";

service PrunerAPI {
  rpc HealthGRPC(EmptyMessage) returns (HealthResponse) {}
}

message EmptyMessage {}

message HealthResponse {
  bool ok = 1;
  string details = 2;
}
