syntax = "proto3";

option go_package = "./;asset_api";

// Version: v1 (implicit). No version suffix; the unsuffixed name IS v1. A
// breaking change adds the next suffixed version (v2) alongside it -- see
// docs/references/protoVersioning.md.
package asset_api;

// swagger:enum Type
enum Type {
  NotUsedPING = 0; // Deprecated, previously used for WebSocket keepalive (not a P2P message)
  Subtree = 1;
  Block = 2;
  NotUsedMiningOn = 3; // Deprecated, previously used for MiningOn
  NodeStatus = 4;
}
