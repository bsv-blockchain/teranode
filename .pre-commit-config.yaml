repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
        # mkdocs.yml uses !!python/name: tags that yaml.safe_load cannot
        # construct; the docs-deploy workflow validates it via mkdocs build.
        # Newer hook revs (checked up to v6.0.0) still safe-load by default and
        # fail identically, so the exclusion is not a version-skew artefact.
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: golangci-lint
        name: Run go linter
        entry: golangci-lint run --new-from-rev=HEAD ./...
        language: system
        types: [ go ]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        entry: markdownlint
        language: node
        files: \.md$
        args: ["--config", ".markdownlint.yml"]
